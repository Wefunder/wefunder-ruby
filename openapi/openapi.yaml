            application/json:
              schema:
                $ref: '#/components/schemas/CampaignListEnvelope'
              example:
                data:
                  - id: ofr_8Kd0aB3xQ9k2vF8mNp1zT5wY
                    type: campaign
                    attributes:
                      state: active
                      company_id: 101
                      company: co_8Kd0aB3xQ9k2vF8mNp1zT5wY
                      company_name: My Startup Inc.
                      company_url: my-startup-inc
