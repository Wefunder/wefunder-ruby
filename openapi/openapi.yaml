        - Generate reports on campaign performance
        - Integrate campaign data into your own tools

        Only founders with the appropriate permissions can access this endpoint. The response includes
        both active and closed campaigns, with detailed metrics for each.
      operationId: listCampaigns
      security:
        - bearerAuth:
            - read:offerings
      parameters:
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: |-
            // Campaigns for companies where the authenticated user is a founder.
            const page = await wf.campaigns.list();
            for (const campaign of page.data ?? []) {
              console.log(campaign.id, campaign.attributes?.company_name, campaign.attributes?.amount_raised);
            }

            // Or stream every campaign lazily, one page fetched at a time:
            for await (const campaign of wf.campaigns.all()) {
              console.log(campaign.attributes?.state);
            }
