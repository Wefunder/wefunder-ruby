      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: 'await wf.unwrap(wf.raw.deleteWebhookSubscription({ path: { campaign_id: 1234, webhook_id: 56 } }));'
  /campaigns/{campaign_id}/attribution/webhooks/{webhook_id}/test:
    post:
      tags:
        - Attribution Webhooks
      summary: Send test webhook
      description: |
        Sends a test webhook to verify your endpoint is working correctly.
        The test payload includes a `"event": "test"` field to distinguish
        it from real events.
      operationId: testWebhookSubscription
      security:
        - bearerAuth:
            - read:attribution:anonymized
      parameters:
        - $ref: '#/components/parameters/campaign_id'
        - $ref: '#/components/parameters/webhook_id'
      responses:
        '200':
          description: Test webhook queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestResultEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Subscription is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: |-
            const result = await wf.unwrap(
              wf.raw.testWebhookSubscription({ path: { campaign_id: 1234, webhook_id: 56 } }),
            );
            console.log(result.data);
  /campaigns/{campaign_id}/attribution/webhooks/{webhook_id}/regenerate_secret:
    post:
      tags:
        - Attribution Webhooks
      summary: Regenerate webhook signing secret
      description: |
        Generates a new HMAC signing secret for the webhook subscription.
        The old secret is immediately invalidated.

        **Important**: Store the new secret securely - it cannot be retrieved later.
      operationId: regenerateWebhookSecret
      security:
        - bearerAuth:
            - read:attribution:anonymized
      parameters:
        - $ref: '#/components/parameters/campaign_id'
        - $ref: '#/components/parameters/webhook_id'
      responses:
        '200':
          description: Secret regenerated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionWithSecret2Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /campaigns/{campaign_id}/attribution/webhooks/{webhook_id}/reactivate:
    post:
      tags:
        - Attribution Webhooks
      summary: Reactivate disabled webhook
      description: |
        Reactivates a webhook subscription that was auto-disabled after
        consecutive failures. Resets the failure counter to 0.

        Use this after fixing issues with your webhook endpoint.
      operationId: reactivateWebhookSubscription
      security:
        - bearerAuth:
            - read:attribution:anonymized
      parameters:
        - $ref: '#/components/parameters/campaign_id'
        - $ref: '#/components/parameters/webhook_id'
      responses:
        '200':
          description: Webhook reactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Webhook is already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /attribution/me:
    get:
      tags:
        - Attribution Partners
      summary: Get current user's attribution profile
      description: |
        Returns the authenticated user's marketing partner profile and connected campaigns.
        If the user is not registered as a marketing partner, returns partner info as null.
      operationId: getAttributionMe
      security:
        - bearerAuth:
            - read:attribution:aggregate
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionMeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: |-
            const me = await wf.attribution.me();
            console.log(me);
  /attribution/campaigns:
    get:
      tags:
        - Attribution Partners
      summary: List campaigns accessible to the current user
      description: |
        Returns all campaigns the authenticated user can access for attribution data.
        For founders, this includes their own campaigns.
        For marketing partners, this includes campaigns they've been granted access to.
      operationId: listAttributionCampaigns
      security:
        - bearerAuth:
            - read:attribution:aggregate
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionCampaignSummaryListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: |-
            const campaigns = await wf.unwrap(wf.raw.listAttributionCampaigns());
            console.log(campaigns.data);
  /attribution/partners/register:
    post:
      tags:
        - Attribution Partners
      summary: Register as a marketing partner
      description: |
        Registers the authenticated user as a marketing partner.
        After registration, the partner can create invites to request access to campaigns.
      operationId: registerAsPartner
      security:
        - bearerAuth:
            - read:attribution:aggregate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - company_name
              properties:
                company_name:
                  type: string
                  description: Name of the marketing/agency company
                  example: Acme Marketing Agency
                website:
                  type: string
                  format: uri
                  description: Company website URL
                  example: https://acme-marketing.com
      responses:
        '201':
          description: Partner registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingPartnerEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Already registered or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /attribution/invites:
    get:
      tags:
        - Attribution Partners
      summary: List partner invites
      description: |
        Returns all invites created by or sent to the authenticated user.
        Includes both pending and accepted invites.
      operationId: listPartnerInvites
      security:
        - bearerAuth:
            - read:attribution:aggregate
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerInviteListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Attribution Partners
      summary: Create a partner invite
      description: |
        Creates an invite to establish a partner-company connection.

        **Directions**:
        - `partner_to_founder`: Marketing partner invites a founder to grant access
        - `founder_to_partner`: Founder invites a marketing partner to access their campaign

        For `partner_to_founder`: Creates a shareable invite link.
        For `founder_to_partner`: Sends an email to the partner.
      operationId: createPartnerInvite
      security:
        - bearerAuth:
            - read:attribution:aggregate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - direction
              properties:
                direction:
                  type: string
                  enum:
                    - partner_to_founder
                    - founder_to_partner
                company_id:
                  type: integer
                  description: Required for founder_to_partner direction
                partner_email:
                  type: string
                  format: email
                  description: Required for founder_to_partner direction
                access_level:
                  type: integer
                  default: 1
                  description: 1=anonymized (default), 2=detailed (future)
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerInviteEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not authorized to create this invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /attribution/invites/{token}:
    delete:
      tags:
        - Attribution Partners
      summary: Revoke a partner invite
      description: |
        Revokes a pending invite. Only the creator can revoke an invite.
        Accepted invites cannot be revoked (delete the connection instead).
      operationId: revokePartnerInvite
      security:
        - bearerAuth:
            - read:attribution:aggregate
      parameters:
        - name: token
          in: path
          required: true
          description: The invite token
          schema:
            type: string
      responses:
        '204':
          description: Invite revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not authorized to revoke this invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Invite not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: OAuth 2.0 authorization with access tokens
      flows:
        authorizationCode:
          authorizationUrl: https://wefunder.com/oauth/authorize
          tokenUrl: https://api.wefunder.com/oauth/token
          scopes:
            read:public: Read public deal data (explore offerings); requires no user context
            read:explore: See the deals the authorizing user can see on wefunder.com/explore (public plus accredited-only / invited rounds they qualify for); user tokens only
            read:mcp: Umbrella granted to AI agents connecting through the Wefunder MCP server; implies the read scopes the MCP tools need (read:explore, read:profile, read:syndicates, read:companies, read:offerings). Not self-serve.
            read:profile: Read user profile information
            read:investments: Read user investment data
            read:campaigns: Read campaign information for companies you founded
            read:attribution:aggregate: Read aggregate attribution statistics (Tier 0)
            read:attribution:anonymized: Read anonymized attribution data (Tier 1 - requires approval)
            read:attribution:full: Read full attribution data with investor PII (Tier 2 - founders only)
            admin:attribution: Administrative access to attribution system (Tier 3 - Wefunder admins only)
            read:syndicates: View syndicates, members, deals, and portfolio
            write:syndicates: Manage members, update settings, operate on deals
            read:spvs: View partner SPVs, their invites, sessions, and investments
            write:spvs: Create and manage partner SPVs, invites, and investment sessions
            read:webhooks: View webhook subscriptions
            write:webhooks: Create, update, and delete webhook subscriptions
            read:installations: View where your app is installed
            write:installations: Install and uninstall your app on companies and syndicates you can edit
        clientCredentials:
          tokenUrl: https://api.wefunder.com/oauth/token
          scopes:
            read:public: Read public deal data. The only scope a server-side (client_credentials) key may hold — it acts as the app, with no user, so it can never read user-scoped data.
  parameters:
    wefunder_version:
      name: Wefunder-Version
      in: header
      required: false
      description: |
        Dated API version (`YYYY-MM-DD`). Omit to use your application's pinned version.
        Unknown values return `400 invalid_request`. Every response echoes the resolved
        version in `Wefunder-Version` and the newest in `Wefunder-Version-Latest`.
      schema:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      example: '2026-10-01'
    campaign_id:
      name: campaign_id
      in: path
      required: true
      description: The fundraise/campaign ID
      schema:
        type: integer
      example: 789
    syndicate_id:
      name: syndicate_id
      in: path
      required: true
      description: The syndicate's id (`syn_...`).
      schema:
        type: string
      example: syn_aB3xQ9k2vF8mNp1zT5wY7Qc4
    member_id:
      name: member_id
      in: path
      required: true
      description: The member's id (`mem_...`), as returned by the members list (`data[].id`). Integer ids are internal and not accepted.
      schema:
        type: string
      example: mem_aB3xQ9k2vF8mNp1zT5wY7Qc4
    fundraise_id:
      name: fundraise_id
      in: path
      required: true
      description: The deal's id (`ofr_...`), as returned by the deals list. Integer ids are internal and not accepted.
      schema:
        type: string
      example: ofr_yw3OhusvpfJP4Pk3wRYV1F2R
    start_date:
      name: start_date
      in: query
      description: |
        Filter results to attributions on or after this date. Format: YYYY-MM-DD.
        Defaults to 90 days ago if not specified.
      schema:
        type: string
        format: date
      example: '2025-01-01'
    end_date:
      name: end_date
      in: query
      description: |
        Filter results to attributions on or before this date. Format: YYYY-MM-DD.
        Defaults to today if not specified.
      schema:
        type: string
        format: date
      example: '2025-03-31'
    utm_source:
      name: utm_source
      in: query
      description: Filter by UTM source (e.g., "GoogleAds", "facebook", "Klaviyo")
      schema:
        type: string
      example: GoogleAds
    utm_campaign:
      name: utm_campaign
      in: query
      description: Filter by UTM campaign name
      schema:
        type: string
      example: winter_2025
    cursor:
      name: cursor
      in: query
      description: |
        Cursor-based pagination token. Use the `next_cursor` value from the previous response's
        `meta` object to retrieve the next page of results. Omit this parameter to retrieve the
        first page.
      schema:
        type: integer
      example: 12345
    webhook_external_id:
      name: external_id
      in: path
      required: true
      description: The webhook endpoint's id (whe_...).
      schema:
        type: string
      example: whe_8f3ExampleEndpoint00
    webhook_id:
      name: webhook_id
      in: path
      required: true
      description: The webhook subscription ID
      schema:
        type: integer
      example: 123
    spv_id:
      name: id
      in: path
      required: true
      description: The SPV ID (prefixed, e.g. `spv_abc123`)
      schema:
        type: string
      example: spv_abc123
    invite_link_id:
      name: invite_link_id
      in: path
      required: true
      description: The invite link ID (prefixed, e.g. `il_abc123`)
      schema:
        type: string
      example: il_abc123
    investment_session_id:
      name: session_id
      in: path
      required: true
      description: The investment session ID (prefixed, e.g. `is_abc123`)
      schema:
        type: string
      example: is_abc123
    partner_investment_id:
      name: id
      in: path
      required: true
      description: The investment ID (prefixed, e.g. `invt_def456`)
      schema:
        type: string
      example: invt_def456
    webhook_subscription_id:
      name: id
      in: path
      required: true
      description: The webhook subscription ID (prefixed, e.g. `whs_abc123`)
      schema:
        type: string
      example: whs_abc123
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A unique client-generated key that makes a write request safe to retry. If a request
        is retried within 24 hours with the same key and body, the original result is returned
        instead of performing the operation again. Strongly recommended on all `POST` requests
        that create resources.
      schema:
        type: string
      example: acme-series-a-2025-001
  schemas:
    Installation:
      type: object
      properties:
        id:
          type: string
          description: Installation external id (`inst_…`).
        type:
          type: string
          example: installation
        attributes:
          type: object
          properties:
            target:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - company
                    - syndicate
                id:
                  type: string
                  description: '`co_…` or `syn_…`'
                name:
                  type: string
            tier:
              type: string
              description: founder / admin / editor for a company; full_access / operator for a syndicate.
            scopes:
              type: array
              items:
                type: string
            status:
              type: string
              enum:
                - active
                - revoked
            installed_at:
              type: string
              format: date-time
            installed_by:
              type: string
              nullable: true
            revoked_at:
              type: string
              format: date-time
              nullable: true
    InstallationEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Installation'
        meta:
          type: object
    InstallationListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Installation'
        meta:
          type: object
          properties:
            count:
              type: integer
    InstallationTokenEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Installation'
        token:
          type: object
          description: Shown once. Owned by the installed-on company or syndicate, scoped to the install, no expiry; revoking the install revokes it.
          properties:
            access_token:
              type: string
              example: at_live_…
            token_type:
              type: string
              example: Bearer
            scope:
              type: string
            installation:
              type: string
              description: '`inst_…`'
            created_at:
              type: integer
        meta:
          type: object
    EligibleTargetListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - company
                  - syndicate
              id:
                type: string
              name:
                type: string
              tier:
                type: string
                description: The tier an install would be granted at.
              installed:
                type: boolean
              installation:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/Installation'
        meta:
          type: object
    WebhookEndpoint:
      type: object
      properties:
        id:
          type: string
          example: whe_8f3ExampleEndpoint00
        type:
          type: string
          example: webhook_endpoint
        attributes:
          type: object
          properties:
            url:
              type: string
              format: uri
            mode:
              type: string
              enum:
                - live
                - test
            events:
              type: array
              items:
                type: string
            enabled:
              type: boolean
            secret:
              type: string
              description: Signing secret. Present only in create and rotate_secret responses.
            failing_since:
              type: string
              format: date-time
              nullable: true
            last_delivery_at:
              type: string
              format: date-time
              nullable: true
            last_delivery_status:
              type: string
              nullable: true
              description: |
                Outcome of the most recent delivery: the HTTP status code as a string (for
                example `"200"` or `"503"`), or, when no response came back, one of
                `timeout`, `blocked_url`, `tls_error`, `connection_failed`.
              example: '200'
            created_at:
              type: string
              format: date-time
    WebhookEndpointEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/WebhookEndpoint'
        meta:
          type: object
          properties:
            request_id:
              type: string
    WebhookEndpointListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
        meta:
          type: object
          properties:
            count:
              type: integer
            quota:
              type: integer
              description: Maximum endpoints allowed for this application.
            request_id:
              type: string
    WebhookEndpointTestResultEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              example: webhook_test
            delivered:
              type: boolean
            response_code:
              type: integer
              nullable: true
            error:
              type: string
              nullable: true
              enum:
                - timeout
                - blocked_url
                - tls_error
                - connection_failed
                - null
              description: |
                Why no HTTP response came back. `null` when the endpoint responded, even with a
                non-2xx status (see `response_code`). `blocked_url` means the URL failed the
                HTTPS/public-address check at send time.
            duration_ms:
              type: integer
            event:
              type: string
            payload:
              type: object
              description: The exact signed envelope that was POSTed.
        meta:
          type: object
          properties:
            request_id:
              type: string
    InvestmentChangeListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InvestmentDeltaRecord'
        meta:
          type: object
          properties:
            mode:
              type: string
              enum:
                - bootstrap
                - delta
            has_more:
              type: boolean
            next_cursor:
              type: string
              description: Always present. Pass it back as `cursor` on the next call, even when `has_more` is false.
            page_count:
              type: integer
            company_id:
              type: string
    InvestmentDeltaRecord:
      type: object
      description: |
        The record of one investment, or a tombstone (`visible: false`, only `id`). `visible` is
        founder visibility: a user's own canceled investment is a full record with `visible: false`
        and `status: canceled`. Investor PII keys are omitted without `read:investors:pii`, except on
        the user's own records.
      required:
        - id
        - visible
        - observed_at
      properties:
        id:
          type: string
          description: Investment external id (`inv_…`), stable for the life of the investment.
        visible:
          type: boolean
        status:
          type: string
          enum:
            - reserved
            - active
            - executed
            - canceled
            - converted
          description: Company/offering audiences receive canceled and converted investments as tombstones; the values appear for audiences that can see them (e.g. the investor's own).
        converted_to:
          type: string
          nullable: true
        converted_from:
          type: string
          nullable: true
        offering:
          type: string
          description: Offering external id (`ofr_…`).
        company:
          type: string
          description: Company external id (`co_…`).
        investment_type:
          type: string
        offering_type:
          type: string
        group:
          type: string
          description: The founder dashboard's investment group label (e.g. CONFIRMED, IS READY).
        applied_at:
          type: string
          format: date-time
        amounts:
          type: object
          properties:
            committed_cents:
              type: integer
            investment_size_cents:
              type: integer
            in_escrow_cents:
              type: integer
            raised_cents:
              type: integer
              description: What this investment contributes to the offering's public raised figure (the deal page, company card and directory header). Equals `investment_size_cents` once the investment is soft-confirmed; 0 until then (see `needs_whitelisting`). Summing `raised_cents` over an offering's records reproduces the site's number; summing `committed_cents` does not.
            currency:
              type: string
              example: usd
        shares:
          type: string
          nullable: true
          description: Shares this investment buys at its committed amount, as a decimal string (`"295"`, `"1234.5"`). For an investment through the SPV this is the company shares allotted to it through the vehicle. `null` when the round has no share concept (SAFE, note, reservation) or no shares are computed for the investment. Computed per investment; not the investor's post-funding position.
          example: '295'
        average_share_price:
          type: string
          nullable: true
          description: Weighted average price per share for this investment (total share price / `shares`), as a decimal string. With tiered or early-bird pricing this need not equal any single price on the round. `null` whenever `shares` is `null`.
          example: '3.38'
        needs_whitelisting:
          type: boolean
        external_username:
          type: string
          nullable: true
          description: PII scope.
        message:
          type: string
          nullable: true
          description: PII scope.
        investor:
          type: object
          properties:
            id:
              type: string
              description: Investor external id (`usr_…`).
            deactivated:
              type: boolean
              description: |
                True once the investor's Wefunder account has been deactivated. The identity fields are then
                redacted (`name`/`legal_name` = `[deleted user]`, the rest null) and the record is republished
                with `reason: investor_deactivated`; overwrite your copy. The investment itself persists.
            via_entity:
              type: boolean
            name:
              type: string
              description: PII scope.
            legal_name:
