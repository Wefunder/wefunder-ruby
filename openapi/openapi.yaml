  /companies/{company_id}/investments/changes:
    get:
      tags:
        - Investment Delta
      summary: 'Legacy alias: bootstrap or page investment changes for a company'
      deprecated: true
      description: |
        **Compatibility alias.** This path keeps working unchanged for partners already on it,
        but new integrations should use [List or sync investments](/api-reference/list-investments)
        (`GET /investments?company_id=…`): same records, interchangeable cursors. The
        [migration notes](/partner-api/investments/changes#migrating-from-companiescompany_idinvestmentschanges)
        list the differences.

        The Investment Delta API: keep a copy of a company's investment records in sync by
        polling. Call without `cursor` to **bootstrap** (list every current record for the
        company); every response carries `meta.next_cursor`; call again with that cursor to
        receive only the records whose published state changed since. Records are the same
        shape in both modes.

        - Records are **published state**, not live rows: Wefunder publishes a record when the
          investment's founder-visible state changes, and serves exactly what was published.
        - `visible: false` records are **tombstones**: the investment is no longer visible to the
          company (canceled, converted to another round, hidden, or deleted). Delete your copy.
        - Apply records in `cursor` order. `observed_at` is when the payload was observed, not a
          version; a record you read late carries the *current* published state.
        - **410 Gone** means your cursor predates the 90-day retention window. Bootstrap again and
          **replace** your dataset for the company from the result (records absent from the
          bootstrap are deleted).
        - Investor identity fields (`investor.name`, `investor.legal_name`, `investor.email`,
          `investor.address`, `investor.bio`, `message`, `external_username`) are **omitted**
          unless the token carries `read:investors:pii`.
        - Money is integer minor units plus `amounts.currency` (`committed_cents`,
          `investment_size_cents`, `in_escrow_cents`, `contracts[].override_amount_cents`).
          `shares` and `average_share_price` are decimal strings, `null` on rounds without shares.
          `amounts.raised_cents` is the row's contribution to the public raised figure (0 while
          `needs_whitelisting`); sum it, not `committed_cents`, to match the deal page.
      operationId: listCompanyInvestmentChanges
      security:
        - bearerAuth:
            - read:investments
        - bearerAuth:
            - read:companies
      parameters:
        - name: company_id
          in: path
          required: true
          description: The company's external id (`co_…`).
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: |
            Opaque cursor from a previous response's `meta.next_cursor`. Omit to bootstrap.
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          description: Records per page, 1–100 (default 25). Delta pages count distinct investments.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: A page of records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentChangeListEnvelope'
              example:
                data:
                  - id: string
                    visible: true
                    status: reserved
                    converted_to: string
                    converted_from: string
                    offering: string
                    company: string
                    investment_type: string
                    offering_type: string
                    group: string
                    applied_at: '2026-01-15T17:30:00Z'
                    amounts:
                      committed_cents: 1
                      investment_size_cents: 1
                      in_escrow_cents: 1
                      raised_cents: 1
                      currency: usd
                    shares: '295'
                    average_share_price: '3.38'
                    needs_whitelisting: true
                    external_username: string
                    message: string
                    investor:
                      id: string
                      deactivated: true
                      via_entity: true
                      name: string
                      legal_name: string
                      email: string
                      address: {}
                      bio: string
                    blockers:
                      - key: string
                        description: string
                    contracts:
                      - name: string
                        override_amount_cents: 1
                        early_bird: true
                    observed_at: '2026-01-15T17:30:00Z'
                    cursor: string
                    reason: changed
                meta:
                  mode: bootstrap
                  has_more: true
                  next_cursor: string
                  page_count: 1
                  company_id: string
        '400':
          description: Malformed cursor.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Token lacks both `read:investments` and `read:companies`, or the user cannot edit this company.
        '410':
          description: |
            The cursor is older than the retention window. Bootstrap again (no cursor) and replace
            your stored records for this company.
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: |-
            // Walk every change for one company. Persist meta.next_cursor after each page — it is
            // always present, even on the last page — and pass it back next sync for only what changed.
            let cursor: string | undefined;
            do {
              const page = await wf.unwrap(
                wf.raw.listCompanyInvestmentChanges({ path: { company_id: companyId }, query: { cursor, per_page: 50 } }),
              );
              for (const record of page.data ?? []) console.log(record.id, record.visible);
              cursor = page.meta?.next_cursor;
              if (!page.meta?.has_more) break;
            } while (cursor);
        - lang: Python
          label: wefunder
          source: |-
            # Walk every change for one company. Persist meta.next_cursor after each page — it is
            # always present, even on the last page — and pass it back next sync for only what changed.
            cursor: str | None = None
            while True:
                page = wf.call(list_company_investment_changes, company_id=company_id, cursor=cursor, per_page=50)
                for record in page.data:
                    print(record.id, record.visible)
                cursor = page.meta.next_cursor
                if not page.meta.has_more:
                    break
        - lang: Ruby
          label: wefunder
          source: |-
            # Walk every change for one company. Persist meta.next_cursor after each page — it is
            # always present, even on the last page — and pass it back next sync for only what changed.
            cursor = nil
            loop do
              page = wf.wrap { wf.raw.investment_delta.list_company_investment_changes(company_id, cursor: cursor, per_page: 50) }
              page.data.each { |record| puts "#{record.id} #{record.visible}" }
              cursor = page.meta.next_cursor
              break unless page.meta.has_more
            end
