openapi: 3.0.1
info:
  title: Wefunder API v2
  description: |
    OAuth 2.0 API for accessing Wefunder data programmatically.

    ## Authentication

    This API uses OAuth 2.0 for authentication. To get started:

    1. Create an OAuth application at `/oauth/applications`
    2. Get your Client ID and Client Secret
    3. Implement the OAuth 2.0 Authorization Code flow
    4. Use the access token to make API requests

    ## Versioning

    The API is versioned by the dated `Wefunder-Version` request header (`YYYY-MM-DD`), never by
    the URL. Resolution is header → your application's pinned version → latest; every response
    carries `Wefunder-Version` (the version that handled it) and `Wefunder-Version-Latest`. An
    unknown value returns `400 invalid_request` naming the valid versions. Current: `2026-10-01`.

    ## Rate Limits

    - Standard API: 1,000 requests/hour per token
    - Admin API: 10,000 requests/hour per token

    ## Base URL

    All API requests should be made to: `https://api.wefunder.com` (no version in the path).
