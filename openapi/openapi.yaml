  /intents/preview:
    post:
      tags:
        - Intents
      summary: Preview an intent without proposing it
      description: |
        Runs every check `POST /intents` runs — the action's feature flag, resource type and id,
        token binding, who may propose, and the handler's own validation — and returns what the
        reviewer would read, without minting anything. The draft step for agents: admitted by any
        proposing scope **or** `read:explore`, and the action's own scope is not required on the
        token, so a user can shape the text before granting the write permission. The caller must
        still be allowed to propose on the resource, and for a syndicate-owned token the application's
        Installation scope ceiling still applies (an install granted only `read:syndicates` cannot
        preview a `write:syndicates` action: `403 insufficient_scope`). Same request body as
        `POST /intents` (without `idempotency_key`). Errors are the same as `POST /intents` would give.
      operationId: previewIntent
      security:
        - bearerAuth:
            - read:explore
        - bearerAuth:
            - write:syndicates
        - bearerAuth:
            - write:comments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action_name
                - resource_type
                - resource_id
              properties:
                action_name:
                  type: string
                resource_type:
                  type: string
                resource_id:
                  type: string
                params:
                  type: object
      responses:
        '200':
          description: The proposal would be accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentPreviewEnvelope'
              example:
                data:
                  type: intent_preview
                  attributes:
                    action: string
                    resource_type: string
                    resource_id: string
                    params: {}
                    impact_summary: string
                    scope: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: The handler refused it; `error.message` is the reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: |-
            const preview = await wf.unwrap(
              wf.raw.previewIntent({
                body: {
                  action_name: "syndicates.close_deal",
                  resource_type: "Club",
                  resource_id: "syn_aB3xQ9k2vF8mNp1zT5wY7Qc4",
                  params: { fundraise_id: 99 },
                },
              }),
            );
            console.log(preview);
  /intents:
    post:
      tags:
        - Intents
      summary: Propose an intent
      description: |
        Propose a dangerous or irreversible action for human approval. Returns a `review_url`
        where a human must review the impact and approve before the action executes.

        The entity that proposes an intent can never approve it. Approval always happens
        on Wefunder's UI by a user with permission on the resource.

        Each action names the scope that may propose it and the resource type it targets
        (`syndicates.*` → `write:syndicates` on a syndicate; `comments.create` → `write:comments`
        on a `Company`). The token must hold that action's scope; holding another proposing scope
        is not enough (403 `insufficient_scope`).

        `comments.create` posts a question on a company's Ask tab, or an answer to one, as the
        requesting user once they approve on wefunder.com. `resource_id` is the company (`co_...`);
        `params` is `{ target_type: "company" | "comment", target: "co_..." | "cmt_...", body,
        disclosure_key? }` (`disclosure_key` ∈ investor, stockholder, promoter, financial_stakeholder).
        Who may post is the site's own rule: anyone the page is available to may ask (unless the
        company has closed questions); only the company's team may answer. Only the requester can
        approve. 20 proposals per user per day (429).

        An `idempotency_key` names one operation. Reusing it for the same operation returns the
        existing intent (200) while that intent is pending, approved, executing, or executed;
        reusing it for a different action, resource, or params is a 409 `idempotency_conflict`.

        An action still rolling out per account returns 403 `feature_disabled` for a user who is
        not yet enabled. `POST /intents/preview` runs the same checks without minting.

        `syndicates.close_deal` and `syndicates.finalize_deal` were removed in `2026-10-15`: on this
        version they answer 400 `bad_request` ("Unknown action") with `details.removed_in_version`.
        A syndicate's managers close and finalize deals on wefunder.com. Intents minted before
        still appear in `GET /intents` with those action names.

        See [Intents documentation](/concepts/intents) for the full pattern.
      operationId: createIntent
      security:
        - bearerAuth:
            - write:syndicates
        - bearerAuth:
            - write:comments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action_name
                - resource_type
                - resource_id
              properties:
                action_name:
                  type: string
                  description: The action to perform
                  example: syndicates.remove_member
                  enum:
                    - syndicates.publish
                    - syndicates.remove_member
                    - syndicates.delete_draft
                    - comments.create
                resource_type:
                  type: string
                  example: Club
                  description: The resource type the action targets, as the action table names it; the example is the syndicate type.
                resource_id:
                  type: string
                  description: The resource's id in the API's vocabulary — the syndicate's `syn_...` for a `syndicates.*` action.
                  example: syn_aB3xQ9k2vF8mNp1zT5wY7Qc4
                params:
                  type: object
                  description: Action-specific parameters
                  example:
                    member_id: mem_7Hk2mP9qR4sT1uV6wX8yZ3aB
                idempotency_key:
                  type: string
                  description: Client-provided key naming this one operation. While an intent with this key is pending, approved, executing, or executed, the same operation returns it (200); a different operation under the same key is a 409.
                  example: remove-mem_7Hk2mP9qR4sT1uV6wX8yZ3aB-2026-10
                requested_by_agent:
                  type: string
                  description: Human-readable name of the agent proposing the action
                  example: Claude via MCP
      responses:
        '200':
          description: Idempotent replay — the existing intent for this key and operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentEnvelope'
              example:
                data:
                  id: int_aB3xQ9k2vF8mNp1zT5wY7Qc4
                  type: intent
                  attributes:
                    action: syndicates.remove_member
                    status: pending
                    resource_type: Club
                    resource_id: syn_aB3xQ9k2vF8mNp1zT5wY7Qc4
                    impact_summary: Remove Jane Smith from Acme Syndicate. She will lose access to the syndicate's deals.
                    review_url: https://wefunder.com/intents/a1b2c3d4-e5f6-7890-abcd-ef1234567890/review
                    requested_by_agent: Claude via MCP
                    expires_at: '2025-03-01T12:00:00Z'
                    approved_at: '2025-03-01T12:00:00Z'
                    executed_at: '2025-03-01T12:00:00Z'
                    rejection_reason: Example text
                    execution_result: {}
                    created_at: '2025-03-01T12:00:00Z'
                    updated_at: '2025-03-01T12:00:00Z'
        '201':
          description: Intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentEnvelope'
              example:
                data:
                  id: int_aB3xQ9k2vF8mNp1zT5wY7Qc4
                  type: intent
                  attributes:
                    action: syndicates.remove_member
                    status: pending
                    resource_type: Club
                    resource_id: syn_aB3xQ9k2vF8mNp1zT5wY7Qc4
                    impact_summary: Remove Jane Smith from Acme Syndicate. She will lose access to the syndicate's deals.
                    review_url: https://wefunder.com/intents/a1b2c3d4-e5f6-7890-abcd-ef1234567890/review
                    requested_by_agent: Claude via MCP
                    expires_at: '2025-03-01T12:00:00Z'
                    approved_at: '2025-03-01T12:00:00Z'
                    executed_at: '2025-03-01T12:00:00Z'
                    rejection_reason: Example text
                    execution_result: {}
                    created_at: '2025-03-01T12:00:00Z'
                    updated_at: '2025-03-01T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`idempotency_conflict` — the key was already used for a different operation. Nothing was minted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid action or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: |-
            const { data: intent } = await wf.unwrap(
              wf.raw.createIntent({
                body: {
                  action_name: "syndicates.close_deal",
                  resource_type: "Club",
                  resource_id: "syn_aB3xQ9k2vF8mNp1zT5wY7Qc4",
                  params: { fundraise_id: 99 },
                  // Safe to retry: an existing pending/executed intent with this key is returned instead.
                  idempotency_key: "close-acme-series-a",
                  requested_by_agent: "My Deal Bot",
                },
              }),
            );
            // Hand this URL to a human — the action executes only after they approve.
            console.log(intent?.attributes?.review_url);
