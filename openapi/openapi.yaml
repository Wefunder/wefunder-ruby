                - hardware
                - moonshots
          example: robotics,hardware
        - name: business_model
          in: query
          description: Only companies with any of these business models (see each offering's `business_models`). One value or a comma-separated list.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - b2b
                - b2c
                - subscription
                - saas
                - service
                - marketplace
                - ecommerce
                - retail
          example: b2b
        - name: followed
          in: query
          description: |
            **Logged-in view only** (`read:explore` with a user). `true` — only companies the
            authorizing user follows on wefunder.com (their watchlist); `false` — only companies
            they do not follow. A 400 on the public view, which has no user to filter by.
          schema:
            type: boolean
          example: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferingListEnvelope'
              example:
                data:
                  - id: ofr_yw3OhusvpfJP4Pk3wRYV1F2R
