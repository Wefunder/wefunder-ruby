  /companies/{id}/questions:
    get:
      tags:
        - Explore
      summary: List a company's investor questions and answers
      description: |
        The company page's Ask tab as data: the questions investors asked and the answers, as the
        tab lists them for this viewer (the same repository and visibility as the site). Like the tab,
        questions default to the current raise — those asked since it opened (`meta.questions_since`);
        `past_raises=true` includes every raise, which the site offers to any visitor because
        past-raise questions are public. `sort` is the tab's dropdown: `relevance` (default:
        highlighted, then answered, then most liked), `recent`, `upvoted`, `unanswered`. Text is plain.
        Questions and answers carry their id (`cmt_...`); the integer key never leaves the API.
        Answers are the founders' own words.

        `q` searches question and answer text (Postgres full text: quoted phrases and `-word` work;
        one- or two-word queries also prefix-match) and replaces the sort with match rank —
        `meta.sort` is then `search` and each result's `match` says whether its question or an
        answer matched. `unanswered_by_team=true` keeps only questions with no live answer from the
        company's team (the founder's queue; the `unanswered` sort merely orders by whether anyone
        replied).
      operationId: listCompanyQuestions
      security:
        - bearerAuth:
            - read:public
        - bearerAuth:
            - read:explore
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: co_8Kd0aB3xQ9k2vF8mNp1zT5wY
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - relevance
              - recent
              - upvoted
              - unanswered
            default: relevance
        - name: past_raises
          in: query
          schema:
            type: boolean
            default: false
        - name: q
          in: query
          description: Full-text search over questions and answers. At most 200 bytes.
          schema:
            type: string
            maxLength: 200
        - name: unanswered_by_team
          in: query
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyQuestionListEnvelope'
        '400':
          description: '`sort` is not one of the tab''s options, or `q` is over 200 bytes.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown company, or one the site does not show this viewer.
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: |-
            const page = await wf.unwrap(
              wf.raw.listCompanyQuestions({
                path: { id: "co_abc123Example" },
                query: { q: "revenue", unanswered_by_team: true, per_page: 20 },
              }),
            );
            for (const question of page.data ?? []) console.log(question.id, question.attributes);
  /companies/search:
    get:
      tags:
        - Companies
      summary: Search companies by name
      description: |
        The wefunder.com search bar, companies only. Same Algolia request, same result ordering,
        and same page size as the site's top bar, so the results are what a visitor typing the
        same text would see, in that order — companies raising now and companies funded in the
        past, whether or not they appear on `/explore`. The order is the site's search order
        (match quality first, then the site's tie-breaks); nothing here recommends.

        Each result carries the company's `co_` id for `GET /companies/{id}`. With `read:explore`
        the accreditation gate matches the authorizing user (an accredited viewer sees the
        accredited-only companies the site would show them); with `read:public` it is the
        anonymous view.
      operationId: searchCompanies
      security:
        - bearerAuth:
            - read:public
        - bearerAuth:
            - read:explore
      parameters:
        - name: q
          in: query
          required: true
          description: The company name, or part of it. At most 200 characters and 500 bytes.
          schema:
            type: string
            maxLength: 200
          example: acme
        - name: limit
          in: query
          description: Maximum results, 1–20. Default 8, the same as the site.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 8
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySearchResultListEnvelope'
        '400':
          description: '`q` is missing, blank, or over 200 characters / 500 bytes.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The token holds neither `read:public` nor `read:explore`.
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
