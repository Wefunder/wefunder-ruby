  /referral_codes/{id}/stats:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The referral code id (`ref_…`).
    get:
      tags:
        - Referral Codes
      summary: Referral code stats
      description: |
        What your code produced, per company. Your access to each company decides what you see:

        - **Counts** (any app): for each company in the code's scope, one cell per ISO week (Monday
          to Sunday, UTC) with the unique investors referred that week as a range, `{min, max}`.
          Ranges are never exact, currently of width 3 and starting at zero, so `{0, 2}` also means
          none. Each week is published once, early on the following Monday, and never revised; the
          current week has no cell. There are no totals across weeks or companies, and no amounts.
        - **Rows** (your app is installed on the company with `read:attribution:anonymized`, or at
          founder tier with `read:attribution:full`): that company's referred investments instead of
          ranges, anonymized or in full.

        A targeted code's scope is its target; an untargeted code's scope is every company its
        visitors landed on. `visits` and `unique_visitors` are a daily snapshot up to the end of
        `visits_as_of` (UTC). Paginated over companies; each company's weekly series is complete.
      operationId: getReferralCodeStats
      x-wf-stability: beta
      security:
        - bearerAuth:
            - read:referral_codes
      parameters:
        - $ref: '#/components/parameters/cursor'
        - name: company_id
          in: query
          required: false
          description: Only this company (`co_…`). Use it with `investments_cursor` to page an installed company's rows.
          schema:
            type: string
        - name: investments_cursor
          in: query
          required: false
          description: With `company_id`, the `investments_next_cursor` from the previous page of that company's rows.
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 25
            maximum: 100
      responses:
        '200':
          description: Stats for the referral code
          content:
            application/json:
              x-wf-example-omit:
                - meta.next_cursor
                - data.attributes.companies.0.investments
                - data.attributes.companies.0.investments_next_cursor
              schema:
                $ref: '#/components/schemas/ReferralCodeStatsEnvelope'
              example:
                data:
                  id: ref_8f3ExampleReferral0000
                  type: referral_code_stats
                  attributes:
                    visits: 412
                    unique_visitors: 388
                    visits_as_of: '2026-10-12'
                    label: October newsletter
                    companies:
                      - company: co_7hQExampleCompany0001
                        level: counts
                        verification_url: https://wefunder.com/acme/marketing/reports#partners
                        in_scope_since: 2026-W42
                        weeks:
                          - week: 2026-W42
                            investors:
                              min: 0
                              max: 2
                            policy_version: 1
                            published_at: '2026-10-19T06:05:00Z'
                meta:
                  has_more: false
                  page_count: 1
                  request_id: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /installations:
    get:
      tags:
        - Installations
      summary: List installations of your app
      description: |
        Where the calling application is installed. Someone who manages the app's organization sees
        every install; anyone else sees the installs they made or could revoke. Revoked installs stay
        listed for 30 days.
      operationId: listInstallations
      security:
        - bearerAuth:
            - read:installations
      responses:
        '200':
          description: Installations of the calling application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationListEnvelope'
              example:
                data:
                  - id: string
                    type: installation
                    attributes:
                      target:
                        type: company
                        id: string
                        name: string
                      tier: string
                      scopes:
                        - string
                      status: active
                      installed_at: '2026-01-15T17:30:00Z'
                      installed_by: string
                      revoked_at: '2026-01-15T17:30:00Z'
                meta:
                  count: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: |-
            const installs = await wf.installations.list();
            for (const install of installs.data ?? [])
              console.log(install.id, install.attributes);
        - lang: Python
          label: wefunder
          source: |-
            installs = wf.installations.list()
            for install in installs.data:
                print(install.id, install.attributes.target.id, install.attributes.status)
        - lang: Ruby
          label: wefunder
          source: |-
            installs = wf.installations.list
            installs.data.each { |install| puts "#{install.id} #{install.attributes.target.id} #{install.attributes.status}" }
    post:
      tags:
        - Installations
      summary: Install your app on a company or syndicate
      description: |
        Installs the calling application on a company or syndicate the token's user can edit (or, for a
        syndicate, manages), and mints the **company-owned token** the install stands for. The token
        appears in this response only. Requires a token authorized by a user.

        The install is granted at the caller's tier (founder, admin or editor for a company). An
        editor-tier install carries read scopes only; write scopes in `scopes` are dropped. Installing
        on a company outside your own organization requires the app to be approved.
      operationId: createInstallation
      security:
        - bearerAuth:
            - write:installations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_type
                - target_id
              properties:
                target_type:
                  type: string
                  enum:
                    - company
                    - syndicate
                target_id:
                  type: string
                  description: The company (`co_…`) or syndicate (`syn_…`) external id.
                scopes:
                  type: array
                  items:
                    type: string
                  description: Subset of the app's declared scopes to grant. Defaults to all of them.
                tier:
                  type: string
                  description: Optional higher tier (`founder` / `full_access`), honored only when the caller holds it.
      responses:
        '201':
          description: The new installation and its token (shown once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationTokenEnvelope'
              example:
                data:
                  id: string
                  type: installation
                  attributes:
                    target:
                      type: company
                      id: string
                      name: string
                    tier: string
                    scopes:
                      - string
                    status: active
                    installed_at: '2026-01-15T17:30:00Z'
                    installed_by: string
                    revoked_at: '2026-01-15T17:30:00Z'
                token:
                  access_token: at_live_…
                  token_type: Bearer
                  scope: string
                  installation: string
                  created_at: 1
                meta: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already installed here; `error.details.installation` is the existing install's id.
        '422':
          description: Unknown `target_type`, or none of the requested scopes can be granted by the caller's role.
      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: |-
            const install = await wf.installations.create({
              target_type: "company",
              target_id: "co_abc123Example",
              scopes: ["read:offerings", "read:investments"],
            });
            console.log(install.data?.id, install.token?.access_token); // the token is shown once — store it
        - lang: Python
          label: wefunder
          source: |-
            install = wf.installations.create(
                {"target_type": "company", "target_id": "co_abc123Example", "scopes": ["read:offerings", "read:investments"]}
            )
            print(install.data.id, install.token.access_token)  # the token is shown once — store it
        - lang: Ruby
          label: wefunder
          source: |-
            install = wf.installations.create(target_type: "company", target_id: "co_abc123Example",
                                              scopes: ["read:offerings", "read:investments"])
            puts install.data.id, install.token.access_token # the token is shown once — store it
