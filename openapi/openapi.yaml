openapi: 3.0.1
info:
  title: Wefunder API v2
  description: |
    OAuth 2.0 API for accessing Wefunder data programmatically.

    ## Authentication

    This API uses OAuth 2.0 for authentication. To get started:

    1. Create an OAuth application at `/oauth/applications`
    2. Get your Client ID and Client Secret
    3. Implement the OAuth 2.0 Authorization Code flow
    4. Use the access token to make API requests

    ## Versioning

    The API is versioned by the dated `Wefunder-Version` request header (`YYYY-MM-DD`), never by
    the URL. Resolution is header → your application's pinned version → latest; every response
    carries `Wefunder-Version` (the version that handled it) and `Wefunder-Version-Latest`. An
    unknown value returns `400 invalid_request` naming the valid versions. Current: `2026-10-01`.

    ## Rate Limits

    - Standard API: 1,000 requests/hour per token
    - Admin API: 10,000 requests/hour per token

    ## Base URL

    All API requests should be made to: `https://api.wefunder.com` (no version in the path).
  version: '2.0'
  contact:
    name: Wefunder API Support
    email: api@wefunder.com
servers:
  - url: https://api.wefunder.com
    description: One host for live and sandbox; the credential prefix (pk_live_ / pk_test_) selects the environment. There is currently one API version and no version appears in the path.
paths:
  /explore:
    get:
      tags:
        - Explore
      summary: List public offerings
      description: |
        Returns the offerings shown on wefunder.com/explore — the curated set of companies that
        meet Wefunder's discoverability bar (a soft-confirmed traction threshold plus approval),
        **one offering per company**. An "offering" is a fundraise, addressed by its id
        (`ofr_...`).

        **Public view (`read:public`).** Reachable with either a server-side (client_credentials)
        token or a user access token. Private rounds (e.g. Reg D 506(b)) are never listed, and
        low-traction or unapproved companies are excluded — exactly as they are on the website
        for a logged-out visitor.

        **Logged-in view (`read:explore`).** A user access token carrying `read:explore` gets
        what *that user* sees on wefunder.com/explore: the public offerings plus any the user
        qualifies for (accredited-only / Vault deals, invited private rounds), each checked
        against the same visibility policy the website applies. The response is a strict
        superset of the public one — same fields and ids — with two extra attributes,
        `publicly_visible` and `invested`, and `meta.personalized: true`. A server-side key can
        never hold `read:explore`; a token with `read:explore` but no resolvable user gets the
        public view.

        Order with `sort` (default: most raised); paginate with `cursor` and `per_page`.
        `meta.total_count` is the number of offerings across all pages, after filters.

        **Closed rounds (`status`).** By default the list is live rounds. `status=closed` lists
        rounds that finished raising instead, newest `closed_at` first. It is not limited to one
        per company or to the curated explore set: it covers every finished round that
        `GET /offerings/{id}` serves to a logged-out visitor, for companies listed in Wefunder's
        public directory. `status=all` returns the live list first, then the closed list. With
        `status=closed` or `status=all`, `exemption` is the only filter accepted, and `sort`
        orders only the live part. Closed rounds follow the public view even for a
        `read:explore` token.

        **Filters** are objective, per-offering terms — exemption family, security type,
        TTW vs. live, minimum investment ceiling, close date, amount raised floor. The response
        echoes the applied set in `meta.filters`. An out-of-vocabulary value is a `400` naming
        the accepted values. There are deliberately no relevance, quality, or ranking criteria.

        Use this endpoint to:
        - Discover and monitor active deals
        - Build deal aggregators and public listings
        - Bulk-list closed rounds (`status=closed`)
      operationId: listOfferings
      security:
        - bearerAuth:
            - read:public
        - bearerAuth:
            - read:explore
      parameters:
        - $ref: '#/components/parameters/cursor'
        - name: per_page
          in: query
          description: Offerings per page.
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
          example: 100
        - name: status
          in: query
          description: |
            Which rounds to list:
            - `live` (default): rounds accepting investments or reservations, as on wefunder.com/explore
            - `closed`: rounds that finished raising, newest `closed_at` first (id breaks ties)
            - `all`: the live list, then the closed list

            Any other value is a `400`.
          schema:
            type: string
            enum:
              - live
              - closed
              - all
            default: live
          example: closed
        - name: sort
          in: query
          description: |
            Ordering of live rounds. A `400` with `status=closed`; with `status=all` it orders the live part only.
            - `most_raised` (default) — highest amount raised first
            - `closing_soon` — soonest funding close first
            - `newest` — most recently launched first
            - `most_investors` — highest investor count first
          schema:
            type: string
            enum:
              - most_raised
              - closing_soon
              - newest
              - most_investors
            default: most_raised
          example: most_raised
        - name: exemption
          in: query
          description: Only offerings under this SEC exemption family. Reg CF and Reg D are the supported public filters.
          schema:
            type: string
            enum:
              - reg_cf
              - reg_d
          example: reg_cf
        - name: security
          in: query
          description: Only offerings issuing this kind of security — the `security.type` value on results.
          schema:
            type: string
            enum:
              - safe
              - equity
              - convertible_note
              - revenue_share
              - debt
              - fund
              - other
          example: safe
        - name: testing_the_waters
          in: query
          description: '`false` — only live rounds accepting investments; `true` — only Testing-the-Waters rounds collecting non-binding reservations.'
          schema:
            type: boolean
          example: false
        - name: max_min_investment
          in: query
          description: Only offerings whose minimum investment is at most this amount (USD).
          schema:
            type: number
          example: 100
        - name: closing_before
          in: query
          description: Only offerings whose funding close date is on or before this date (ISO 8601). Offerings with no close date are excluded.
          schema:
            type: string
            format: date
          example: '2026-12-31'
        - name: min_amount_raised
          in: query
          description: Only offerings that have raised at least this amount so far (USD).
          schema:
            type: number
          example: 250000
        - name: industry
          in: query
          description: |
            Only companies tagged with any of these industries — the curated tags the wefunder.com
            explore page filters by (see each offering's `industries`). One value or a comma-separated
            list; unknown values are a 400 listing the vocabulary. Objective facets, not a ranking.
          style: form
          explode: false
          schema:
            type: array
            items:
