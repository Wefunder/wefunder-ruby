  /syndicates/{syndicate_id}/deals:
    get:
      tags:
        - Syndicate Deals
      summary: List deals
      description: |
        Returns the syndicate's **live** deals (open, oversubscribed, or closing) with status,
        terms, and metrics. Closed and upcoming rounds are not listed; `statistics.total_deals`
        counts the same visible deal set in every state. The visible set is every round of the
        syndicate's directory companies except invite-only companies' rounds and
        testing-the-waters rounds; a syndicate with no directory companies falls back to its
        explicitly linked rounds, excluding invite-only companies' rounds only.
      operationId: listSyndicateDeals
      security:
        - bearerAuth:
            - read:syndicates
      parameters:
        - $ref: '#/components/parameters/syndicate_id'
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor from the previous response's `meta.next_cursor`.
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
            maximum: 100
          description: Results per page, 1-100. Defaults to 25.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyndicateDealListEnvelope'
              example:
                data:
                  - id: ofr_yw3OhusvpfJP4Pk3wRYV1F2R
                    type: syndicate_deal
                    attributes:
                      name: Acme Corp Series A
                      status: open
                      company_name: Acme Corp
                      company_id: 1234
                      company: co_8Kd0aB3xQ9k2vF8mNp1zT5wY
                      company_url: acme-corp
                      company_logo_url: https://uploads.wefunder.com/uploads/company/logo/1234/large_logo.png
                      amount_raised: '230000'
                      investor_count: 47
                      funding_target: '50000000'
                      exemption:
                        family: reg_cf
                        subtype: null
                        label: Reg CF
                      security:
                        type: safe
                        label: SAFE
                        terms:
                          valuation_cap: '10000000'
                          uncapped: true
                          discount_percent: '20'
                          most_favored_nation: true
                          pro_rata: true
                      min_investment: '100'
                      max_investment: '50000'
                      description: Example text
                      created_at: '2025-03-01T12:00:00Z'
                      updated_at: '2025-03-01T12:00:00Z'
                      closed_at: '2025-03-01T12:00:00Z'
                      funding_started_at: '2025-03-01T12:00:00Z'
                meta:
                  page_count: 25
                  has_more: true
                  next_cursor: 12345
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
