  /offerings/{external_id}:
    get:
      tags:
        - Explore
      summary: Get a public offering
      description: |
        Retrieves a single offering by its id (`ofr_...`).

        With `read:public`, a valid id for a non-public offering (e.g. a private Reg D 506(b)
        round) returns `404` — having an id does not make an offering publicly resolvable. With
        `read:explore` on a user access token, the offering resolves if *that user* may see it on
        wefunder.com (e.g. an accredited-only or invited round), and the response gains
        `publicly_visible` and `invested`.
      operationId: getOffering
      security:
        - bearerAuth:
            - read:public
        - bearerAuth:
            - read:explore
      parameters:
        - name: external_id
          in: path
          required: true
          description: The offering's id (`ofr_...`).
          schema:
            type: string
          example: ofr_yw3OhusvpfJP4Pk3wRYV1F2R
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferingEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: |-
            const offering = await wf.offerings.get("ofr_QfmTyP8qjfYAvkEgREyL3kLf");
            console.log(offering.attributes?.company_name, offering.attributes?.status);
        - lang: Python
          label: wefunder
          source: |-
            try:
                offering = wf.offerings.get(offering_id)
            except WefunderError as err:
                # 404 → err.type == "not_found"; err.request_id is what support asks for.
                print(err.status, err.type, err.request_id)
                raise
            print(offering.attributes.company_name, offering.attributes.status)
  /companies/{id}/disclosures:
    get:
      tags:
        - Explore
      summary: Get a company's public Form C disclosures
      description: |
        The Details tab of the company's Wefunder page as structured data — the company's own
        Form C disclosures, section for section: financial statements for the fiscal years on
        file, the page's ratios, the founder's current-position disclosure (cash on hand, monthly
        revenue / costs / burn), the financial-condition narrative, document links, risks, use of
        funds, directors and officers, 20%+ holders, capital structure, prior offerings, outstanding
        notes and debts, and related-party transactions.

        Same "who has a page" rule as `GET /companies/{id}`. The round read is the page's own: the
        display round for the viewer, swapped for its concurrent Reg CF sibling on a Reg D round,
        and only when it is a Reg CF / ECSP round with a Form C. A company with no such round has
        no details tab on the site and answers `404` with `error.type: no_disclosures` — distinct
        from an unknown or hidden company. A section the company hides on the site is `null`.

        Money is decimal strings, never USD by assumption: the round's own figures (use of funds,
        prior offerings, notes, debts, related parties) are in `currency` — `EUR` for an ECSP round —
        while the Form C financial statements, the ratio derived from them, and the current-position
        figures (which repeat it as `current_position.currency`) are in `financials_currency`, the
        currency the issuer declared for its statements (it can differ from
        the round's: DKK, RON, GBP, or USD statements behind a EUR round). Ratios are percentages as
        decimal strings. Everything here is the issuer's own disclosure, served as filed, not a
        Wefunder assessment.
      operationId: getCompanyDisclosures
      security:
        - bearerAuth:
            - read:public
        - bearerAuth:
            - read:explore
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: co_8Kd0aB3xQ9k2vF8mNp1zT5wY
        - name: sections
          in: query
          description: |
            Only these sections (`offering_id`, `currency`, `financials_currency` and `filing` are always
            included). Omit for the whole tab; a disclosure-heavy company runs to ~100 KB. Unknown names
            are a 400 listing the vocabulary.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - business
                - financial_statements
                - ratios
                - current_position
                - financial_condition
                - financial_statement_documents
                - investment_documents
                - risks
                - use_of_funds
                - directors
                - officers
                - voting_power
                - capital_structure
                - prior_offerings
                - outstanding_notes
                - outstanding_debts
                - related_parties
          example: financial_statements,ratios,current_position
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDisclosuresEnvelope'
        '400':
          description: '`sections` names a section that does not exist.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown or hidden company (`error.type` = `not_found`), or no public Form C disclosures (`error.type` = `no_disclosures`).
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: |-
            const { data: disclosures } = await wf.unwrap(
              wf.raw.getCompanyDisclosures({
                path: { id: "co_abc123Example" },
                query: { sections: ["business", "risks", "use_of_funds"] },
              }),
            );
            console.log(disclosures?.attributes);
  /companies/{id}/pitch:
    get:
      tags:
        - Explore
      summary: Get a company's pitch
      description: |
        The Overview tab's pitch as structured data: the story as ordered blocks (`heading`,
        `paragraph`, `list`, `image`, `video`, `footnote`), plus the perk tiers of the round the page
        shows the viewer. Images and embedded videos keep their place in the document with an absolute
        URL, because founders publish perk tiers, stretch goals, timelines, and charts as pictures
        (typically with no alt text) and a plain-text rendering would drop them.

        What is parsed is what the page renders: the story passes through the site's own sanitizer
        first, so an embed the page refuses (a host off its allowlist, a `javascript:` URL) is never
        served here either. Same "who has a page" rule and round chooser as `GET /companies/{id}`.
        A site-public company with no round the viewer may see still has a pitch (`perks: null`).
        `perks.described_in_pitch` is a heuristic: true when the structured perk list is a placeholder
        ("See investor overview page", or one identical sentence on every tier) and the real tiers are
        in the story's images.

        `authored_by` says who wrote the story: `company` (the issuer's own words and imagery, not a
        Wefunder assessment) or `wefunder` (a Wefunder-prepared deal memo the company did not
        participate in; `disclaimer` carries the page's notice). A pitch can run to ~70 KB; use
        `sections` to ask for less.
      operationId: getCompanyPitch
      security:
        - bearerAuth:
            - read:public
        - bearerAuth:
            - read:explore
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: co_8Kd0aB3xQ9k2vF8mNp1zT5wY
        - name: sections
          in: query
          description: |
            Only these sections (`offering_id`, `title`, `url`, `authored_by`, and `disclaimer` are
            always included). Omit for the whole pitch. Unknown names are a 400 listing the vocabulary.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - story
                - perks
          example: perks
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPitchEnvelope'
        '400':
          description: '`sections` names a section that does not exist.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown or hidden company.
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: |-
            const { data: pitch } = await wf.unwrap(
              wf.raw.getCompanyPitch({ path: { id: "co_abc123Example" }, query: { sections: ["story", "perks"] } }),
            );
            console.log(pitch?.attributes);
