                      updated_at: '2023-03-15T14:30:00Z'
                      closed_at: '2023-06-30T23:59:59Z'
                      amount_raised: 25000
                      investor_count: 42
                meta:
                  page_count: 25
                  has_more: true
                  next_cursor: 12345
