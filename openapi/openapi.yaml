                      incorporated_on: '2026-01-15'
                      employees: 1
                    financial_statements:
                      most_recent:
                        total_assets: string
                        cash_and_equivalents: string
                        accounts_receivable: string
                        current_liabilities: string
                        non_current_liabilities: string
                        short_term_debt: string
                        long_term_debt: string
                        revenue: string
