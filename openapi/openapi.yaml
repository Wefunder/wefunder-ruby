  /syndicates/{syndicate_id}/statistics:
    get:
      tags:
        - Syndicate Statistics
      summary: Get syndicate statistics
      description: |
        Returns aggregate metrics for a syndicate including member counts, deal counts,
        total raised, and recent activity.

        `total_raised` and `total_investors` are computed from directory-selected deals
        (one per directory company: its live round, else its most recent successful round).
        `total_deals` counts the syndicate's visible deal set in every state (the rounds
        `GET /syndicates/{syndicate_id}/deals` draws from, which excludes invite-only
        companies' rounds and testing-the-waters rounds of directory companies);
        `live_deals` is the live subset of it, the rows that endpoint lists.

        `total_raised` is whole dollars as a string.
      operationId: getSyndicateStatistics
      security:
        - bearerAuth:
            - read:syndicates
      parameters:
        - $ref: '#/components/parameters/syndicate_id'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyndicateStatisticsEnvelope'
              example:
                data:
                  type: syndicate_statistics
                  attributes:
                    total_members: 45
                    members_by_role:
                      manager: 3
                      member: 35
                      invitee: 5
                      creator: 1
                      applicant: 1
                    total_deals: 3
                    live_deals: 1
                    total_raised: '107800'
                    total_investors: 6527
                    recent_activity_count: 4
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Syndicate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /syndicates/{syndicate_id}/portfolio:
    get:
      tags:
        - Syndicate Portfolio
      summary: Get syndicate portfolio summary
      description: |
        Returns totals across the syndicate's portfolio: cost basis, current value,
        gains, per-status deal counts, and the number of distinct investors.
        Accepts the same `status` and `company` filters as the positions endpoint
        to total a slice of the portfolio, such as only exited deals.

        The summary covers the syndicate's funded deals, summed across everyone
        holding their securities (not just current members), as aggregate figures
        only. Member-level data is available on the members endpoints.

        Portfolio values are recalculated periodically rather than on each request,
        so recent investments and valuation changes can take a few minutes to appear.
        `as_of` is the timestamp of the oldest calculation included in the response.

        Monetary values are **integer cents**; per-share prices and return multiples
        are **decimal strings**.
      operationId: getSyndicatePortfolio
      security:
        - bearerAuth:
            - read:syndicates
      parameters:
        - $ref: '#/components/parameters/syndicate_id'
        - name: status
          in: query
          description: Total only deals with this status.
          schema:
            type: string
            enum:
              - active
              - exited
              - sold
              - failed
        - name: company
          in: query
          description: Total only positions in this company, by its id (`co_...`). Unknown ids return 404.
          schema:
            type: string
          example: co_2bt9eJn6X8C9gnShl63qlzkK
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyndicatePortfolioSummaryEnvelope'
              example:
                data:
                  type: syndicate_portfolio_summary
                  attributes:
                    currency: usd
                    other_currencies: []
                    total_cost_basis_cents: 1
                    total_current_value_cents: 1
                    total_unrealized_gain_cents: 1
                    total_realized_gain_cents: 1
                    return_multiple: string
                    deal_counts:
                      active: 1
                      exited: 1
                      sold: 1
                      failed: 1
                    investor_count: 1
                    as_of: '2026-01-15T17:30:00Z'
