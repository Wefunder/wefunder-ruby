  /offerings/{external_id}:
    get:
      tags:
        - Explore
      summary: Get a public offering
      description: |
        Retrieves a single offering by its id (`ofr_...`).

        With `read:public`, a valid id for a non-public offering (e.g. a private Reg D 506(b)
        round) returns `404` — having an id does not make an offering publicly resolvable. With
        `read:explore` on a user access token, the offering resolves if *that user* may see it on
        wefunder.com (e.g. an accredited-only or invited round), and the response gains
        `publicly_visible` and `invested`.
      operationId: getOffering
      security:
        - bearerAuth:
            - read:public
        - bearerAuth:
            - read:explore
      parameters:
        - name: external_id
          in: path
          required: true
          description: The offering's id (`ofr_...`).
          schema:
            type: string
          example: ofr_yw3OhusvpfJP4Pk3wRYV1F2R
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferingEnvelope'
              example:
                data:
                  id: ofr_yw3OhusvpfJP4Pk3wRYV1F2R
                  type: offering
                  attributes:
                    company_name: ZeroBorder Self-Banking Centers
                    tagline: Example tagline
                    url: https://wefunder.com/zeroborder
                    card_image_url: https://uploads.wefunder.com/uploads/company/custom_card_photo/189517/large_card.jpg
                    logo_url: https://uploads.wefunder.com/uploads/company/logo/189517/large_logo.png
                    exemption:
                      family: reg_cf
                      subtype: null
                      label: Reg CF
                    security:
                      type: safe
                      label: SAFE
                      terms:
                        valuation_cap: '10000000'
                        uncapped: true
                        discount_percent: '20'
                        most_favored_nation: true
                        pro_rata: true
                    intended_security:
                      type: safe
                      label: SAFE
                    industries:
                      - type: robotics
                        label: Robotics
                    business_models:
                      - type: robotics
                        label: Robotics
                    status: open
                    testing_the_waters: false
                    funding_target: '1000000'
                    max_funding_target: '1235000'
                    min_investment: '100'
                    amount_raised: '642300'
                    investor_count: 1203
                    started_at: '2025-03-01T12:00:00Z'
                    closes_at: '2025-04-30T03:59:59Z'
                    closed_at: '2025-03-01T12:00:00Z'
                    form_c_url: https://www.sec.gov/Archives/edgar/data/1834121/000167025425000123/0001670254-25-000123-index.htm
                    spv_legal_name: WF ZeroBorder 2025, a series of Wefunder SPV, LLC
                    publicly_visible: true
                    invested: false
                    followed: false
                  company: co_8Kd0aB3xQ9k2vF8mNp1zT5wY
                  warnings:
                    - code: prior_rounds
                      message: This company completed 2 earlier rounds on Wefunder. amount_raised and investor_count cover this offering only, not the company's lifetime total.
                  etag: a1b2c3d4e5f6
        '401':
          $ref: '#/components/responses/Unauthorized'
