          example: null
        minimum_investment_cents:
          type: integer
          example: 1000000
        target_raise_cents:
          type: integer
          example: 100000000
        max_raise_cents:
          type: integer
          nullable: true
          example: 200000000
    SpvSettings:
      type: object
      properties:
        accreditation_type:
          type: string
          description: '`self_attestation` (506b) or `verified` (506c).'
          enum:
            - self_attestation
            - verified
