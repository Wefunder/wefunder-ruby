          example: ofr_yw3OhusvpfJP4Pk3wRYV1F2R
        type:
          type: string
          example: syndicate_deal
        attributes:
          type: object
          properties:
            name:
              type: string
              example: Acme Corp Series A
            status:
              type: string
              enum:
                - upcoming
                - open
                - closed
                - canceled
              description: Where the round is in its life (same values as an offering's `status`).
              example: open
            company_name:
              type: string
              example: Acme Corp
            company_id:
              type: integer
              deprecated: true
              description: Internal integer id. Deprecated — use `company` (`co_...`) instead.
              example: 1234
            company:
              type: string
              nullable: true
              description: The company's id (`co_...`).
              example: co_8Kd0aB3xQ9k2vF8mNp1zT5wY
            company_url:
              type: string
              nullable: true
              description: Company slug/URL path
              example: acme-corp
            company_logo_url:
              type: string
              nullable: true
              description: Company logo URL
              example: https://uploads.wefunder.com/uploads/company/logo/1234/large_logo.png
            amount_raised:
              type: string
              nullable: true
              description: Amount raised in whole dollars, as a string
              example: '230000'
            investor_count:
              type: integer
              description: Count of distinct active investors
              example: 47
            funding_target:
              type: string
              nullable: true
              description: Target funding amount in **cents**, as a string (the one cents field on this object)
              example: '50000000'
            exemption:
              oneOf:
                - $ref: '#/components/schemas/Exemption'
              nullable: true
              description: The SEC exemption the deal is offered under, in market vocabulary.
            security:
              oneOf:
                - $ref: '#/components/schemas/Security'
              nullable: true
              description: What the deal issues, as a discriminated union on `type` (see `Security`).
            min_investment:
              type: string
              nullable: true
              description: Minimum investment in whole dollars, as a string
              example: '100'
            max_investment:
              type: string
              nullable: true
              description: Maximum investment in whole dollars, as a string
              example: '50000'
            description:
              type: string
              nullable: true
              description: Deal funding purpose / description
              example: Example text
            created_at:
              type: string
              format: date-time
              example: '2025-03-01T12:00:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2025-03-01T12:00:00Z'
            closed_at:
              type: string
              format: date-time
              nullable: true
              description: When the deal finished raising. Null while `status` is `upcoming` or `open`.
              example: '2025-03-01T12:00:00Z'
            funding_started_at:
              type: string
              format: date-time
              nullable: true
              description: ISO 8601 timestamp when funding opened
              example: '2025-03-01T12:00:00Z'
    PortfolioCompanyRef:
      type: object
      description: The company behind a portfolio position or holding.
      properties:
        id:
          type: string
          description: The company's id (`co_...`)
          example: co_2bt9eJn6X8C9gnShl63qlzkK
        name:
          type: string
          example: Acme Robotics
        slug:
          type: string
          nullable: true
          example: acme-robotics
    PortfolioSecurity:
      type: object
      description: |
        One security offering within the position's fundraise, such as an early bird
        tier or the regular terms. Most positions have a single entry. A position has
        several when the round sold multiple tiers, or (investor endpoint) when the
        investor holds the same offering through more than one legal owner. Entries
        do not have ids; each is described by its `terms`, and occasionally a round
        has more than one offering record with identical terms.
      properties:
        security:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SecuritySummary'
          description: |
            What this tier issues, as `{ type, label }` (the terms are in `terms` below).
            May be null on legacy offerings — fall back to the position-level `security`.
        early_bird:
          type: boolean
        terms:
          type: object
          description: The offering's issue terms. Fields are null when the term does not apply to the security type.
          properties:
            share_price:
              type: string
              nullable: true
              description: Issue price per share as a decimal string
              example: '10.0'
            currency:
              type: string
              description: Lower-case ISO 4217 code of `note_cap_cents` and `premoney_valuation_cents`, the currency the founder entered them in. USD when the round's terms are explicitly USD-denominated (checkout prices them in USD then); otherwise a SAFE's cap is in the round's declared financials currency (falling back to the round's), while equity pre-money and a convertible note's valuation are in the round currency. A EUR-funded SAFE can therefore carry a `usd` or `dkk` cap. `share_price` and every other `_cents` field on the position stay in the position's top-level `currency`.
              example: usd
            note_cap_cents:
              type: integer
              nullable: true
            note_discount:
              type: string
              nullable: true
            premoney_valuation_cents:
              type: integer
              nullable: true
        cost_basis_cents:
          type: integer
        current_value_cents:
          type: integer
        unrealized_gain_cents:
          type: integer
        realized_gain_cents:
          type: integer
        shares_held:
          type: string
          nullable: true
          description: Decimal string. Null for non-share structures and multiple-of-basis valuations.
        current_share_price:
          type: string
          nullable: true
          description: Decimal string, split-adjusted.
        invested_at:
          type: string
          format: date-time
          nullable: true
        owner:
          type: object
          nullable: true
          description: |
            The legal owner of this stake — `{"kind": "individual"}` for
            personally-held stakes, `{"kind": "entity", "name": "..."}` for stakes
            held through the investor's own entity (IRA, LLC). Present on the
            investor endpoint only.
          properties:
            kind:
              type: string
              enum:
                - individual
                - entity
            name:
              type: string
        investor_count:
          type: integer
          description: The number of distinct investors aggregated into this entry. Present on the syndicate endpoint only.
    PortfolioHolding:
      type: object
      description: |
        A company a fund vehicle invested in — one entry per company, with the
        status of the most recent investment when the fund invested in the same
        company more than once.
      properties:
        company:
          $ref: '#/components/schemas/PortfolioCompanyRef'
        status:
          type: string
          enum:
            - active
            - failed
            - exited
    PortfolioPosition:
      type: object
      description: |
        One position per offering (fundraise). On the investor endpoint the totals
        sum the authenticated investor's stakes; on the syndicate endpoint they sum
        every holder's stakes and `investor_count` is present.
      properties:
        id:
          type: string
          description: The offering's id (`ofr_...`) — a position's identity is its offering.
          example: ofr_9aKxQ2vF8mNp1zT5wY7Qb3Cd
        type:
          type: string
          enum:
            - portfolio_position
            - syndicate_portfolio_position
        attributes:
          type: object
          properties:
            offering_id:
              type: string
              example: ofr_9aKxQ2vF8mNp1zT5wY7Qb3Cd
            company:
              $ref: '#/components/schemas/PortfolioCompanyRef'
            asset_type:
              type: string
              enum:
                - company
                - fund
              description: '`fund` for SPV and fund vehicles; the underlying companies appear in `holdings` where recorded.'
            security:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/SecuritySummary'
              description: What the round issued, as `{ type, label }`. Null when the round has no security recorded.
            status:
              type: string
              enum:
                - active
                - exited
                - sold
                - failed
              description: '`sold` means the stake was transferred away (secondary sale).'
            exit_reason:
              type: string
              nullable: true
              enum:
                - ipo
                - acquisition
                - buyback
                - failed
                - winding_down
              description: |
                Why the position ended. Set only for `exited` and `failed`
                positions — a `sold` position ended with the transfer itself, and
                some older positions have no recorded ending. `ipo` means the
                company went public; distributions, if any, appear in
                `realized_gain_cents`.
            invested_at:
              type: string
              format: date-time
              nullable: true
            currency:
              type: string
              description: 'ISO 4217 code, lower-case, of the investment amounts on this position and its `securities` (cost basis, values, gains, share price) — the offering''s currency: `usd`, or `eur` for an ECSP round. A security''s note cap and pre-money valuation carry their own `terms.currency`, which can differ.'
              example: usd
            cost_basis_cents:
              type: integer
            current_value_cents:
              type: integer
              description: Estimated current value; based on cost basis when no newer valuation has been recorded.
            unrealized_gain_cents:
              type: integer
              description: Can be negative.
            realized_gain_cents:
              type: integer
            return_multiple:
              type: string
              nullable: true
              description: Decimal string. Null when cost basis is zero.
              example: '1.6492'
            shares_held:
              type: string
              nullable: true
            current_share_price:
              type: string
              nullable: true
              description: Null when the position's securities carry different prices — see the per-entry values.
            securities:
              type: array
              items:
                $ref: '#/components/schemas/PortfolioSecurity'
            holdings:
              type: array
              description: Companies the vehicle invested in, for fund positions. Empty for non-fund positions and for vehicles without recorded holdings.
              items:
                $ref: '#/components/schemas/PortfolioHolding'
            investor_count:
              type: integer
              description: The number of distinct investors in this deal. Present on the syndicate endpoint only.
            as_of:
              type: string
              format: date-time
              description: When the values in this position were last calculated (the oldest timestamp when several underlying records are combined).
    PortfolioPositionListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioPosition'
        meta:
          type: object
          properties:
            has_more:
              type: boolean
            page_count:
              type: integer
            next_cursor:
              type: integer
              nullable: true
              description: Pass as `cursor` to fetch the next page. Absent on the last page.
    PortfolioSummaryEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              example: portfolio_summary
            attributes:
              type: object
              properties:
                currency:
                  type: string
                  description: 'ISO 4217 code, lower-case, of the four `total_*_cents` figures. Money is summed in one currency only: `usd` when any position is in USD, otherwise the portfolio''s only currency (`eur`).'
                  example: usd
                other_currencies:
                  type: array
                  description: Currencies of positions left out of the totals because they are not in `currency` (an investor holding both USD and EUR rounds sees `["eur"]`). Empty for most portfolios. Those positions still count in the status counts and are listed, each with its own `currency`, by the positions endpoint.
                  items:
                    type: string
                  example: []
                total_cost_basis_cents:
                  type: integer
                total_current_value_cents:
                  type: integer
                total_unrealized_gain_cents:
                  type: integer
                total_realized_gain_cents:
                  type: integer
                return_multiple:
                  type: string
                  nullable: true
                  example: '1.3107'
                position_counts:
                  type: object
                  description: Distinct offerings per status.
                  properties:
                    active:
                      type: integer
                    exited:
                      type: integer
                    sold:
                      type: integer
                    failed:
                      type: integer
                as_of:
                  type: string
                  format: date-time
                  nullable: true
    SyndicatePortfolioSummaryEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              example: syndicate_portfolio_summary
            attributes:
              type: object
              properties:
                currency:
                  type: string
                  description: 'ISO 4217 code, lower-case, of the four `total_*_cents` figures. Money is summed in one currency only: `usd` when any position is in USD, otherwise the portfolio''s only currency (`eur`).'
                  example: usd
                other_currencies:
                  type: array
                  description: Currencies of positions left out of the totals because they are not in `currency` (an investor holding both USD and EUR rounds sees `["eur"]`). Empty for most portfolios. Those positions still count in the status counts and are listed, each with its own `currency`, by the positions endpoint.
                  items:
                    type: string
                  example: []
                total_cost_basis_cents:
                  type: integer
                total_current_value_cents:
                  type: integer
                total_unrealized_gain_cents:
                  type: integer
                total_realized_gain_cents:
                  type: integer
                return_multiple:
                  type: string
                  nullable: true
                deal_counts:
                  type: object
                  description: Distinct deals per status.
                  properties:
                    active:
                      type: integer
                    exited:
                      type: integer
                    sold:
                      type: integer
                    failed:
                      type: integer
                investor_count:
                  type: integer
                  description: Distinct investors across the syndicate's funded deals.
                as_of:
                  type: string
                  format: date-time
                  nullable: true
    DealInvestor:
      type: object
      description: |
        JSON:API resource representing a syndicate member's investment in a specific deal.
        Only syndicate members' investments are included (scoped by member user IDs).
      properties:
        id:
          type: string
          description: The investor's id (`usr_...`) — one row per investor, aggregated across their investments in the deal.
          example: usr_aB3xQ9k2vF8mNp1zT5wY7Qc4
        type:
          type: string
          example: deal_investor
        attributes:
          type: object
          properties:
            user_id:
              type: integer
              deprecated: true
              description: Internal integer id. Deprecated — use `user` (`usr_...`) instead.
              example: 456
            user:
              type: string
              description: The investor's id (`usr_...`).
              example: usr_aB3xQ9k2vF8mNp1zT5wY7Qc4
            user_name:
              type: string
              nullable: true
              example: Jane Smith
            user_email:
              type: string
              nullable: true
              description: |
                Investor's email address. Always present: the endpoint itself is
                manager/operator only (ordinary members get 403), so there is no
                non-moderator caller to hide it from.
              example: user@example.com
            avatar_url:
              type: string
              nullable: true
              description: Investor's profile photo URL
              example: https://uploads.wefunder.com/uploads/user/avatar/456/large_photo.jpg
            amount:
              type: string
              description: Total invested in this deal, in whole dollars, as a string
              example: '5000'
            status:
              type: string
              enum:
                - pending
                - confirmed
              description: The investor's most advanced commitment in this deal — `confirmed` is final, `pending` is committed but not yet final.
              example: confirmed
            invested_at:
              type: string
              format: date-time
              description: ISO 8601 timestamp when the investment was created
              example: '2025-03-01T12:00:00Z'
    MemberInvestment:
      type: object
      description: |
        JSON:API resource representing a member's investment in a syndicate deal.
        Scoped to the syndicate's selected deals (one per company, matching directory semantics).
      properties:
        id:
          type: string
          description: Investment id (`inv_...`).
          example: inv_8Kd0aB3xQ9k2vF8mNp1zT5wY
        type:
          type: string
          example: member_investment
        attributes:
          type: object
          properties:
            fundraise_id:
              type: integer
              deprecated: true
              description: Internal integer id. Deprecated — use `offering` (`ofr_...`) instead.
              example: 75496
            offering:
              type: string
              nullable: true
              description: The deal's id (`ofr_...`), accepted by the deal endpoints.
              example: ofr_8Kd0aB3xQ9k2vF8mNp1zT5wY
            company_name:
              type: string
              nullable: true
              description: Name of the company the deal is for
              example: Substack
            amount:
              type: string
              description: Investment amount in whole dollars, as a string
              example: '5000'
            status:
              type: string
              enum:
                - pending
                - confirmed
              description: '`confirmed` is final; `pending` is committed but not yet final.'
              example: confirmed
            created_at:
              type: string
              format: date-time
              description: ISO 8601 timestamp when the investment was created
              example: '2025-03-01T12:00:00Z'
    SyndicateStatistics:
      type: object
      description: Aggregate metrics for a syndicate
      properties:
        type:
          type: string
          example: syndicate_statistics
        attributes:
          type: object
          properties:
            total_members:
              type: integer
              description: Count of active members (excludes resigned and exiled, filters out soft-deleted and hellbanned users)
              example: 45
            members_by_role:
              type: object
              description: Member count grouped by role
              additionalProperties:
                type: integer
              example:
                manager: 3
                member: 35
                invitee: 5
                creator: 1
                applicant: 1
            total_deals:
              type: integer
              description: Total number of linked deals (all linked fundraises)
              example: 3
            live_deals:
              type: integer
              description: Number of currently live deals (open/oversubscribed/closing states)
              example: 1
            total_raised:
              type: string
              description: |
                Total amount raised across directory-selected deals (one per company), in whole dollars, as a string.
              example: '107800'
            total_investors:
              type: integer
              description: Count of distinct investors across directory-selected deals (one per company)
              example: 6527
            recent_activity_count:
              type: integer
              description: Count of audit events in the last 30 days for this syndicate
              example: 4
    Intent:
      type: object
      description: JSON:API resource representing an intent (proposed dangerous action)
      properties:
        id:
          type: string
          description: The intent's id (`int_...`). The `review_url` embeds the separate web (UUID) id.
          example: int_aB3xQ9k2vF8mNp1zT5wY7Qc4
        type:
          type: string
          example: intent
        attributes:
          type: object
          properties:
            action:
              type: string
              example: syndicates.close_deal
            status:
              type: string
              enum:
                - pending
                - approved
                - executing
                - executed
                - expired
                - rejected
                - failed
              example: pending
            resource_type:
              type: string
              example: Club
            resource_id:
              oneOf:
                - type: string
                - type: integer
              nullable: true
              description: |
                For Club resources, the syndicate's id (`syn_...`). For every other
                `resource_type` (contract change plans, tranches, applications, ...) the
                resource's integer id, since those models have no external id yet.
              example: syn_aB3xQ9k2vF8mNp1zT5wY7Qc4
            impact_summary:
              type: string
              example: Close the Acme Corp Series A deal. 47 investors have committed $2.3M.
            review_url:
              type: string
              format: uri
              example: https://wefunder.com/intents/a1b2c3d4-e5f6-7890-abcd-ef1234567890/review
              description: URL where a human can review and approve/reject this intent
            requested_by_agent:
              type: string
              nullable: true
              description: Human-readable name of the agent that proposed this intent
              example: Claude via MCP
            expires_at:
              type: string
              format: date-time
              nullable: true
              example: '2025-03-01T12:00:00Z'
            approved_at:
              type: string
              format: date-time
              nullable: true
              example: '2025-03-01T12:00:00Z'
            executed_at:
              type: string
              format: date-time
              nullable: true
              example: '2025-03-01T12:00:00Z'
            rejection_reason:
              type: string
              nullable: true
              example: Example text
            execution_result:
              type: object
              nullable: true
              description: Action-specific result data (only present when status is executed)
            created_at:
              type: string
              format: date-time
              example: '2025-03-01T12:00:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2025-03-01T12:00:00Z'
    AuditEvent:
      type: object
      description: JSON:API resource representing an audit event
      properties:
        id:
          type: string
          format: uuid
          description: Event id (UUID).
          example: 6f1c2d3e-4a5b-4c6d-8e9f-0a1b2c3d4e5f
        type:
          type: string
          example: audit_event
        attributes:
          type: object
          properties:
            occurred_at:
              type: string
              format: date-time
              example: '2025-03-01T12:00:00Z'
            actor_type:
              type: string
              description: Type of actor (e.g. user, agent, system)
              example: example
            actor_name:
              type: string
              nullable: true
              example: ChatGPT via Wefunder MCP
            action:
              type: string
              example: syndicates.member.invited
            resource_type:
              type: string
              example: Club
            resource_id:
              oneOf:
                - type: string
                - type: integer
              nullable: true
              description: |
                For Club resources, the syndicate's id (`syn_...`). For every other
                `resource_type` (contract change plans, tranches, applications, ...) the
                resource's integer id, since those models have no external id yet.
              example: syn_aB3xQ9k2vF8mNp1zT5wY7Qc4
            resource_label:
              type: string
              nullable: true
              example: Acme Syndicate
            old_values:
              type: object
              nullable: true
              description: Previous values of changed fields
            new_values:
              type: object
              nullable: true
              description: New values of changed fields
            changed_fields:
              type: array
              nullable: true
              items:
                type: string
              description: List of field names that changed
            status:
              type: string
              enum:
                - success
                - failure
                - denied
            error_message:
              type: string
              nullable: true
              example: Example text
            intent_id:
              type: string
              nullable: true
              deprecated: true
              description: Legacy UUID of the associated intent. Deprecated — use `intent` (`int_...`) instead.
            intent:
              type: string
              nullable: true
              description: The associated intent's id (`int_...`) if this event was triggered by an intent.
              example: int_aB3xQ9k2vF8mNp1zT5wY7Qc4
            created_at:
              type: string
              format: date-time
              example: '2025-03-01T12:00:00Z'
    ConnectedApp:
      type: object
      description: An OAuth application authorized by the user
      properties:
        id:
          type: integer
          example: 123
        type:
          type: string
          example: connected_app
        attributes:
          type: object
          properties:
            name:
              type: string
              example: ChatGPT via Wefunder MCP
            scopes:
              type: array
              items:
                type: string
              example:
                - read:syndicates
                - write:syndicates
              description: All scopes across active tokens for this app
            last_active_at:
              type: string
              format: date-time
              nullable: true
              description: When the most recent token was last used
              example: '2025-03-01T12:00:00Z'
            action_count:
              type: integer
              description: Total audit events for this app
              example: 34
            created_at:
              type: string
              format: date-time
              nullable: true
              description: When the user first authorized this app
              example: '2025-03-01T12:00:00Z'
    ValidationError:
      type: object
      description: |
        Returned on `422 Unprocessable Entity` when request fields fail validation.
        `details` is an array of per-field problems.
      properties:
        error:
          type: object
          properties:
            type:
              type: string
              example: validation_error
            message:
              type: string
              example: Validation failed
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: terms.minimum_investment_cents
                  code:
                    type: string
                    example: too_low
                  message:
                    type: string
                    example: Minimum investment must be at least $1,000 (100000 cents)
    SpvTerms:
      type: object
      description: Investment terms for an SPV.
      required:
        - structure
        - valuation_cap_cents
        - minimum_investment_cents
        - target_raise_cents
      properties:
        structure:
          type: string
          enum:
            - safe
            - convertible_note
            - equity
          example: safe
        safe_type:
          type: string
          description: Required when `structure` is `safe`.
          enum:
            - post_money
            - pre_money
          nullable: true
          example: post_money
        valuation_cap_cents:
          type: integer
          example: 1000000000
        discount_percent:
          type: integer
          nullable: true
          description: Discount percentage (e.g. 20 for 20%).
          example: null
        minimum_investment_cents:
          type: integer
          example: 1000000
        target_raise_cents:
          type: integer
          example: 100000000
        max_raise_cents:
          type: integer
          nullable: true
          example: 200000000
    SpvSettings:
      type: object
      properties:
        accreditation_type:
          type: string
          description: '`self_attestation` (506b) or `verified` (506c).'
          enum:
            - self_attestation
            - verified
          default: self_attestation
        auto_close_on_target:
          type: boolean
          default: false
          description: Automatically begin closing when the target raise is reached.
        notify_on_investment:
          type: boolean
          default: true
          description: Send a partner webhook on each new investment.
    TargetCompanyInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Acme Inc
        legal_name:
          type: string
          example: Acme Inc.
        website:
          type: string
          example: https://acme.com
        description:
          type: string
          example: AI-powered productivity tools
        state_of_incorporation:
          type: string
          description: Two-letter US state code.
          example: DE
    SpvCreateInput:
      type: object
      required:
        - name
        - target_company
        - terms
      properties:
        name:
          type: string
          example: Acme Series A SPV
        target_company:
          $ref: '#/components/schemas/TargetCompanyInput'
        terms:
          $ref: '#/components/schemas/SpvTerms'
        settings:
          $ref: '#/components/schemas/SpvSettings'
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary partner-defined key-value pairs echoed back on the SPV.
          example:
            partner_reference: acme-series-a-2025
            internal_notes: Introduced via Demo Day
    SpvMetrics:
      type: object
      properties:
        total_raised_cents:
          type: integer
          example: 5000000
        investor_count:
          type: integer
          description: Investors with an active investment in this SPV.
          example: 12
        documented_soft_cap:
          type: integer
          description: The documented per-SPV investor soft cap (247). Advisory only — it is not enforced, and `investor_count` may exceed it.
          example: 247
        confirmed_count:
          type: integer
          example: 8
        pending_count:
          type: integer
          example: 4
        average_investment_cents:
          type: integer
          example: 416666
    Spv:
      type: object
      properties:
        id:
          type: string
          example: spv_abc123
        type:
          type: string
          example: spv
        attributes:
          type: object
          properties:
            name:
              type: string
              example: Acme Series A SPV
            status:
              type: string
              enum:
                - draft
                - open
                - closing
                - closed
                - canceled
                - dissolved
              example: open
            series_name:
              type: string
              example: Acme Series A SPV, a series of Wefunder LLC
            invest_url:
              type: string
              nullable: true
              example: https://wefunder.com/invest/spv_abc123
            target_company:
              type: object
              properties:
                id:
                  type: string
                  example: co_xyz789
                name:
                  type: string
                  example: Acme Inc
            terms:
              $ref: '#/components/schemas/SpvTerms'
            metrics:
              $ref: '#/components/schemas/SpvMetrics'
            metadata:
              type: object
              additionalProperties: true
            created_at:
              type: string
              format: date-time
              example: '2025-01-15T10:00:00Z'
            opened_at:
              type: string
              format: date-time
              nullable: true
            closing_at:
              type: string
              format: date-time
              nullable: true
            closed_at:
              type: string
              format: date-time
              nullable: true
    PartnerInvestor:
      type: object
      description: |
        An investor in an SPV, aggregated across all their investments in it.
        `full_name` and `email` are null unless the token holds `read:investors:pii`.
      properties:
        id:
          type: string
          example: usr_abc123
        type:
          type: string
          example: investor
        attributes:
          type: object
          properties:
            full_name:
              type: string
              nullable: true
              example: Ada Lovelace
            email:
              type: string
              nullable: true
              example: ada@example.com
            accredited:
              type: boolean
              example: true
            total_invested_cents:
              type: integer
              description: Sum of the investor's active investments in this SPV.
              example: 500000
            investment_count:
              type: integer
              example: 2
            created_at:
              type: string
              format: date-time
              nullable: true
              description: When the investor first invested in this SPV.
              example: '2025-01-15T12:00:00Z'
    SpvStatus:
      type: object
      properties:
        id:
          type: string
          example: ofr_abc123
        type:
          type: string
          example: spv_status
        attributes:
          type: object
          properties:
            status:
              type: string
              enum:
                - draft
                - open
                - closing
                - closed
                - canceled
              example: closing
            requires_ops_review:
              type: boolean
              description: The offering is awaiting Wefunder review before it can open.
              example: false
            disbursement_scheduled:
              type: boolean
              description: A disbursement is queued for this SPV but funds have not moved yet.
              example: true
            expected_disbursement_at:
              type: string
              format: date-time
              nullable: true
              description: Estimated date funds will be disbursed — 3 business days from when the close executed and the SPV entered the disbursement queue. Present only while `status` is `closing` (awaiting disbursement); null before close and once funds have moved.
              example: '2026-07-28T00:00:00Z'
            finalized_investor_list:
              type: boolean
              description: The investor roster has been finalized.
              example: false
    BulkInviteLinkCreateInput:
      type: object
      required:
        - invite_links
      properties:
        invite_links:
          type: array
          maxItems: 100
          description: Up to 100 per-person invites. Each item must include `email` or `wefunder_user_id`.
          items:
            $ref: '#/components/schemas/InviteLinkCreateInput'
    BulkInviteLinkEnvelope:
      type: object
      description: 207 Multi-Status — created links in `data`, per-item failures in `errors`.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InviteLink'
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: Position of the failed item in the request array.
                example: 2
              type:
                type: string
                example: mutually_exclusive_params
              detail:
                type: string
                example: provide either email or wefunder_user_id, not both
        meta:
          type: object
          properties:
            created:
              type: integer
            failed:
              type: integer
            request_id:
              type: string
    InviteLinkCreateInput:
      type: object
      description: |
        All fields optional. With no `email`/`wefunder_user_id` the link is
        **reusable**; with either it becomes a **per-person** invite. `email` and
        `wefunder_user_id` are mutually exclusive. `max_uses` is rejected for
        per-person invites; `send_email` is rejected without a recipient.
      properties:
        allocation_cents:
          type: integer
          nullable: true
          description: |
            Budget cap, in cents. Reusable → total budget across all claims of the
            link. Per-person → the single recipient's cap.
          example: 5000000
        max_uses:
          type: integer
          nullable: true
          description: Claim cap for a reusable link. Null = unlimited. Not allowed for per-person invites.
          example: 50
        email:
          type: string
          nullable: true
          description: Recipient email. Makes the link per-person. Mutually exclusive with `wefunder_user_id`.
          example: investor@example.com
        wefunder_user_id:
          type: string
          nullable: true
          description: Id (`usr_...`) of an existing Wefunder user to invite. Mutually exclusive with `email`; must resolve to a user (else 404).
          example: usr_existing123
        first_name:
          type: string
          nullable: true
          description: Recipient first name (per-person only).
          example: Jane
        last_name:
          type: string
          nullable: true
          description: Recipient last name (per-person only).
          example: Investor
        message:
          type: string
          nullable: true
          description: Personal message included in the invite email (per-person only).
          example: Excited to have you in this deal!
        send_email:
          type: boolean
          default: true
          description: Whether to email the invite (per-person only). Rejected on a reusable create.
    InviteLinkUpdateInput:
      type: object
      description: Only link terms are mutable; recipient identity, `reuse`, and the URL token cannot change. Other fields are ignored.
      properties:
        allocation_cents:
          type: integer
          nullable: true
          example: 5000000
        max_uses:
          type: integer
          nullable: true
          description: Rejected for per-person invites and when set below the current `uses_count`.
          example: 50
    InviteLink:
      type: object
      description: |
        A partner invite link. `id` is the link's `il_...` id (distinct from the URL
        access `token`, which lives only in `url`). Per-person (`reuse: false`)
        links carry the extra recipient + derived-status attributes below; reusable
        links omit them.
      properties:
        id:
          type: string
          example: il_aB3xQ9k2vF8mNp1zT5wY7Q
        type:
          type: string
          example: invite_link
        attributes:
          type: object
          properties:
            url:
              type: string
              description: Shareable invite URL. Carries the access token, not the id.
              example: https://wefunder.com/i/abc123token
            allocation_cents:
              type: integer
              nullable: true
              example: 5000000
            max_uses:
              type: integer
              nullable: true
              example: 50
            uses_count:
              type: integer
              example: 0
            active:
              type: boolean
              description: False once the link is canceled (soft-deleted).
              example: true
            created_at:
              type: string
              format: date-time
              example: '2025-01-15T10:00:00Z'
            email:
              type: string
              nullable: true
              description: Per-person only — recipient email.
              example: investor@example.com
            wefunder_user_id:
              type: string
              nullable: true
              description: Per-person only — the recipient's id (`usr_...`), when they are an existing user.
              example: usr_existing123
            status:
              type: string
              nullable: true
              description: |
                Per-person only — derived live, not stored. `pending` (sent, not yet
                opened), `opened` (link clicked), `invested` (a matching active
                investment exists), `revoked` (canceled).
              enum:
                - pending
                - opened
                - invested
                - revoked
              example: pending
            opened_at:
              type: string
              format: date-time
              nullable: true
              description: Per-person only.
            invested_at:
              type: string
              format: date-time
              nullable: true
              description: Per-person only.
            investment_id:
              type: string
              nullable: true
              description: Per-person only — the id (`inv_...`) of the matching investment.
              example: inv_def789
            events:
              type: array
              description: Engagement timeline. Present on the show (get-one) endpoint only.
              items:
                type: object
                properties:
                  event:
                    type: string
                    example: send
                  city:
                    type: string
                    nullable: true
                  country_code:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
    InvestmentSessionCreateInput:
      type: object
      description: |
        Either `email` (invite an unknown recipient) or `wefunder_user_id` (target an
        existing Wefunder user) should be provided. `spv_id` is required on
        `POST /partner/investment_sessions`; on the deprecated SPV-nested path the
        SPV comes from the URL instead.
      properties:
        spv_id:
          type: string
          nullable: true
          description: The SPV to invest into (prefixed, e.g. `spv_abc123`).
          example: spv_abc123
        email:
          type: string
          nullable: true
          example: investor@example.com
        wefunder_user_id:
          type: string
          nullable: true
          example: usr_existing123
        allocation_cents:
          type: integer
          nullable: true
          minimum: 100
          multipleOf: 100
          description: |
            Fixed investment amount, in cents (whole dollars only). Locks the
            checkout to exactly this value, overriding the SPV's min/max
            purchase range. Omit to let the recipient choose an amount within
            that range.
          example: 5000000
        success_url:
          type: string
          nullable: true
          description: Where to send the recipient after they complete the session.
          example: https://partner.com/done
        expires_in_hours:
          type: integer
          nullable: true
          minimum: 1
          maximum: 2160
          description: Session lifetime in hours (default 720, i.e. 30 days).
          example: 72
        metadata:
          type: object
          nullable: true
          description: Free-form key/value pairs stored with the session and echoed back on reads.
        intent_id:
          type: string
          nullable: true
          description: The Intent that gated the SPV's creation, for audit; stored in `metadata`.
          example: int_abc123
    InvestmentSession:
      type: object
      properties:
        id:
          type: string
          example: is_abc123
        type:
          type: string
          example: investment_session
        attributes:
          type: object
          properties:
            status:
              type: string
              enum:
                - pending
                - in_progress
                - completed
                - abandoned
                - expired
                - canceled
              example: pending
            url:
              type: string
              description: The hosted URL the recipient opens to begin the flow.
              example: https://wefunder.com/invest/session/is_abc123
            spv_id:
              type: string
              example: spv_abc123
            email:
              type: string
              nullable: true
              example: investor@example.com
            allocation_cents:
              type: integer
              nullable: true
              description: The fixed amount the session locks to, in cents; null when the recipient chooses their own amount.
              example: 5000000
            kyc_status:
              type: string
              enum:
                - pending
                - passed
                - failed
              nullable: true
              example: pending
            funding_status:
              type: string
              enum:
                - pending
                - succeeded
                - card_declined
                - insufficient_funds
              nullable: true
              example: pending
            investment_id:
              type: string
              nullable: true
              description: Populated once the session completes successfully.
              example: invt_def789
            metadata:
              type: object
              description: The key/value pairs supplied at creation.
            created_at:
              type: string
              format: date-time
              example: '2025-01-15T10:00:00Z'
            expires_at:
              type: string
              format: date-time
              nullable: true
            events:
              type: array
              description: Durable platform events recorded about this session, oldest first. Only present on the single-session GET.
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: evt_abc123
                  event:
                    type: string
                    example: investment_session.completed
                  occurred_at:
                    type: string
                    format: date-time
    PartnerInvestment:
      type: object
      properties:
        id:
          type: string
          example: invt_abc123
        type:
          type: string
          example: investment
        attributes:
          type: object
          properties:
            amount_cents:
              type: integer
              example: 2500000
            status:
              type: string
              enum:
                - pending
                - awaiting_payment
                - pending_accreditation
                - confirmed
                - canceled
              example: confirmed
            spv_id:
              type: string
              example: spv_abc123
            investor_id:
              type: string
              nullable: true
              example: investor_usr456
            accreditation:
              type: object
              nullable: true
              properties:
                type:
                  type: string
                  enum:
                    - self_attestation
                    - verified
                  example: verified
                status:
                  type: string
                  enum:
                    - pending
                    - passed
                    - failed
                    - expired
                  example: pending
                basis:
                  type: string
                  nullable: true
                  example: income
                submitted_at:
                  type: string
                  format: date-time
                  nullable: true
            confirmed_at:
              type: string
              format: date-time
              nullable: true
            created_at:
              type: string
              format: date-time
              example: '2025-01-15T10:00:00Z'
    Investor:
      type: object
      description: |
        An investor known to the partner. PII fields (`full_name`, `email`) are only
        populated when the token holds the required access tier; otherwise they are null.
      properties:
        id:
          type: string
          example: investor_usr456
        type:
          type: string
          example: investor
        attributes:
          type: object
          properties:
            full_name:
              type: string
              nullable: true
              example: Jane Investor
            email:
              type: string
              nullable: true
              example: investor@example.com
            accredited:
              type: boolean
              nullable: true
              example: true
            total_invested_cents:
              type: integer
              example: 7500000
            investment_count:
              type: integer
              example: 2
            created_at:
              type: string
              format: date-time
              example: '2025-01-15T10:00:00Z'
    PartnerWebhookSubscriptionCreateInput:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          example: https://partner.com/webhooks/wefunder
        events:
          type: array
          items:
            type: string
          example:
            - spv.opened
            - spv.closed
            - investment.created
            - investment.confirmed
    PartnerWebhookSubscription:
      type: object
      properties:
        id:
          type: string
          example: whs_abc123
        type:
          type: string
          example: webhook_subscription
        attributes:
          type: object
          properties:
            url:
              type: string
              example: https://partner.com/webhooks/wefunder
            events:
              type: array
              items:
                type: string
              example:
                - spv.opened
                - spv.closed
            active:
              type: boolean
              example: true
            created_at:
              type: string
              format: date-time
              example: '2025-01-15T10:00:00Z'
    PartnerWebhookSubscriptionWithSecret:
      allOf:
        - $ref: '#/components/schemas/PartnerWebhookSubscription'
        - type: object
          properties:
            attributes:
              type: object
              properties:
                secret:
                  type: string
                  description: |
                    The signing secret, shown only once at creation. Used to verify the
                    `X-Wefunder-Signature` header on delivered events.
                  example: whsec_abc123def456
    PartnerWebhookEvent:
      type: object
      description: The payload delivered to a subscribed webhook URL.
      properties:
        id:
          type: string
          example: evt_abc123
        event:
          type: string
          description: |
            The event type. SPV: `spv.created`, `spv.opened`, `spv.updated`,
            `spv.closing`, `spv.closed`, `spv.canceled`. Invites/sessions:
            `invite.created`, `invite.opened`, `invite.invested`, `invite.expired`,
            `investment_session.created`, `investment_session.completed`. Investments:
            `investment.created`, `investment.confirmed`, `investment.canceled`,
            `investment.accreditation_verified`, `investment.accreditation_failed`.
            Disbursement: `disbursement.initiated`, `disbursement.completed`,
            `disbursement.failed`. Plus `webhook.test`.
          example: investment.created
        created_at:
          type: string
          format: date-time
          example: '2025-01-15T15:00:00Z'
        data:
          type: object
          additionalProperties: true
          description: Event-specific payload (e.g. the affected SPV and investment).
        partner_reference:
          type: string
          nullable: true
          description: Echoes the SPV's `metadata.partner_reference` when present.
          example: acme-series-a-2025
  responses:
    Unauthorized:
      description: |
        Authentication required or token is invalid/expired. This error occurs when:
        - No Authorization header is provided
        - The access token is invalid or malformed
        - The access token has expired
        - The access token has been revoked

        To resolve: Obtain a new access token using the OAuth 2.0 flow.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        The authenticated user does not have permission to access this resource.
        This typically means:
        - The user is authenticated but lacks the required OAuth scope
        - The resource belongs to a different user
        - The user's role doesn't allow this operation

        Check that your OAuth token includes the necessary scopes for this endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimitExceeded:
      description: |
        Too many requests in a short time period. The API enforces rate limits to ensure
        fair usage and system stability. When you exceed the limit, you'll receive this
        error along with headers indicating when you can retry.

        Check the `X-RateLimit-Reset` header to know when your limit will reset.
        Consider implementing exponential backoff in your application.
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Request limit per hour
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests
        X-RateLimit-Reset:
          schema:
            type: integer
          description: UTC timestamp when the limit resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource does not exist or is not visible to this token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        The request conflicts with the resource's current state (for example, opening an
        SPV that is already open, or closing one that is not yet open).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: One or more request fields failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    NotImplemented:
      description: |
        This endpoint is defined but not yet implemented. It is published so partners and
        tooling can build against the contract ahead of release.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SandboxOnly:
      description: |
        This endpoint only works with sandbox (`at_test_`) tokens. It was called with a
        production (`at_live_`) token and refused, because it mints fake investors and money.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
