    post:
      tags:
        - Member Links
      summary: Create a member link
      description: |
        Mints a link that sends one of your members to this offering's deal page. It
        carries no email: it binds to the first Wefunder account that invests through
        it, whatever address that account uses, or up front when you pass the
        `wefunder_user_id` of a member whose account you already know. A bound link
        answers only to its account: anyone else (logged out, or another account) gets
        no private access and no invited pricing, and is asked to sign in with the
        invited account.

        The member gets what an invitation from the offering's manager or founder
        gets: access to a private round and invited pricing.

        Pass `reference` (your member id) to make the create idempotent per offering:
        repeating it returns the live link with 200. The same reference on another
        offering mints that offering's own link, since a member gets one link per
        deal. Requires a syndicate- or company-owned token of an app installed on the
        offering's syndicate or company; user tokens get 404.
      operationId: createOfferingMemberLink
      security:
        - bearerAuth:
            - write:invite_links
      parameters:
        - $ref: '#/components/parameters/member_link_offering_id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                member_link:
                  $ref: '#/components/schemas/MemberLinkCreateInput'
      responses:
        '200':
          description: The live link for a repeated `reference`, or an `Idempotency-Key` replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberLinkEnvelope'
              example:
                data:
                  id: il_8kQm2xVb7nRt4WcY9pLe3HdA
                  type: member_link
                  attributes:
                    url: https://wefunder.com/arc-hockey?invite_token=kL273wxd4DGb896V87ddtLE9
                    state: created
                    reference: member_8812
                    wefunder_user_id: usr_4fQ8sLm2Vx9TbR7nKc3YdHpW
                    investment_id: inv_7hTk2PqW9mXc4RbN8vLs3DyF
                    offering: ofr_2nVb8KxQ4tLm9RcW7pHs3FdY
                    created_at: '2026-01-15T17:30:00Z'
                meta:
                  request_id: string
        '201':
          description: Member link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberLinkEnvelope'
              example:
                data:
                  id: il_8kQm2xVb7nRt4WcY9pLe3HdA
