  /member_links/{id}/cancel:
    post:
      tags:
        - Member Links
      summary: Cancel a member link
      description: |
        Retracts the invitation. Idempotent. The link grants nothing new afterwards:
        a checkout started after the cancel, including the same member's next
        investment, is priced at standard terms. Investments already made through the
        link keep the terms they were made at. A link nobody invested through is
        also released from the account you pre-bound it to. Revoking your install
        cancels every member link it minted that no investment went through (same
        release); links an investment went through stand.
      operationId: cancelMemberLink
      security:
        - bearerAuth:
            - write:invite_links
      parameters:
        - $ref: '#/components/parameters/member_link_id'
      responses:
        '200':
          description: The canceled member link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberLinkEnvelope'
              example:
                data:
                  id: il_8kQm2xVb7nRt4WcY9pLe3HdA
                  type: member_link
                  attributes:
                    url: https://wefunder.com/arc-hockey?invite_token=kL273wxd4DGb896V87ddtLE9
                    state: created
                    reference: member_8812
                    wefunder_user_id: usr_4fQ8sLm2Vx9TbR7nKc3YdHpW
                    investment_id: inv_7hTk2PqW9mXc4RbN8vLs3DyF
                    offering: ofr_2nVb8KxQ4tLm9RcW7pHs3FdY
                    created_at: '2026-01-15T17:30:00Z'
                meta:
                  request_id: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: |
        OAuth 2.0 authorization with access tokens. User tokens come from the
        authorization-code flow; a server-side (client_credentials) key acts as the
        app with no user, so it may hold only `read:public` and the app-owned
        referral code scopes, and can never read user-scoped data.
      flows:
        authorizationCode:
          authorizationUrl: https://wefunder.com/oauth/authorize
          tokenUrl: https://api.wefunder.com/oauth/token
          scopes:
            read:public: View public deal data (no account needed)
            read:explore: View the deals you can see on Wefunder
            read:profile: View your basic profile and the companies you follow
            read:profile:follows: View the companies you follow
            write:profile: Update your profile
            write:follows: Follow and unfollow companies
            write:comments: Draft questions, answers, and comments for your approval
            read:investments: View investments and TTW reservations you can access
            read:companies: View company info and offerings you can access, including the investor roster of a company you help run
            read:invite_links: See the investment links your app created and who used them
            write:invite_links: Create investment links to your offerings
            read:webhooks: View your app's webhook endpoints and delivery history
            write:webhooks: Create, update, and remove your app's webhook endpoints
            read:installations: View where your app is installed
            write:installations: Install and uninstall your app on companies and syndicates you can edit
            read:syndicates: View syndicate deals and members
            write:syndicates: Manage syndicate deals and members
        clientCredentials:
          tokenUrl: https://api.wefunder.com/oauth/token
          scopes:
            read:public: View public deal data (no account needed)
            read:referral_codes: View your app's referral codes and their visit and investor counts
            write:referral_codes: Create and update your app's referral codes
  parameters:
    wefunder_version:
      name: Wefunder-Version
      in: header
      required: false
      description: |
        Dated API version (`YYYY-MM-DD`). Omit to use your application's pinned version.
        Unknown values return `400 invalid_request`. Every response echoes the resolved
        version in `Wefunder-Version` and the newest in `Wefunder-Version-Latest`.
      schema:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      example: '2026-10-01'
    campaign_id:
      name: campaign_id
      in: path
      required: true
      description: The fundraise/campaign ID
      schema:
        type: integer
      example: 789
    syndicate_id:
      name: syndicate_id
      in: path
      required: true
      description: The syndicate's id (`syn_...`).
      schema:
        type: string
      example: syn_aB3xQ9k2vF8mNp1zT5wY7Qc4
    member_id:
      name: member_id
      in: path
      required: true
      description: The member's id (`mem_...`), as returned by the members list (`data[].id`). Integer ids are internal and not accepted.
      schema:
        type: string
      example: mem_aB3xQ9k2vF8mNp1zT5wY7Qc4
    fundraise_id:
      name: fundraise_id
      in: path
      required: true
      description: The deal's id (`ofr_...`), as returned by the deals list. Integer ids are internal and not accepted.
      schema:
        type: string
      example: ofr_yw3OhusvpfJP4Pk3wRYV1F2R
    start_date:
      name: start_date
      in: query
      description: |
        Filter results to attributions on or after this date. Format: YYYY-MM-DD.
        Defaults to 90 days ago if not specified.
      schema:
        type: string
        format: date
      example: '2025-01-01'
    end_date:
      name: end_date
      in: query
      description: |
        Filter results to attributions on or before this date. Format: YYYY-MM-DD.
        Defaults to today if not specified.
      schema:
        type: string
        format: date
      example: '2025-03-31'
    utm_source:
      name: utm_source
      in: query
      description: Filter by UTM source (e.g., "GoogleAds", "facebook", "Klaviyo")
      schema:
        type: string
      example: GoogleAds
    utm_campaign:
      name: utm_campaign
      in: query
      description: Filter by UTM campaign name
      schema:
        type: string
      example: winter_2025
    cursor:
      name: cursor
      in: query
      description: |
        Cursor-based pagination token. Use the `next_cursor` value from the previous response's
        `meta` object to retrieve the next page of results. Omit this parameter to retrieve the
        first page.
      schema:
        type: integer
      example: 12345
    webhook_external_id:
      name: external_id
      in: path
      required: true
      description: The webhook endpoint's id (whe_...).
      schema:
        type: string
      example: whe_8f3ExampleEndpoint00
    webhook_id:
      name: webhook_id
      in: path
      required: true
      description: The webhook subscription ID
      schema:
        type: integer
      example: 123
    spv_id:
      name: id
      in: path
      required: true
      description: The SPV ID (prefixed, e.g. `spv_abc123`)
      schema:
        type: string
      example: spv_abc123
    member_link_offering_id:
      name: id
      in: path
      required: true
      description: The offering ID (prefixed, e.g. `ofr_abc123`), on the syndicate or company your app is installed on.
      schema:
        type: string
      example: ofr_abc123
    member_link_id:
      name: id
      in: path
      required: true
      description: The member link ID (prefixed, e.g. `il_abc123`). Opaque; do not parse it.
      schema:
        type: string
      example: il_abc123
    invite_link_id:
      name: invite_link_id
      in: path
      required: true
      description: The invite link ID (prefixed, e.g. `il_abc123`)
      schema:
        type: string
      example: il_abc123
    investment_session_id:
      name: session_id
      in: path
      required: true
      description: The investment session ID (prefixed, e.g. `is_abc123`)
      schema:
        type: string
      example: is_abc123
    partner_investment_id:
      name: id
      in: path
      required: true
      description: The investment ID (prefixed, e.g. `invt_def456`)
      schema:
        type: string
      example: invt_def456
    webhook_subscription_id:
      name: id
      in: path
      required: true
      description: The webhook subscription ID (prefixed, e.g. `whs_abc123`)
      schema:
        type: string
      example: whs_abc123
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A unique client-generated key that makes a write request safe to retry. If a request
        is retried within 24 hours with the same key and body, the original result is returned
        instead of performing the operation again. Strongly recommended on all `POST` requests
        that create resources.
      schema:
        type: string
      example: acme-series-a-2025-001
  schemas:
    Installation:
      type: object
      properties:
        id:
          type: string
          description: Installation external id (`inst_…`).
        type:
          type: string
          example: installation
        attributes:
          type: object
          properties:
            target:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - company
                    - syndicate
                id:
                  type: string
                  description: '`co_…` or `syn_…`'
                name:
                  type: string
            tier:
              type: string
              description: founder / admin / editor for a company; full_access / operator for a syndicate.
            scopes:
              type: array
              items:
                type: string
            status:
              type: string
              enum:
                - active
                - revoked
            installed_at:
              type: string
              format: date-time
            installed_by:
              type: string
              nullable: true
            revoked_at:
              type: string
              format: date-time
              nullable: true
    InstallationEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Installation'
        meta:
          type: object
    InstallationListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Installation'
        meta:
          type: object
          properties:
            count:
              type: integer
    InstallationTokenEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Installation'
        token:
          type: object
          description: Shown once. Owned by the installed-on company or syndicate, scoped to the install, no expiry; revoking the install revokes it.
          properties:
            access_token:
              type: string
              example: at_live_…
            token_type:
              type: string
              example: Bearer
            scope:
              type: string
            installation:
              type: string
              description: '`inst_…`'
            created_at:
              type: integer
        meta:
          type: object
    EligibleTargetListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - company
                  - syndicate
              id:
                type: string
              name:
                type: string
              tier:
                type: string
                description: The tier an install would be granted at.
              installed:
                type: boolean
              installation:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/Installation'
        meta:
          type: object
    ReferralCodeUtm:
      type: object
      description: |
        Optional UTM presets. On a visit that carries this code, each preset fills the matching
        `utm_*` field when the link leaves it blank; a value on the link always wins. Each value is
        at most 100 printable ASCII characters. `source` and `campaign` may not start with `wf_`.
      properties:
        source:
          type: string
          maxLength: 100
          example: acme_newsletter
        medium:
          type: string
          maxLength: 100
          example: email
        campaign:
          type: string
          maxLength: 100
          example: october
        content:
          type: string
          maxLength: 100
          example: header_link
        term:
          type: string
          maxLength: 100
          example: seed_round
    ReferralCode:
      type: object
      properties:
        id:
          type: string
          example: ref_8f3ExampleReferral0000
        type:
          type: string
          example: referral_code
        attributes:
          type: object
          properties:
            label:
              type: string
              example: October newsletter
            active:
              type: boolean
              description: A paused code is ignored on arrival; it still credits cookies set while it was active.
            target:
              type: object
              nullable: true
              description: |
                The company or offering this code credits, or null for any company. If the target
                no longer exists, `id` is null and `unavailable` is true: the code credits nothing.
              properties:
                type:
                  type: string
                  enum:
                    - company
                    - offering
                id:
                  type: string
                  nullable: true
                  example: co_7hQExampleCompany0001
                unavailable:
                  type: boolean
                  description: Present and true when the target no longer exists.
            utm:
              $ref: '#/components/schemas/ReferralCodeUtm'
            metadata:
              type: object
              additionalProperties: true
            link_parameter:
              type: string
              description: The query parameter to append to any wefunder.com link.
              example: wfr=ref_8f3ExampleReferral0000
            stats:
              allOf:
                - $ref: '#/components/schemas/ReferralCodeVisits'
              description: |
                On list and retrieve only: the daily visit snapshot. Investor ranges are per
                company and per week, on `GET /referral_codes/{id}/stats`.
            created_at:
              type: string
              format: date-time
              example: '2026-10-13T17:30:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2026-10-13T17:30:00Z'
    ReferralCodeVisits:
      type: object
      properties:
        visits:
          type: integer
          example: 412
        unique_visitors:
          type: integer
          example: 388
        visits_as_of:
          type: string
          format: date
          description: The last full UTC day the visit numbers include.
          example: '2026-10-12'
    ReferralCohort:
      type: object
      properties:
        week:
          type: string
          description: ISO week, Monday to Sunday UTC.
          example: 2026-W42
        investors:
          type: object
          description: Unique investors referred that week, as a range. Never exact.
          properties:
            min:
              type: integer
              example: 0
            max:
              type: integer
              example: 2
        policy_version:
          type: integer
          example: 1
        published_at:
          type: string
          format: date-time
          example: '2026-10-19T06:05:00Z'
    ReferralCodeStatsCompany:
      type: object
      properties:
        company:
          type: string
          example: co_7hQExampleCompany0001
        level:
          type: string
          enum:
            - counts
            - anonymized
            - full
          description: What your app may see for this company, from its installation on it.
        verification_url:
          type: string
          format: uri
          description: Where the company's founders verify referrals in their own dashboard.
          example: https://wefunder.com/acme/marketing/reports#partners
        in_scope_since:
          type: string
          description: Counts level only. The first week this company has cells for.
          example: 2026-W42
        weeks:
          type: array
          description: Counts level only. Every completed week since in_scope_since.
          items:
            $ref: '#/components/schemas/ReferralCohort'
        investments:
          type: array
          description: |
            Anonymized or full level only, replacing `weeks`. Anonymized rows carry opaque
            `investment` and `investor` tokens, `week`, `amount_tier`, `status` and
            `time_to_invest`; full rows carry the investment id, the investor's name and email,
            the exact `amount`, `status`, `clicked_at`, `applied_at` and the UTM attribution.
          items:
            type: object
            additionalProperties: true
        investments_next_cursor:
          type: integer
          description: Present when the company has more rows; pass it as `investments_cursor` with `company_id`.
    ReferralCodeStatsEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              example: ref_8f3ExampleReferral0000
            type:
              type: string
              example: referral_code_stats
            attributes:
              allOf:
                - $ref: '#/components/schemas/ReferralCodeVisits'
                - type: object
                  properties:
                    label:
                      type: string
                      example: October newsletter
                    companies:
                      type: array
                      items:
                        $ref: '#/components/schemas/ReferralCodeStatsCompany'
        meta:
          type: object
          properties:
            has_more:
              type: boolean
              example: false
            page_count:
              type: integer
              example: 1
            next_cursor:
              type: integer
              description: Present when has_more is true.
            request_id:
              type: string
    ReferralCodeEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ReferralCode'
        meta:
          type: object
          properties:
            request_id:
              type: string
    ReferralCodeListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReferralCode'
        meta:
          type: object
          properties:
            has_more:
              type: boolean
              example: false
            page_count:
              type: integer
              example: 1
            next_cursor:
              type: integer
              description: Present when has_more is true.
            active_limit:
              type: integer
              description: Maximum active codes allowed for this application.
              example: 500
            request_id:
              type: string
    WebhookEndpoint:
      type: object
      properties:
        id:
          type: string
          example: whe_8f3ExampleEndpoint00
        type:
          type: string
          example: webhook_endpoint
        attributes:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: |
                The full URL. App-wide endpoints always carry it; an installation-bound endpoint carries
                it only in the create response that made it, and `url_hint` everywhere else.
            url_hint:
              type: string
              description: Host plus the last six characters of a bound endpoint's URL, for recognition only.
              example: hooks.zapier.com …3kq9Zz
            installation:
              type: string
              nullable: true
              description: The installation this endpoint is bound to (`inst_…`), or null for an app-wide endpoint.
              example: inst_7hQExampleInstall01
            mode:
              type: string
              enum:
                - live
                - test
            events:
              type: array
              items:
                type: string
            enabled:
              type: boolean
            secret:
              type: string
              description: Signing secret. Present only in create and rotate_secret responses.
              example: whsec_4Zb7ExampleSigningSecret0000000000
            failing_since:
              type: string
              format: date-time
              nullable: true
            last_delivery_at:
              type: string
              format: date-time
              nullable: true
            last_delivery_status:
              type: string
              nullable: true
              description: |
                Outcome of the most recent delivery: the HTTP status code as a string (for
                example `"200"` or `"503"`), or, when no response came back, one of
                `timeout`, `blocked_url`, `tls_error`, `connection_failed`.
              example: '200'
            created_at:
              type: string
              format: date-time
    WebhookEndpointEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/WebhookEndpoint'
        meta:
          type: object
          properties:
            request_id:
              type: string
    WebhookEndpointListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
        meta:
          type: object
          properties:
            count:
              type: integer
            quota:
              type: integer
              description: Maximum endpoints allowed for this application.
            request_id:
              type: string
    WebhookEndpointTestResultEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              example: webhook_test
            delivered:
              type: boolean
            response_code:
              type: integer
              nullable: true
            error:
              type: string
              nullable: true
              enum:
                - timeout
                - blocked_url
                - tls_error
                - connection_failed
                - null
              description: |
                Why no HTTP response came back. `null` when the endpoint responded, even with a
                non-2xx status (see `response_code`). `blocked_url` means the URL failed the
                HTTPS/public-address check at send time.
            duration_ms:
              type: integer
            event:
              type: string
            payload:
              type: object
              description: The exact signed envelope that was POSTed.
        meta:
          type: object
          properties:
            request_id:
              type: string
    InvestmentChangeListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InvestmentDeltaRecord'
        meta:
          type: object
          properties:
            mode:
              type: string
              enum:
                - bootstrap
                - delta
            has_more:
              type: boolean
            next_cursor:
              type: string
              description: Always present. Pass it back as `cursor` on the next call, even when `has_more` is false.
            page_count:
              type: integer
            company_id:
              type: string
    InvestmentDeltaRecord:
      type: object
      description: |
        The record of one investment, or a tombstone. A tombstone is `visible: false` with `id` and
        the sync metadata (`observed_at`, `cursor`, `reason`) and no payload fields: no `status`,
        `amounts`, `investor`. `visible` is founder visibility: a user's own canceled investment is a
        full record with `visible: false` and `status: canceled`, so tell the two apart by the
        presence of `status`, not by `visible`. Investor PII keys are omitted without
        `read:investors:pii`, except on the user's own records.
      required:
        - id
        - visible
        - observed_at
      properties:
        id:
          type: string
          description: Investment external id (`inv_…`), stable for the life of the investment.
        visible:
          type: boolean
        status:
          type: string
          enum:
            - reserved
            - active
            - executed
            - canceled
            - converted
          description: Company/offering audiences receive canceled and converted investments as tombstones; the values appear for audiences that can see them (e.g. the investor's own).
        converted_to:
          type: string
          nullable: true
        converted_from:
          type: string
          nullable: true
        offering:
          type: string
          description: Offering external id (`ofr_…`).
        company:
          type: string
          description: Company external id (`co_…`).
        investment_type:
          type: string
        offering_type:
          type: string
        group:
          type: string
          description: The founder dashboard's investment group label (e.g. CONFIRMED, IS READY).
        applied_at:
          type: string
          format: date-time
        amounts:
          type: object
          properties:
            committed_cents:
              type: integer
            investment_size_cents:
              type: integer
            in_escrow_cents:
              type: integer
            raised_cents:
              type: integer
              description: What this investment contributes to the offering's public raised figure (the deal page, company card and directory header). Equals `investment_size_cents` once the investment is soft-confirmed; 0 until then (see `needs_whitelisting`). Summing `raised_cents` over an offering's records reproduces the site's number; summing `committed_cents` does not.
            currency:
              type: string
              example: usd
        shares:
          type: string
          nullable: true
          description: Shares this investment buys at its committed amount, as a decimal string (`"295"`, `"1234.5"`). For an investment through the SPV this is the company shares allotted to it through the vehicle. `null` when the round has no share concept (SAFE, note, reservation) or no shares are computed for the investment. Computed per investment; not the investor's post-funding position.
          example: '295'
        average_share_price:
          type: string
          nullable: true
          description: Weighted average price per share for this investment (total share price / `shares`), as a decimal string. With tiered or early-bird pricing this need not equal any single price on the round. `null` whenever `shares` is `null`.
          example: '3.38'
        needs_whitelisting:
          type: boolean
        external_username:
          type: string
          nullable: true
          description: PII scope.
        message:
          type: string
          nullable: true
          description: PII scope.
        investor:
          type: object
          properties:
            id:
              type: string
              description: Investor external id (`usr_…`).
            deactivated:
              type: boolean
              description: |
                True once the investor's Wefunder account has been deactivated. The identity fields are then
                redacted (`name`/`legal_name` = `[deleted user]`, the rest null) and the record is republished
                with `reason: investor_deactivated`; overwrite your copy. The investment itself persists.
            via_entity:
              type: boolean
            name:
              type: string
              description: PII scope.
            legal_name:
              type: string
              description: PII scope.
            email:
              type: string
              nullable: true
              description: PII scope.
            address:
              type: object
              description: PII scope.
            bio:
              type: string
              nullable: true
              description: PII scope.
        blockers:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              description:
                type: string
                nullable: true
        contracts:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                nullable: true
              override_amount_cents:
                type: integer
                nullable: true
              early_bird:
                type: boolean
        observed_at:
          type: string
          format: date-time
          description: When this payload was observed by the publisher. Not a version.
        cursor:
          type: string
          nullable: true
          description: Ledger position of the change that listed this record (delta pages only).
        reason:
          type: string
          nullable: true
          enum:
            - changed
            - recomputed
            - reprojected
            - investor_deactivated
            - null
          description: |
            Why the ledger row exists. Delta pages only; `null` on list pages and on retrieve. Every
            value is a record to upsert. `changed`: a partner-visible field moved. `recomputed`: the
            investment's inputs did not change and the record moved only because Wefunder changed how
            it derives a field; sync it, but a notification rule may skip it. `reprojected`: the
            retired name for `recomputed`, still served on rows published before the rename for as
            long as they are retained (90 days); treat it exactly like `recomputed`.
            `investor_deactivated` marks the first republish after the investor's account was
            deactivated (identity fields redacted).
