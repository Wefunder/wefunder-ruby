      security:
        - bearerAuth:
            - read:syndicates
      parameters:
        - $ref: '#/components/parameters/syndicate_id'
        - $ref: '#/components/parameters/cursor'
        - name: per_page
          in: query
          description: Page size, 1-100. Defaults to 25.
          schema:
            type: integer
            default: 25
            maximum: 100
        - name: status
          in: query
          description: Filter positions by status.
          schema:
            type: string
            enum:
              - active
              - exited
              - sold
              - failed
        - name: company
          in: query
          description: Filter to a single company by its id (`co_...`). Unknown ids return 404.
