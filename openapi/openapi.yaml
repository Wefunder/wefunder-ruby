  /companies/{id}:
    get:
      tags:
        - Explore
      summary: Get a company page
      description: |
        The company page behind an offering, as structured data — the "click a company" step after
        `/explore`. Addressed by the `co_...` id every offering carries in its top-level `company` field (a bare string).

        Keeps apart the three raised numbers the page shows and readers conflate:
        `current_raise.amount_raised` (this campaign's live rounds combined, on Wefunder),
        `past_rounds[]` (prior rounds the page lists, each tagged `source: wefunder` for rounds
        observed here or `reported` for founder-disclosed off-platform rounds), and
        `totals.profile_total_raised` (the number on the page's ticker bar). Every figure comes
        from the same policy the page uses, so the API never disagrees with the site.

        **Who has a page.** Every company whose profile wefunder.com lists publicly — the same set
        the site's search bar returns (published, not invite-only, searchable or with a live Form C;
        accredited-only companies need an accredited viewer) — plus the `/explore` set. A funded
        company, or one the viewer may see no round of, renders with `raising: false` and
        `current_raise: null`; its history is in `wefunder_rounds`. **Logged-in view
        (`read:explore`)** additionally covers the vault / syndicate-led companies the site shows an
        accredited viewer, and the round described is the one the page would show that viewer. A
        valid id for a company outside the viewer's set is a `404`, never a partial payload.
      operationId: getCompany
      security:
        - bearerAuth:
            - read:public
        - bearerAuth:
            - read:explore
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The company's id (`co_...`).
          example: co_8Kd0aB3xQ9k2vF8mNp1zT5wY
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyEnvelope'
              example:
                data:
                  id: co_8Kd0aB3xQ9k2vF8mNp1zT5wY
                  type: company
                  attributes:
                    name: string
                    tagline: string
                    url: string
                    logo_url: string
                    card_image_url: string
                    location:
                      city: string
                      state: string
                      country: string
                    legal_name: Acme Robotics, Inc.
                    legal_form: Corporation
                    website_url: https://acme.example
                    twitter_url: https://twitter.com/acme
                    linkedin_url: https://linkedin.com/company/acme-robotics
                    facebook_url: https://facebook.com/acme
                    instagram_url: https://instagram.com/acme
                    promotion_opt_in: true
                    raising: true
                    current_raise:
                      offering_id: string
                      offering_ids:
                        - string
                      testing_the_waters: true
                      amount_raised: string
                      funding_target: string
                      investor_count: 1
                      oversubscribed: true
                      closes_at: '2026-01-15T17:30:00Z'
                    past_rounds:
                      - offering_id: string
                        source: wefunder
                        exemption:
                          family: reg_cf
                          subtype: null
                          label: Reg CF
                        amount_raised: string
                        investor_count: 1
                        opened_at: '2026-01-15T17:30:00Z'
                        closed_at: '2026-01-15T17:30:00Z'
                    wefunder_rounds:
                      - offering_id: string
                        current: true
                        status: open
                        exemption:
                          family: reg_cf
                          subtype: null
                          label: Reg CF
                        security:
                          type: safe
                          label: SAFE
                          terms:
                            valuation_cap: '10000000'
                            uncapped: true
                            discount_percent: '20'
                            most_favored_nation: true
                            pro_rata: true
                        amount_raised: string
                        investor_count: 1
                        opened_at: '2026-01-15T17:30:00Z'
                        closed_at: '2026-01-15T17:30:00Z'
                    totals:
                      raised_on_wefunder_all_time: string
                      profile_total_raised: string
                      profile_reported_off_platform: string
                      profile_includes_past_rounds: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown id, or a company the viewer may not see.
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
      x-codeSamples:
