    BulkInviteLinkCreateInput:
      type: object
      required:
        - invite_links
      properties:
        invite_links:
          type: array
          maxItems: 100
          description: Up to 100 per-person invites. Each item must include `email` or `wefunder_user_id`.
          items:
            $ref: '#/components/schemas/InviteLinkCreateInput'
    BulkInviteLinkEnvelope:
      type: object
      description: 207 Multi-Status — created links in `data`, per-item failures in `errors`.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InviteLink'
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: Position of the failed item in the request array.
                example: 2
              type:
                type: string
                example: mutually_exclusive_params
              detail:
                type: string
                example: provide either email or wefunder_user_id, not both
        meta:
          type: object
          properties:
            created:
              type: integer
            failed:
              type: integer
            request_id:
              type: string
    InviteLinkCreateInput:
      type: object
      description: |
        All fields optional. With no `email`/`wefunder_user_id` the link is
        **reusable**; with either it becomes a **per-person** invite. `email` and
        `wefunder_user_id` are mutually exclusive. `max_uses` is rejected for
        per-person invites; `send_email` is rejected without a recipient.
      properties:
        allocation_cents:
          type: integer
          nullable: true
          description: |
            Budget cap, in cents. Reusable → total budget across all claims of the
            link. Per-person → the single recipient's cap.
          example: 5000000
        max_uses:
          type: integer
          nullable: true
          description: Claim cap for a reusable link. Null = unlimited. Not allowed for per-person invites.
          example: 50
        email:
          type: string
          nullable: true
          description: Recipient email. Makes the link per-person. Mutually exclusive with `wefunder_user_id`.
          example: investor@example.com
        wefunder_user_id:
          type: string
          nullable: true
          description: Id (`usr_...`) of an existing Wefunder user to invite. Mutually exclusive with `email`; must resolve to a user (else 404).
          example: usr_existing123
        first_name:
          type: string
          nullable: true
          description: Recipient first name (per-person only).
          example: Jane
        last_name:
          type: string
          nullable: true
          description: Recipient last name (per-person only).
          example: Investor
        message:
          type: string
          nullable: true
          description: Personal message included in the invite email (per-person only).
          example: Excited to have you in this deal!
        send_email:
          type: boolean
          default: true
          description: Whether to email the invite (per-person only). Rejected on a reusable create.
    InviteLinkUpdateInput:
      type: object
      description: Only link terms are mutable; recipient identity, `reuse`, and the URL token cannot change. Other fields are ignored.
      properties:
        allocation_cents:
          type: integer
          nullable: true
          example: 5000000
        max_uses:
          type: integer
          nullable: true
          description: Rejected for per-person invites and when set below the current `uses_count`.
          example: 50
    InviteLink:
      type: object
      description: |
        A partner invite link. `id` is the link's `il_...` id (distinct from the URL
        access `token`, which lives only in `url`). Per-person (`reuse: false`)
        links carry the extra recipient + derived-status attributes below; reusable
        links omit them.
      properties:
        id:
          type: string
          example: il_aB3xQ9k2vF8mNp1zT5wY7Q
        type:
          type: string
          example: invite_link
        attributes:
          type: object
          properties:
            url:
              type: string
              description: Shareable invite URL. Carries the access token, not the id.
              example: https://wefunder.com/i/abc123token
            reuse:
              type: boolean
              description: |
                `true` for a reusable (shareable) link, `false` for a per-person
                invite. Fixed at creation. Use this, not the presence of `email`, to
                tell the two apart.
              example: true
            allocation_cents:
              type: integer
              nullable: true
              example: 5000000
            max_uses:
              type: integer
              nullable: true
              example: 50
            uses_count:
              type: integer
              example: 0
            click_count:
              type: integer
              description: |
                How many times the link was clicked through: a click is recorded when
                the recipient continues past the link's landing page into the
                investment flow (loading the page alone is not counted, since mail
                clients prefetch links). Visits that found the link canceled or the
                offering closed are not clicks, nor are sends. Recorded for per-person
                links only; a reusable link reports 0 (use `uses_count` for its
                claims).
              example: 0
            first_clicked_at:
              type: string
              format: date-time
              nullable: true
              description: When the link was first clicked; null if it never was. A click, not an email open.
              example: null
            active:
              type: boolean
              description: False once the link is canceled (soft-deleted).
              example: true
            canceled_at:
              type: string
              format: date-time
              nullable: true
              description: When the link was canceled; null while it is active.
              example: null
            created_at:
              type: string
              format: date-time
              example: '2025-01-15T10:00:00Z'
            email:
              type: string
              nullable: true
              description: Per-person only — the recipient email you supplied at create. Always `null` for an invite addressed by `wefunder_user_id`, which never returns the account's email.
              example: investor@example.com
            wefunder_user_id:
              type: string
              nullable: true
              description: Per-person only — the recipient's id (`usr_...`), when they are an existing user.
              example: usr_existing123
            status:
              type: string
              nullable: true
              description: |
                Per-person only — derived live, not stored. `pending` (sent, not yet
                opened), `opened` (link clicked), `invested` (a matching active
                investment exists), `revoked` (canceled).
              enum:
                - pending
                - opened
                - invested
                - revoked
                - null
              example: pending
            opened_at:
              type: string
              format: date-time
              nullable: true
              deprecated: true
              description: |
                Per-person only. The first click, not an email open (deprecated: use
                `first_clicked_at`, which has the same value).
            invested_at:
              type: string
              format: date-time
              nullable: true
              description: Per-person only.
            investment_id:
              type: string
              nullable: true
              description: Per-person only — the id (`inv_...`) of the matching investment.
              example: inv_def789
            events:
              type: array
              description: Engagement timeline. Present on the show (get-one) endpoint only.
              items:
                type: object
                properties:
                  event:
                    type: string
                    example: send
                  wefunder_user_id:
                    type: string
                    nullable: true
                    description: |
                      The account that acted (`usr_...`): the sender of a `send` or
                      `resend`, or a signed-in visitor's click. Null when anonymous.
                      Never an email.
                    example: usr_sender456
                  city:
                    type: string
                    nullable: true
                  country_code:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
    InvestmentSessionCreateInput:
      type: object
      description: |
        Either `email` (invite an unknown recipient) or `wefunder_user_id` (target an
        existing Wefunder user) should be provided. `spv_id` is required on
        `POST /partner/investment_sessions`; on the deprecated SPV-nested path the
        SPV comes from the URL instead.
      properties:
        spv_id:
          type: string
          nullable: true
          description: The SPV to invest into (prefixed, e.g. `spv_abc123`).
          example: spv_abc123
        email:
          type: string
          nullable: true
          example: investor@example.com
        wefunder_user_id:
          type: string
          nullable: true
          example: usr_existing123
        allocation_cents:
          type: integer
          nullable: true
          minimum: 100
          multipleOf: 100
          description: |
            Fixed investment amount, in cents (whole dollars only). Locks the
            checkout to exactly this value, overriding the SPV's min/max
            purchase range. Omit to let the recipient choose an amount within
            that range.
          example: 5000000
        success_url:
          type: string
          nullable: true
          description: |
            Where to send the recipient after they complete the session. An absolute `https`
            URL on the origin (scheme, host and port) of one of your app's registered OAuth
            redirect URIs, such as an iOS universal link or Android app link, or a URL in a
            custom scheme one of those redirect URIs uses (`com.partner.app://checkout/done`).
            `http` is accepted only on a loopback host one of your redirect URIs uses. Anything
            else is a `422 validation_error`.
            See [Investment sessions on mobile](/guides/investment-sessions-mobile).
          example: https://partner.com/done
        cancel_url:
          type: string
          nullable: true
          description: |
            Where to send the recipient when they cancel the session on the hosted page, or open
            it after it was canceled or expired. Same rules as `success_url`: an `https` URL on
            a registered redirect URI's origin, or a URL in a registered custom scheme.
            Wefunder appends `session_id` (the session's `is_` id) and `reason` to the query
            string, keeping any parameters already on the URL. `reason` is `user_canceled`
            (the session is now canceled), `user_left` (the investor had already started
            checkout, so the session stays active until it completes or expires), `canceled`
            or `expired`.
          example: https://partner.com/deals/abc?canceled=1
        expires_in_hours:
          type: integer
          nullable: true
          minimum: 1
          maximum: 2160
          description: Session lifetime in hours (default 720, i.e. 30 days).
          example: 72
        metadata:
          type: object
          nullable: true
          description: Free-form key/value pairs stored with the session and echoed back on reads.
        intent_id:
          type: string
          nullable: true
          description: The Intent that gated the SPV's creation, for audit; stored in `metadata`.
          example: int_abc123
    InvestmentSession:
      type: object
      properties:
        id:
          type: string
          example: is_abc123
        type:
          type: string
          example: investment_session
        attributes:
          type: object
          properties:
            status:
              type: string
              enum:
                - pending
                - in_progress
                - completed
                - abandoned
                - expired
                - canceled
              example: pending
            url:
              type: string
              description: The hosted URL the recipient opens to begin the flow.
              example: https://wefunder.com/invest/session/is_abc123
            spv_id:
              type: string
              example: spv_abc123
            email:
              type: string
              nullable: true
              description: The recipient email you supplied. `null` for a session addressed by `wefunder_user_id`, directly or through an invite link addressed that way, which never returns the account's email.
              example: investor@example.com
            allocation_cents:
              type: integer
              nullable: true
              description: The fixed amount the session locks to, in cents; null when the recipient chooses their own amount.
              example: 5000000
            kyc_status:
              type: string
              enum:
                - pending
                - passed
                - failed
                - null
              nullable: true
              example: pending
            funding_status:
              type: string
              enum:
                - pending
                - succeeded
                - card_declined
                - insufficient_funds
                - null
              nullable: true
              example: pending
            investment_id:
              type: string
              nullable: true
              description: Populated once the session completes successfully.
              example: invt_def789
            metadata:
              type: object
              description: The key/value pairs supplied at creation.
            created_at:
              type: string
              format: date-time
              example: '2025-01-15T10:00:00Z'
            expires_at:
              type: string
              format: date-time
              nullable: true
            events:
              type: array
              description: Durable platform events recorded about this session, oldest first. Only present on the single-session GET.
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: evt_abc123
                  event:
                    type: string
                    example: investment_session.completed
                  occurred_at:
                    type: string
                    format: date-time
    PartnerInvestment:
      type: object
      properties:
        id:
          type: string
          example: invt_abc123
        type:
          type: string
          example: investment
        attributes:
          type: object
          properties:
