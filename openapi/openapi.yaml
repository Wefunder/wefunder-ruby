  /investments:
    get:
      tags:
        - Investments
      summary: List or sync investments
      description: |
        The investment records the token may see, served from **published** state
        (docs: *Investments: list, sync, retrieve*). The audience is the union of the companies
        the token's user edits (their founder-visible records) and the user's own investments
        (every applied record of theirs, whatever its status). Filters narrow within that
        audience; they never widen it.

        Three ways to call it:
        - **List** (no `cursor`, no `updated_since`): the current records, tombstones excluded,
          ordered by investment. Page with `meta.next_cursor` while `meta.has_more`; the final
          page's cursor is a sync cursor positioned at the moment the listing started.
        - **Sync by cursor**: only the records whose published state changed since the cursor,
          one record per investment, tombstones included (`visible: false` with `id`, `observed_at`,
          `cursor` and `reason`, and no payload fields). Apply in `cursor` order; always store
          `meta.next_cursor`. Filters are not encoded in the cursor: repeat the same `company_id`,
          `offering_id` or `investor_id` on every sync request, or the sync widens to the whole
          audience.
        - **Sync by time**: `updated_since=<ISO 8601>` is sugar for a cursor at the ledger position
          just before that time (with a 60 s safety margin). The response is a normal sync page,
          so continue with its `meta.next_cursor`.

        Records are eventually consistent (about ten minutes on the common paths); each carries
        `observed_at`. `GET /investments/{id}` returns the same shape derived now. Investor
        identity fields on other investors' records require `read:investors:pii`; a user always
        sees their own. Money is integer minor units plus `amounts.currency`.

        **410 Gone** means the cursor or `updated_since` predates the 90-day retention window:
        list again and replace your dataset. `status` cannot be combined with sync (a record
        leaving the status would never be delivered).
      operationId: listInvestments
      security:
        - bearerAuth:
            - read:investments
      parameters:
        - name: company_id
          in: query
          required: false
          description: Company external id (`co_…`).
          schema:
            type: string
        - name: offering_id
          in: query
          required: false
          description: |
            Offering external id (`ofr_…`). In sync mode an investment that moved to another
            offering is delivered once more as a tombstone under this filter.
          schema:
            type: string
        - name: investor_id
          in: query
          required: false
          description: Investor external id (`usr_…`).
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: List mode only.
          schema:
            type: string
            enum:
              - reserved
              - active
              - executed
              - canceled
              - converted
        - name: updated_since
          in: query
          required: false
          description: ISO 8601 timestamp; switches to sync mode. Mutually exclusive with `cursor` (cursor wins).
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous response's `meta.next_cursor`.
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          description: Records per page, 1–100 (default 25). Sync pages count distinct investments.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: A page of records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentListEnvelope'
              example:
                data:
                  - id: string
                    visible: true
                    status: reserved
                    converted_to: string
                    converted_from: string
                    offering: string
                    company: string
                    investment_type: string
                    offering_type: string
                    group: string
                    applied_at: '2026-01-15T17:30:00Z'
                    amounts:
                      committed_cents: 1
                      investment_size_cents: 1
                      in_escrow_cents: 1
                      raised_cents: 1
                      currency: usd
                    shares: '295'
                    average_share_price: '3.38'
                    needs_whitelisting: true
                    external_username: string
                    message: string
                    investor:
                      id: string
                      deactivated: true
                      via_entity: true
                      name: string
                      legal_name: string
                      email: string
                      address: {}
                      bio: string
                    blockers:
                      - key: string
                        description: string
                    contracts:
                      - name: string
                        override_amount_cents: 1
                        early_bird: true
                    observed_at: '2026-01-15T17:30:00Z'
                    cursor: string
                    reason: changed
                meta:
                  mode: bootstrap
                  has_more: true
                  next_cursor: string
                  page_count: 1
                  published_through: '2026-01-15T17:30:00Z'
        '400':
          description: Malformed cursor or `updated_since`, unknown `status`, or `status` combined with sync.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown `company_id`, `offering_id` or `investor_id`.
        '410':
          description: |
            The cursor or `updated_since` is older than the retention window. List again (no
            cursor) and replace your stored records from the result.
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: |-
            // Auto-paginate the full history lazily:
            for await (const investment of wf.investments.all()) {
              console.log(investment.id);
            }

            // Or grab one page with its meta (next_cursor, etc.):
            const page = await wf.investments.list();
            console.log(page.data?.length, page.meta?.next_cursor);
        - lang: Python
          label: wefunder
          source: |-
            # First sync: no cursor. Persist meta.next_cursor after EVERY page — it is always
            # present, even on the last one — and pass it back next time for only what changed.
            page = wf.investments.list(company_id="co_abc123Example")
            for record in page.data:
                print(record.id, record.visible)
            checkpoint = page.meta.next_cursor

            # Or let the SDK walk every page (stops on has_more=false):
            changed = wf.investments.collect(company_id="co_abc123Example", updated_since="2026-09-01T00:00:00Z")
        - lang: Ruby
          label: wefunder
          source: |-
            # First sync: no cursor. Persist meta.next_cursor after EVERY page — it is always present,
            # even on the last one — and pass it back next time for only what changed.
            page = wf.investments.list(company_id: "co_abc123Example")
            page.data.each { |record| puts "#{record.id} #{record.visible}" }
            checkpoint = page.meta.next_cursor

            # Or let the SDK walk every page (stops on has_more=false):
            changed = wf.investments.collect(company_id: "co_abc123Example", updated_since: Time.utc(2026, 9, 1))
