      description: |
        Retrieves all fundraising campaigns for companies where the authenticated user is a founder.
        This endpoint returns comprehensive campaign data including funding progress, investor counts,
        and campaign status.

        Use this endpoint to:
        - Build custom founder dashboards
        - Monitor fundraising progress across multiple campaigns
        - Generate reports on campaign performance
        - Integrate campaign data into your own tools

        Only founders with the appropriate permissions can access this endpoint. The response includes
        both active and closed campaigns, with detailed metrics for each.
