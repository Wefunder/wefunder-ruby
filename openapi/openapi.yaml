          example: mem_3StSZhDjMHzn8NzEkX0kgEuN
        type:
          type: string
          example: syndicate_member
        attributes:
          type: object
          properties:
            user_id:
              type: integer
              nullable: true
              deprecated: true
              description: Internal integer id. Deprecated — use `user` (`usr_...`) instead.
              example: 123
            user:
              type: string
              nullable: true
