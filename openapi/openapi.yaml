          label: '@wefunder/sdk'
          source: |-
            const { data: company } = await wf.unwrap(wf.raw.getCompany({ path: { id: "co_abc123Example" } }));
            console.log(company?.attributes?.name);
  /users/me:
    get:
      tags:
        - Users
      summary: Get current user profile
      description: |
        Retrieves the profile information for the currently authenticated user. This endpoint returns
        basic user details including name, email, and account status.

        Use this endpoint to:
        - Display user information in your application
        - Verify the identity of the authenticated user
        - Check user account status and permissions

        The response includes the user's unique ID which can be used to reference the user in other API calls.

        Two shapes, depending on the token:

        - **With `read:profile`** (or `write:profile`): the full profile shown in the example.
        - **Any other user token**: only the user's id and type,
          `{"data": {"id": "usr_...", "type": "user"}}`, with no `attributes`. Use it to learn
          whose token you hold; it never includes the email, name, username or city.

        A token with no user (a server-side `client_credentials` key, or an installation acting
        as a company or syndicate) gets `403`. Before this change a user token without
        `read:profile` got `403` here too; code that read `attributes` unconditionally should
        now check for it.
      operationId: getCurrentUser
      security:
        - bearerAuth:
            - read:profile
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
              example:
                data:
                  id: usr_8Kd0aB3xQ9k2vF8mNp1zT5wY
                  type: user
                  attributes:
                    email: user@example.com
                    username: john_doe
                    name: John
                    full_name: John Doe
                    bio: Entrepreneur and investor
                    city: San Francisco
                    country: USA
                    avatar_url: https://example.com/avatar.jpg
                    created_at: '2023-01-15T10:30:00Z'
                    certified_at: '2023-02-01T14:20:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: |-
            const me = await wf.users.me();
            console.log("Logged in as", me.id);
        - lang: Python
          label: wefunder
          source: |-
            me = wf.users.me()
            print(me.id, me.attributes.name)
        - lang: Ruby
          label: wefunder
          source: |-
            me = wf.users.me
            puts "#{me.id} #{me.attributes.name}"
  /users/me/companies:
    get:
      tags:
        - Users
      summary: List the companies you edit
      description: |
        The companies the authenticated user is a founder or team member of — precisely the
        companies the founder-scoped endpoints under `/companies/{company_id}/...` (dashboard,
        investors, fundraises) will accept. Anyone else's company returns 403 there, so call this
        first to learn which `co_` ids you hold. Not paginated.

        `raising` is true when the company has a round currently accepting investments or
        reservations. `roles` are the user's roles on the company (`founder`, `employee`, ...).
      operationId: listMyCompanies
      security:
        - bearerAuth:
            - read:companies
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyCompanyListEnvelope'
              example:
                data:
                  - id: co_8Kd0aB3xQ9k2vF8mNp1zT5wY
                    type: company
                    attributes:
                      name: Acme Robotics
                      tagline: string
                      url: https://wefunder.com/acme
                      roles:
                        - founder
                      raising: true
                meta:
                  count: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: |-
            const companies = await wf.unwrap(wf.raw.listMyCompanies());
