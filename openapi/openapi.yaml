    Offering:
      type: object
      description: |
        A public offering (a fundraise), addressed by its id (`ofr_...`). Returned by the
        Explore endpoints. Monetary fields are USD decimal strings — parse them as decimals, not
        floats.
      properties:
        id:
          type: string
          description: The offering's stable id.
          example: ofr_yw3OhusvpfJP4Pk3wRYV1F2R
        type:
          type: string
          example: offering
        attributes:
          type: object
          properties:
            company_name:
              type: string
              example: ZeroBorder Self-Banking Centers
            tagline:
              type: string
              nullable: true
              example: Example tagline
            url:
              type: string
              description: The company's Wefunder profile URL.
              example: https://wefunder.com/zeroborder
            card_image_url:
              type: string
              nullable: true
              description: Absolute URL of the explore card image, or null if the company has none.
              example: https://uploads.wefunder.com/uploads/company/custom_card_photo/189517/large_card.jpg
            logo_url:
              type: string
              nullable: true
              description: Absolute URL of the company logo, or null if the company has none.
              example: https://uploads.wefunder.com/uploads/company/logo/189517/large_logo.png
            exemption:
              $ref: '#/components/schemas/Exemption'
            security:
              oneOf:
                - $ref: '#/components/schemas/Security'
              nullable: true
              description: |
                What the offering issues, as a discriminated union on `type` (see `Security`).
                Null for a Testing-the-Waters round, which has no final terms yet — see
                `intended_security` for what it plans to issue.
            intended_security:
              type: object
              nullable: true
              description: |
                Testing-the-Waters rounds only: the kind of security the company says it intends to
                issue when the round opens, with no terms (none are final). Null for a live round,
                and for a TTW round whose terms are still to be decided.
              properties:
                type:
                  type: string
                  enum:
                    - safe
                    - equity
                    - convertible_note
                    - revenue_share
                    - debt
                    - fund
                label:
                  type: string
                  example: SAFE
            industries:
              type: array
              description: |
                The company's curated industry tags (the ones the site's explore page filters by),
                as `{ type, label }`. Empty when none are set. Filterable via `industry`.
              items:
                $ref: '#/components/schemas/TagRef'
            business_models:
              type: array
              description: The company's curated business-model tags, as `{ type, label }`. Filterable via `business_model`.
              items:
                $ref: '#/components/schemas/TagRef'
            status:
              type: string
              enum:
                - upcoming
                - open
                - closed
                - canceled
              description: |
                Where the round is in its life. `open` accepts investments (or reservations, for
                a Testing-the-Waters round); `closed` finished raising; `upcoming` is not yet
                accepting (insiders only); `canceled` was aborted. How close an open round is
                to closing is `closes_at`; whether it is over target is `amount_raised` vs
                `funding_target`.
              example: open
            testing_the_waters:
              type: boolean
              description: |
                True for Testing-the-Waters rounds, which collect non-binding **reservations**, not
                investments. Use "reserve"/"reservation" copy for these, "invest"/"investment" otherwise.
              example: false
            funding_target:
              type: string
              nullable: true
              description: Funding target in USD, as a decimal string.
              example: '1000000'
            max_funding_target:
              type: string
              nullable: true
              description: |
                The most this round may raise, in USD as a decimal string (the same denomination as
                `funding_target`). For a Reg CF round, the maximum offering amount on its Form C (the
                largest funding tier); otherwise the maximum the company set for the round. Null when
                neither exists. Raising past `funding_target` up to this amount is normal.
              example: '1235000'
            min_investment:
              type: string
              nullable: true
              description: Minimum investment in USD, as a decimal string.
              example: '100'
            amount_raised:
              type: string
              nullable: true
              description: |
                Amount raised so far **by this offering** in USD, as a decimal string (hellbanned
                investors excluded). Not the company's lifetime total, and not the combined figure
                the company's Wefunder page shows when a Reg D round runs alongside — see `warnings`.
              example: '642300'
            investor_count:
              type: integer
              nullable: true
              description: Distinct investor count for this offering (hellbanned investors excluded).
              example: 1203
            started_at:
              type: string
              format: date-time
              nullable: true
              example: '2025-03-01T12:00:00Z'
            closes_at:
              type: string
              format: date-time
              nullable: true
              description: When an open round is scheduled to stop accepting investments. Null when no date is set or the round is not open. A round can remain open past this date until it is actually closed, so use `status`, not this date against the clock, to decide whether it accepts investments.
              example: '2025-04-30T03:59:59Z'
            closed_at:
              type: string
              format: date-time
              nullable: true
              description: When the round finished raising. Null while the round is upcoming or open (the scheduled close is `closes_at`); set only once `status` is `closed`.
              example: '2025-03-01T12:00:00Z'
            form_c_url:
              type: string
              nullable: true
              description: |
                The round's latest accepted Form C (or Form C/A amendment) on SEC EDGAR, a public sec.gov
                URL. Reg CF rounds only; null until the Form C is filed and for every other exemption.
                For the round a company page shows, the same filing is `filing.sec_filing_url` in
                `GET /companies/{id}/disclosures`.
              example: https://www.sec.gov/Archives/edgar/data/1834121/000167025425000123/0001670254-25-000123-index.htm
            spv_legal_name:
              type: string
              nullable: true
              description: |
                The legal name of the Wefunder SPV (a series LLC that co-issues the round) that investors
                hold through, e.g. "WF Acme 2025, a series of Wefunder SPV, LLC". Null when investors hold
                the security directly.
              example: WF ZeroBorder 2025, a series of Wefunder SPV, LLC
            publicly_visible:
              type: boolean
              description: |
                **Logged-in view only** (`read:explore`). `false` when a logged-out visitor could
                not see this offering — it is in the response only because of who the authorizing
                user is (accredited, invited, Vault/syndicate member). Absent in the public view.
              example: true
            invested:
              type: boolean
              description: |
                **Logged-in view only** (`read:explore`). Whether the authorizing user has an
                active investment in this offering. Absent in the public view.
              example: false
            followed:
              type: boolean
              description: |
                **Logged-in view only** (`read:explore`). Whether the authorizing user follows this
                company on wefunder.com (their watchlist). Absent in the public view.
              example: false
        company:
          type: string
          nullable: true
          description: The parent company's id (`co_...`). Resolve it with `GET /companies/{id}`.
          example: co_8Kd0aB3xQ9k2vF8mNp1zT5wY
        warnings:
          type: array
          description: |
            Context for reading this offering's numbers correctly. Empty for most offerings.
            `concurrent_rounds`: the company has other open rounds (e.g. a Reg D round alongside
            this one), so the company's Wefunder page shows a combined total larger than
            `amount_raised`. `prior_rounds`: the company completed earlier rounds on Wefunder, so
            `amount_raised` is not its lifetime total. Not part of the `etag`.
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                  - concurrent_rounds
                  - prior_rounds
                example: prior_rounds
              message:
                type: string
                example: This company completed 2 earlier rounds on Wefunder. amount_raised and investor_count cover this offering only, not the company's lifetime total.
        etag:
          type: string
          description: |
            Content digest of this offering's public payload (`attributes`), for client-side change
            detection when polling. `warnings` are not included.
          example: a1b2c3d4e5f6
    CompanySearchResult:
      type: object
      description: One company from the site search bar (GET /companies/search).
      properties:
        id:
          type: string
          description: The company's id (`co_...`) for `GET /companies/{id}`.
          example: co_8Kd0aB3xQ9k2vF8mNp1zT5wY
        type:
          type: string
          enum:
            - company
        attributes:
          type: object
          properties:
            name:
              type: string
              nullable: true
              example: Acme Robotics
            tagline:
              type: string
              nullable: true
            url:
              type: string
              nullable: true
              description: The company's Wefunder page.
              example: https://wefunder.com/acme
            logo_url:
              type: string
              nullable: true
            raising:
              type: boolean
              description: |
                True when the company is raising now (the site's "Raising Now" badge). False means the
                site shows its "Funded" badge, which it also shows for companies with no live round
                (including ones whose last round was aborted); it is not a statement that a raise closed
                successfully.
            profile_available:
              type: boolean
              description: |
                Whether `GET /companies/{id}` will serve this company to this viewer. Since the company
                page serves every publicly listed profile, this is false only for an index hit whose
                live row no longer clears the site's bar (or an accredited-only company seen without
                accreditation). Link to `url` when false.
    CompanySearchResultListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanySearchResult'
        meta:
          type: object
          properties:
            query:
              type: string
            count:
              type: integer
    CompanyDisclosuresEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CompanyDisclosures'
    CompanyDisclosures:
      type: object
      description: The company's public Form C disclosures (the site's Details tab), one section per key. A section is null when the company hides it on the site.
      properties:
        id:
          type: string
          description: The company's id (`co_...`).
        type:
          type: string
          enum:
            - company_disclosures
        attributes:
          type: object
          properties:
            offering_id:
              type: string
              description: The round whose Form C this is (`ofr_...`).
            currency:
              type: string
              description: 'ISO 4217 code, upper-case, of the round''s own figures: `use_of_funds`, `prior_offerings`, `outstanding_notes`, `outstanding_debts` and `related_parties`. The round''s currency — `USD` for a Reg CF round, `EUR` for an ECSP round. The financial statements, `ratios.revenue_per_employee` and `current_position` are in `financials_currency` instead.'
              example: USD
            financials_currency:
              type: string
              description: ISO 4217 code of the financial statements AND the founder's current-position figures (cash on hand, average monthly revenue, cost of goods, expenses) and `ratios.revenue_per_employee`. Falls back to `currency`. On the disclosures editor these fields share one denomination, which is this one. ISO 4217 code, upper-case, of the Form C `financial_statements` and of `ratios.revenue_per_employee`. The currency the issuer declared for its statements; equals `currency` unless the issuer declared another (a EUR round can file DKK, RON, GBP or USD statements).
              example: USD
            filing:
              type: object
              properties:
                exemption:
                  $ref: '#/components/schemas/Exemption'
                sec_filing_url:
                  type: string
                  nullable: true
                  description: The filing on sec.gov, when filed.
                filed:
                  type: boolean
                statement_date:
                  type: string
                  format: date
                  nullable: true
                  description: The date the financial statements are as of.
                fiscal_year_end:
                  type: string
                  nullable: true
                  description: '`--MM-DD` (ISO 8601 recurring date), e.g. `--12-31`.'
            business:
              type: object
              properties:
                legal_name:
                  type: string
                  nullable: true
                legal_form:
                  type: string
                  nullable: true
                jurisdiction:
                  type: string
                  nullable: true
                incorporated_on:
                  type: string
                  format: date
                  nullable: true
                employees:
                  type: integer
                  nullable: true
            financial_statements:
              type: object
              description: One column per fiscal year on file; a year with no figures is omitted.
              properties:
                most_recent:
                  $ref: '#/components/schemas/FiscalYearFinancials'
                prior:
                  $ref: '#/components/schemas/FiscalYearFinancials'
                prior_prior:
                  $ref: '#/components/schemas/FiscalYearFinancials'
            ratios:
              type: object
              nullable: true
              description: The page's at-a-glance ratios for the most recent fiscal year, percentages as decimal strings; null where the page shows N/A, or the whole block null when hidden for this company.
              properties:
                net_margin_percent:
                  type: string
                  nullable: true
                  description: Net income / revenue × 100.
                gross_margin_percent:
                  type: string
                  nullable: true
                  description: (Revenue − cost of goods sold) / revenue × 100.
                return_on_assets_percent:
                  type: string
                  nullable: true
                  description: Net income / total assets × 100.
                liabilities_to_assets_percent:
                  type: string
                  nullable: true
                  description: (Current + non-current liabilities) / total assets × 100. Liabilities, not debt — see `current_liabilities`.
                debt_to_assets_percent:
                  type: string
                  nullable: true
                  deprecated: true
                  description: Deprecated alias of `liabilities_to_assets_percent` (same value). Will be removed in a future dated version.
                cash_to_assets_percent:
                  type: string
                  nullable: true
                  description: Cash / total assets × 100.
                revenue_per_employee:
                  type: string
                  nullable: true
                  description: Decimal string in `financials_currency`.
            current_position:
              type: object
              description: The founder's own disclosure of where the company stands today, each field when supplied.
              properties:
                currency:
                  type: string
                  description: ISO 4217 code every amount in this object is denominated in. Equals the top-level `financials_currency` (the currency the founder declared for the financial statements; the same field feeds these figures on the disclosures editor).
                  example: DKK
                cash_on_hand:
                  type: string
                  nullable: true
                  description: Decimal string in `financials_currency`.
                cash_on_hand_as_of:
                  type: string
                  format: date
                  nullable: true
                average_monthly_revenue:
                  type: string
                  nullable: true
                  description: Decimal string in `financials_currency`.
                average_monthly_cost_of_goods:
                  type: string
                  nullable: true
                  description: Decimal string in `financials_currency`.
                average_monthly_expenses:
                  type: string
                  nullable: true
                  description: Decimal string in `financials_currency`.
                average_monthly_burn:
                  type: string
                  nullable: true
                  description: Decimal string in `financials_currency`.
            financial_condition:
              type: string
              nullable: true
              description: The issuer's financial-condition narrative, plain text.
            financial_statement_documents:
              type: array
              items:
                $ref: '#/components/schemas/DisclosureDocument'
            investment_documents:
              type: array
              description: The contracts an investor signs (the page's "Investment Terms").
              items:
                $ref: '#/components/schemas/DisclosureDocument'
            risks:
              type: array
              description: The issuer's risk factors, in the page's order, plain text.
              items:
                type: string
            use_of_funds:
              type: array
              nullable: true
              description: How the company says it will use the money at each amount raised.
              items:
                type: object
                properties:
                  if_raised:
                    type: string
                    nullable: true
                    description: Decimal string in `currency`.
                  plan:
                    type: string
                    nullable: true
            directors:
              type: array
              nullable: true
              items:
                $ref: '#/components/schemas/DisclosurePerson'
            officers:
              type: array
              nullable: true
              items:
                $ref: '#/components/schemas/DisclosurePerson'
            voting_power:
              type: array
              nullable: true
              description: Holders of 20% or more of voting power, as disclosed.
              items:
                type: object
                properties:
                  name:
                    type: string
                    nullable: true
                  holding:
                    type: string
                    nullable: true
                    description: Number and class of securities held, as disclosed.
                  voting_power_percent:
                    type: string
                    nullable: true
            capital_structure:
              type: array
              nullable: true
              items:
                type: object
                properties:
                  class_of_security:
                    type: string
                    nullable: true
                  authorized:
                    type: string
                    nullable: true
                  outstanding:
                    type: string
                    nullable: true
                  voting_rights:
                    type: string
                    nullable: true
                  other_rights:
                    type: string
                    nullable: true
            prior_offerings:
              type: array
              nullable: true
              description: Exempt offerings in the prior three years, as disclosed.
              items:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                    nullable: true
                  exemption:
                    type: string
                    nullable: true
                  security_type:
                    type: string
                    nullable: true
                  amount_sold:
                    type: string
                    nullable: true
                  use_of_proceeds:
                    type: string
                    nullable: true
                  offering_id:
                    type: string
                    nullable: true
                    description: The Wefunder offering (`ofr_...`) when the prior offering ran here.
            outstanding_notes:
              type: array
              nullable: true
              items:
                type: object
                properties:
                  amount:
                    type: string
                    nullable: true
                  outstanding_principal:
                    type: string
                    nullable: true
                  valuation_cap:
                    type: string
                    nullable: true
                  uncapped:
                    type: boolean
                  interest_rate_percent:
                    type: string
                    nullable: true
                  discount_percent:
                    type: string
                    nullable: true
                  maturity_date:
                    type: string
                    format: date
                    nullable: true
                  description:
                    type: string
                    nullable: true
            outstanding_debts:
              type: object
              nullable: true
              properties:
                note:
                  type: string
                  nullable: true
                  description: A company-specific note the site shows instead of the table, when set.
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      original_amount:
                        type: string
                        nullable: true
                      outstanding_principal:
                        type: string
                        nullable: true
                      current_with_payments:
                        type: boolean
                        nullable: true
                      maturity_date:
                        type: string
                        format: date
                        nullable: true
                      description:
                        type: string
                        nullable: true
            related_parties:
              type: object
              nullable: true
              properties:
                description:
                  type: string
                  nullable: true
                parties:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        nullable: true
                      relationship:
                        type: string
                        nullable: true
                      amount:
                        type: string
                        nullable: true
                      date:
                        type: string
                        format: date
                        nullable: true
                      outstanding_principal:
                        type: string
                        nullable: true
                      description:
                        type: string
                        nullable: true
    FiscalYearFinancials:
      type: object
      description: One fiscal year's figures from the Form C, decimal strings in the payload's `financials_currency` (null where not reported).
      properties:
        total_assets:
          type: string
          nullable: true
        cash_and_equivalents:
          type: string
          nullable: true
        accounts_receivable:
          type: string
          nullable: true
        current_liabilities:
          type: string
          nullable: true
          description: Total current liabilities as filed on the Form C balance sheet — including SAFE and convertible-note liabilities, accrued expenses and deferred revenue, not only borrowed money. For borrowings see `outstanding_notes` and `outstanding_debts`, which itemize each instrument with its principal.
        non_current_liabilities:
          type: string
          nullable: true
          description: Total non-current liabilities as filed on the Form C balance sheet. Same caveat as `current_liabilities`.
        short_term_debt:
          type: string
          nullable: true
          deprecated: true
          description: 'Deprecated alias of `current_liabilities` (same value): the figure is total current liabilities, not short-term debt. Will be removed in a future dated version.'
        long_term_debt:
          type: string
          nullable: true
          deprecated: true
          description: 'Deprecated alias of `non_current_liabilities` (same value): the figure is total non-current liabilities, not long-term debt. Will be removed in a future dated version.'
        revenue:
          type: string
          nullable: true
        cost_of_goods_sold:
          type: string
          nullable: true
        taxes_paid:
          type: string
          nullable: true
        net_income:
          type: string
          nullable: true
    DisclosureDocument:
      type: object
      properties:
        name:
          type: string
          nullable: true
        url:
          type: string
    DisclosurePerson:
      type: object
      properties:
        name:
          type: string
          nullable: true
        titles:
          type: string
          nullable: true
        since:
          type: integer
          nullable: true
          description: Year joined.
        director:
          type: boolean
        officer:
          type: boolean
    CompanyUpdate:
      type: object
      description: One post from a company's Posts tab. Plain text, never HTML.
      properties:
        id:
          type: string
          nullable: true
          description: The post's public id (its share token); pass as `update_id` for the full text.
        type:
          type: string
          enum:
            - company_update
        attributes:
          type: object
          properties:
            kind:
              type: string
              description: '`update`, `note`, `spotlight`, `bounty`, ...'
            title:
              type: string
              nullable: true
            excerpt:
              type: string
              nullable: true
              description: The first ~280 characters, plain text.
            content:
              type: string
              nullable: true
              description: Full plain text. Present on the single-post endpoint; null in lists.
            published_at:
              type: string
              format: date-time
              nullable: true
            pinned:
              type: boolean
            visibility:
              type: string
              nullable: true
              enum:
                - public
                - investors
                - community
                - founders
                - private
                - null
              description: Who the site shows the post to. You only ever receive posts you may see.
            author:
              type: object
              nullable: true
              properties:
                name:
                  type: string
                  nullable: true
            comments_count:
              type: integer
            likes_count:
              type: integer
            url:
              type: string
              nullable: true
              description: The post's page on wefunder.com.
    CompanyUpdateListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyUpdate'
        meta:
          type: object
          properties:
            company:
              type: string
              description: The company's id (`co_...`).
            has_more:
              type: boolean
            page_count:
              type: integer
            next_cursor:
              type: integer
              nullable: true
    CompanyUpdateEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CompanyUpdate'
    CompanyPitchEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CompanyPitch'
    CompanyPitch:
      type: object
      description: The company page's pitch (the Overview tab's story) as ordered blocks, plus the round's perk tiers.
      properties:
        id:
          type: string
          description: The company's id (`co_...`).
        type:
          type: string
          enum:
            - company_pitch
        attributes:
          type: object
          properties:
            offering_id:
              type: string
              nullable: true
              description: The round the page shows this viewer (`ofr_...`), whose perks these are; null when the viewer may see none.
            title:
              type: string
              description: The heading the page puts over the story (the founder's own, or the default).
            url:
              type: string
              nullable: true
              description: The company's page on wefunder.com.
            authored_by:
              type: string
              enum:
                - company
                - wefunder
              description: '`company`: the founder wrote the story. `wefunder`: a Wefunder-prepared deal memo the company did not participate in.'
            disclaimer:
              type: string
              nullable: true
              description: The page's notice on a Wefunder-prepared deal memo; null when the company authored the story.
            story:
              type: object
              description: The story in document order, as the page renders it. Empty `blocks` when the company has no story.
              properties:
                blocks:
                  type: array
                  items:
                    $ref: '#/components/schemas/PitchBlock'
                image_count:
                  type: integer
                video_count:
                  type: integer
                inline_images_omitted:
                  type: integer
                  description: Images the page renders from an inline `data:` URL, which have no fetchable URL and are left out of `blocks`. Almost always 0.
                character_count:
                  type: integer
                  description: Characters of text across paragraph, heading, list, and footnote blocks.
            perks:
              type: object
              nullable: true
              description: The perk tiers the page shows; null when the viewer may see no round.
              properties:
                offering_id:
                  type: string
                  nullable: true
                  description: The round these perks belong to (`ofr_...`) when it is the round the page shows. Null when the sidebar reads a round the viewer cannot resolve yet (a Testing-the-Waters page shows the perks of the round it converts into, which is still being set up).
                currency:
                  type: string
                  description: ISO 4217 code the tier amounts are denominated in, e.g. `USD` or `EUR`.
                described_in_pitch:
                  type: boolean
                  description: Heuristic. True when the tiers are a placeholder ("See investor overview page", or one identical short sentence on every tier) and the real perks are in the story, usually as images.
                tiers:
                  type: array
                  items:
                    $ref: '#/components/schemas/PerkTier'
    PitchBlock:
      type: object
      description: One block of the story. `type` says which of the other keys are present.
      properties:
        type:
          type: string
          enum:
            - heading
            - paragraph
            - list
            - image
            - video
            - footnote
        level:
          type: integer
          description: Heading level 1–6 (`heading` only).
        text:
          type: string
          description: Plain text (`heading`, `paragraph`, and `footnote`). A footnote reference in running text appears as `[n]`.
        number:
          type: integer
          description: The footnote's number, matching its `[n]` reference (`footnote` only).
        ordered:
          type: boolean
          description: Numbered list (`list` only).
        start:
          type: integer
          description: First number of an ordered list that resumes after an image or nested list split it (`list` only, when above 1).
        items:
          type: array
          items:
            type: string
          description: Plain-text list items (`list` only).
        links:
          type: array
          description: The hyperlinks in this block's text, in order, as the page links them (`paragraph`, `heading`, `list`; absent when there are none). Anchor text stays inline in `text` / `items`.
          items:
            type: object
            properties:
              text:
                type: string
                nullable: true
                description: The anchor text.
              url:
                type: string
                description: Absolute URL; site-relative hrefs are resolved against wefunder.com.
        url:
          type: string
          description: Absolute URL of the image or video (`image` and `video`).
        link:
          type: string
          description: Where the page links this image or video to, when it is wrapped in a hyperlink (`image` and `video`; absent otherwise).
        alt:
          type: string
          nullable: true
          description: The image's alt text; almost always null on Wefunder pitches (`image` only).
        filename:
          type: string
          nullable: true
          description: The image file's name, often the only hint at its content, e.g. `Tier_3_Final.png` (`image` only).
        provider:
          type: string
          description: '`youtube`, `vimeo`, `wistia`, `loom`, `upload` (hosted by Wefunder), or `other` (`video` only).'
    PerkTier:
      type: object
      properties:
        qualifying_amount:
          type: string
          description: Investment that unlocks the tier, as a decimal string in `perks.currency`.
        description:
          type: string
          nullable: true
          description: Plain text, the founder's own words.
    CompanyQuestionPerson:
      type: object
      properties:
        id:
          type: string
          nullable: true
          description: The person's Wefunder id (`usr_...`).
          example: usr_7Hk2mPq9rT4vX1yB3nC5dF8g
        name:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
          description: 'The label the tab shows: `founder`, `employee`, `wefunder team`, or the asker''s own disclosure (e.g. `investor`).'
        team:
          type: boolean
          description: True when the person is on the company's team (a founder or employee).
    CompanyQuestion:
      type: object
      description: One question from a company's Ask tab with its answers. Plain text.
      properties:
        id:
          type: string
          description: The question's id (`cmt_...`).
          example: cmt_m2JkUx7E3aBFscGMKDdJ9saR
        type:
          type: string
          enum:
            - company_question
        attributes:
          type: object
          properties:
            question:
              type: string
              nullable: true
            asked_at:
              type: string
              format: date-time
              nullable: true
            asked_by:
              $ref: '#/components/schemas/CompanyQuestionPerson'
            likes_count:
              type: integer
            highlighted:
              type: boolean
              description: The team highlighted this question on the tab.
            answered_by_team:
              type: boolean
            match:
              type: string
              enum:
                - question
                - answer
                - null
              nullable: true
              description: In a search (`q`), whether the question's own text or one of its answers matched. Null otherwise.
            answers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The answer's id (`cmt_...`).
                  answer:
                    type: string
                    nullable: true
                  answered_at:
                    type: string
                    format: date-time
                    nullable: true
                  answered_by:
                    $ref: '#/components/schemas/CompanyQuestionPerson'
                  likes_count:
                    type: integer
            url:
              type: string
              nullable: true
              description: The company's Ask tab on wefunder.com.
    CompanyQuestionListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyQuestion'
        meta:
          type: object
          properties:
            company:
              type: string
            sort:
              type: string
              description: The sort applied; `search` when `q` was given (results are ranked by match).
            q:
              type: string
              nullable: true
            unanswered_by_team:
              type: boolean
            past_raises:
              type: boolean
            questions_since:
              type: string
              format: date
              nullable: true
              description: The current raise's opening date when `past_raises` is false; null otherwise.
            total:
              type: integer
              description: Questions matching, across all pages.
            has_more:
              type: boolean
            page_count:
              type: integer
            next_cursor:
              type: integer
              nullable: true
    CompanyEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Company'
    Company:
      type: object
      description: The company page as structured data. Monetary fields are USD decimal strings.
      properties:
        id:
          type: string
          description: The company's id (`co_...`).
          example: co_8Kd0aB3xQ9k2vF8mNp1zT5wY
        type:
          type: string
          example: company
        attributes:
          type: object
          properties:
            name:
              type: string
            tagline:
              type: string
              nullable: true
            url:
              type: string
              nullable: true
              description: The company's Wefunder page.
            logo_url:
              type: string
              nullable: true
            card_image_url:
              type: string
              nullable: true
            location:
              type: object
              properties:
                city:
                  type: string
                  nullable: true
                state:
                  type: string
                  nullable: true
                country:
                  type: string
                  nullable: true
            legal_name:
              type: string
              nullable: true
              description: The company's legal name, as the company entered it. The name on a filed Form C is `business.legal_name` in `/disclosures`.
              example: Acme Robotics, Inc.
            legal_form:
              type: string
              nullable: true
              description: |
                The company's legal form as the company entered it, free text and not normalized (e.g.
                "Corporation", "Limited Liability Company", "llc"). The form on a filed Form C is
                `business.legal_form` in `/disclosures`. The EIN is deliberately not served.
              example: Corporation
            website_url:
              type: string
              nullable: true
              description: The company's website, as an absolute URL. Null when none is set or the stored value is not a usable link.
              example: https://acme.example
            twitter_url:
              type: string
              nullable: true
              description: The company's X (Twitter) profile, as an absolute URL (a stored handle is expanded). Null when none is set.
              example: https://twitter.com/acme
            linkedin_url:
              type: string
              nullable: true
              description: The company's LinkedIn page, as an absolute URL. Null when none is set.
              example: https://linkedin.com/company/acme-robotics
            facebook_url:
              type: string
              nullable: true
              description: The company's Facebook page, as an absolute URL. Null when none is set.
              example: https://facebook.com/acme
            instagram_url:
              type: string
              nullable: true
              description: The company's Instagram profile, as an absolute URL. Null when none is set.
              example: https://instagram.com/acme
            promotion_opt_in:
              type: boolean
              description: |
                The company's answer to "Who should be able to see your campaign?" on wefunder.com: true
                for "as public as possible" (eligible for the Explore page and Wefunder's marketing),
                false for "as private as possible". False does not hide the company or its rounds —
                anything this API returns is visible to the caller — but the company has asked not to be
                promoted, so an app that redistributes listings should respect it.
              example: true
            raising:
              type: boolean
              description: True when the round the page shows this viewer is live (accepting investments or reservations). False for a funded company, or one with no round the viewer may see.
            current_raise:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/CurrentRaise'
              description: The live round the page shows, or null when `raising` is false. A funded company still has its history in `wefunder_rounds` and the page's ticker in `totals`.
            past_rounds:
              type: array
              description: The prior rounds the company page's ticker folds in (its own accounting; see `totals.profile_*`). Not the company's full Wefunder history — that is `wefunder_rounds`.
              items:
                $ref: '#/components/schemas/PastRound'
            wefunder_rounds:
              type: array
              description: Every round this company has run on Wefunder that the viewer may see, live and closed, newest first, each with its own metric. Independent of what the page's ticker chooses to include.
              items:
                $ref: '#/components/schemas/WefunderRound'
            totals:
              $ref: '#/components/schemas/CompanyTotals'
    CurrentRaise:
      type: object
      description: The round the page shows this viewer, with its linked legs combined.
      properties:
        offering_id:
          type: string
          description: The displayed offering (`ofr_...`); fetch it with `/offerings/{id}`.
        offering_ids:
          type: array
          description: Every live leg combined into `amount_raised` that the viewer may see (e.g. a Reg CF round and its Reg D round).
          items:
            type: string
        testing_the_waters:
          type: boolean
          description: True when the current raise collects non-binding reservations, not investments.
        amount_raised:
          type: string
          nullable: true
          description: Raised across the combined legs, on Wefunder, USD decimal string.
        funding_target:
          type: string
          nullable: true
        investor_count:
          type: integer
          nullable: true
        oversubscribed:
          type: boolean
        closes_at:
          type: string
          format: date-time
          nullable: true
    PastRound:
      type: object
      properties:
        offering_id:
          type: string
          nullable: true
          description: The Wefunder offering (`ofr_...`) when `source` is `wefunder`; null for a reported round.
        source:
          type: string
          enum:
            - wefunder
            - reported
          description: '`wefunder`: observed on this platform. `reported`: disclosed by the founder as raised off-platform (verified per the page''s rules, but not observed here).'
        exemption:
          $ref: '#/components/schemas/Exemption'
        amount_raised:
          type: string
          nullable: true
        investor_count:
          type: integer
          nullable: true
        opened_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
    WefunderRound:
      type: object
      properties:
        offering_id:
          type: string
          description: The round's offering id (`ofr_...`).
        current:
          type: boolean
          description: True for the displayed round and any other live round.
        status:
          type: string
          enum:
            - open
            - closed
        exemption:
          oneOf:
            - $ref: '#/components/schemas/Exemption'
          nullable: true
        security:
          oneOf:
            - $ref: '#/components/schemas/Security'
          nullable: true
        amount_raised:
          type: string
          nullable: true
          description: This round's own soft-confirmed amount, USD decimal string.
        investor_count:
          type: integer
          nullable: true
        opened_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: When the round finished raising. Null while the round is open; a live round's scheduled close is `current_raise.closes_at`.
    CompanyTotals:
      type: object
      properties:
        raised_on_wefunder_all_time:
          type: string
          nullable: true
          description: Sum of `wefunder_rounds[].amount_raised` — everything this company has raised on Wefunder that the viewer may see. The lifetime figure.
        profile_total_raised:
          type: string
          nullable: true
          description: The number on the company page's ticker bar — the current raise plus the past rounds the page folds in (which may include founder-reported off-platform rounds and exclude older Wefunder rounds).
        profile_reported_off_platform:
          type: string
          nullable: true
          description: The founder-reported off-platform portion of `profile_total_raised`.
        profile_includes_past_rounds:
          type: boolean
          nullable: true
          description: Whether the page's ticker currently folds past rounds into its total. Null when the viewer may see no round (no ticker to read).
    Exemption:
      type: object
      description: The offering's SEC exemption, in market vocabulary.
      properties:
        family:
          type: string
          enum:
            - reg_cf
            - reg_d
            - reg_a
            - reg_s
            - ecsp
            - other
          description: |
            `other` appears only on a company's past rounds, for a reported round under an
            exemption outside this list (e.g. Section 4(a)(2)).
            `reg_cf` — Regulation Crowdfunding: open to all investors, with per-investor annual
            limits set by the SEC; amounts and investor counts are public. `reg_d` — Regulation D
            private placement: `506c` is open to verified accredited investors only and may be
            advertised; `506b` is by invitation and never publicly listed. `reg_a`, `reg_s` and
            `ecsp` exist in the data but are not filterable on `/explore`.
          example: reg_cf
        subtype:
          type: string
          nullable: true
          description: Sub-type/flavor — `506b` or `506c` for the `reg_d` family, otherwise null.
          example: null
        label:
          type: string
          description: Human-readable label in normal market language.
          example: Reg CF
    TagRef:
      type: object
      description: A curated company tag — a machine value plus the label the site shows.
      required:
        - type
        - label
      properties:
        type:
          type: string
          example: robotics
        label:
          type: string
          example: Robotics
    SecuritySummary:
      type: object
      description: |
        The kind of security without its terms — the `type` / `label` pair shared by every
        `Security` variant. Used where the terms live elsewhere (portfolio positions) or are
        not final (a Testing-the-Waters round's `intended_security`).
      required:
        - type
        - label
      properties:
        type:
          type: string
          enum:
            - safe
            - equity
            - convertible_note
            - revenue_share
            - debt
            - fund
            - other
          example: safe
        label:
          type: string
          example: SAFE
    Security:
      description: |
        What an offering issues. A discriminated union on `type`: every variant carries the same
        `type` / `label` pair and a `terms` object whose fields are fixed per type. Money and rates
        are USD decimal strings. Internal instrument codes never appear here.
      oneOf:
        - $ref: '#/components/schemas/SafeSecurity'
        - $ref: '#/components/schemas/EquitySecurity'
        - $ref: '#/components/schemas/ConvertibleNoteSecurity'
        - $ref: '#/components/schemas/RevenueShareSecurity'
        - $ref: '#/components/schemas/DebtSecurity'
        - $ref: '#/components/schemas/FundSecurity'
        - $ref: '#/components/schemas/OtherSecurity'
      discriminator:
        propertyName: type
        mapping:
          safe: '#/components/schemas/SafeSecurity'
          equity: '#/components/schemas/EquitySecurity'
          convertible_note: '#/components/schemas/ConvertibleNoteSecurity'
          revenue_share: '#/components/schemas/RevenueShareSecurity'
          debt: '#/components/schemas/DebtSecurity'
          fund: '#/components/schemas/FundSecurity'
          other: '#/components/schemas/OtherSecurity'
    SafeSecurity:
      type: object
      properties:
        type:
          type: string
          enum:
            - safe
        label:
          type: string
          example: SAFE
        terms:
          type: object
          properties:
            valuation_cap:
              type: string
              nullable: true
              description: Post-money valuation cap in USD, decimal string; null for an uncapped SAFE (never "0").
              example: '10000000'
            uncapped:
              type: boolean
              description: True when the SAFE has no valuation cap, as the deal page labels it. Always the inverse of `valuation_cap` being present.
            discount_percent:
              type: string
              nullable: true
              description: Discount to the next priced round, as a percentage; null when none.
              example: '20'
            most_favored_nation:
              type: boolean
              description: Whether the SAFE carries an MFN clause.
            pro_rata:
              type: boolean
              description: Whether investors receive pro-rata rights in the next round.
    EquitySecurity:
      type: object
      properties:
        type:
          type: string
          enum:
            - equity
        label:
          type: string
          example: Equity
        terms:
          type: object
          properties:
            share_price:
              type: string
              nullable: true
              description: Price per share in USD, decimal string.
              example: '2.5'
            pre_money_valuation:
              type: string
              nullable: true
              description: Pre-money valuation in USD, decimal string.
              example: '15000000'
            share_class:
              type: string
              nullable: true
              enum:
                - preferred
                - common
                - null
              example: preferred
    ConvertibleNoteSecurity:
      type: object
      properties:
        type:
          type: string
          enum:
            - convertible_note
        label:
          type: string
          example: Convertible Note
        terms:
          type: object
          properties:
            valuation_cap:
              type: string
              nullable: true
              description: Valuation cap in USD, decimal string; null for an uncapped note (never "0").
              example: '5000000'
            uncapped:
              type: boolean
              description: True when the note has no valuation cap, as the deal page labels it.
            discount_percent:
              type: string
              nullable: true
              example: '20'
            interest_rate_percent:
              type: string
              nullable: true
              description: Annual interest, as a percentage.
              example: '6'
            maturity_months:
              type: integer
              nullable: true
              example: 24
            most_favored_nation:
              type: boolean
    RevenueShareSecurity:
      type: object
      properties:
        type:
          type: string
          enum:
            - revenue_share
        label:
          type: string
          example: Revenue Share
        terms:
          type: object
          properties:
            revenue_share_percent:
              type: string
              nullable: true
              description: Share of revenue paid to investors each period, as a percentage.
              example: '10'
            repayment_cap_multiple:
              type: string
              nullable: true
              description: Payments stop once investors have received this multiple of their investment.
              example: '1.5'
            payment_period:
              type: string
              nullable: true
              example: quarterly
            revenue_basis:
              type: string
              nullable: true
              enum:
                - gross
                - net
                - null
            secured:
              type: boolean
            guarantor:
              type: string
              nullable: true
    DebtSecurity:
      type: object
      properties:
        type:
          type: string
          enum:
            - debt
        label:
          type: string
          example: Debt
        terms:
          type: object
          properties:
            interest_rate_percent:
              type: string
              nullable: true
              example: '8'
            maturity_months:
              type: integer
              nullable: true
              example: 36
            first_payment_date:
              type: string
              format: date
              nullable: true
    FundSecurity:
      type: object
      description: An interest in a fund vehicle; the fund's own terms are on its profile, not per-offering.
      properties:
        type:
          type: string
          enum:
            - fund
        label:
          type: string
          example: Fund
        terms:
          type: object
          properties: {}
    OtherSecurity:
      type: object
      description: A security Wefunder does not model in detail; the founder's own name and description for it.
      properties:
        type:
          type: string
          enum:
            - other
        label:
          type: string
          example: Other
        terms:
          type: object
          properties:
            name:
              type: string
              nullable: true
              example: Preferred Membership Units
            description:
              type: string
              nullable: true
            more_info_url:
              type: string
              nullable: true
    User:
      type: object
      properties:
        id:
          type: string
          description: Partner-facing user id (`usr_…`).
          example: usr_8Kd0aB3xQ9k2vF8mNp1zT5wY
        type:
          type: string
          example: user
        attributes:
          type: object
          description: |
            Present only when the token holds `read:profile`. Without it, `GET /users/me`
            returns just `id` and `type`.
          properties:
            email:
              type: string
              example: user@example.com
            username:
              type: string
              example: john_doe
            name:
              type: string
              example: John
            full_name:
              type: string
              example: John Doe
            bio:
              type: string
              nullable: true
              example: Entrepreneur and investor
            city:
              type: string
              nullable: true
              example: San Francisco
            country:
              type: string
              nullable: true
              example: USA
            avatar_url:
              type: string
              nullable: true
              example: https://example.com/avatar.jpg
            created_at:
              type: string
              format: date-time
              example: '2023-01-15T10:30:00Z'
            certified_at:
              type: string
              format: date-time
              nullable: true
              example: '2023-02-01T14:20:00Z'
    Campaign:
      type: object
      properties:
        id:
          type: string
          example: ofr_8Kd0aB3xQ9k2vF8mNp1zT5wY
        type:
          type: string
          example: campaign
        attributes:
          type: object
          properties:
            state:
              type: string
              example: active
            company_id:
              type: integer
              deprecated: true
              description: Internal integer id. Deprecated — use `company` (`co_...`) instead.
              example: 101
            company:
              type: string
              nullable: true
              description: The company's id (`co_...`).
              example: co_8Kd0aB3xQ9k2vF8mNp1zT5wY
            company_name:
              type: string
              example: My Startup Inc.
            company_url:
              type: string
              nullable: true
              example: my-startup-inc
            created_at:
              type: string
              format: date-time
              example: '2023-01-10T09:00:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2023-03-15T14:30:00Z'
            closed_at:
              type: string
              format: date-time
              nullable: true
              example: '2023-06-30T23:59:59Z'
            amount_raised:
              type: number
              format: float
              nullable: true
              example: 25000
            investor_count:
              type: integer
              example: 42
    PaginationMeta:
      type: object
      properties:
        page_count:
          type: integer
          description: Number of records on this page.
          example: 25
        has_more:
          type: boolean
          example: true
        next_cursor:
          oneOf:
            - type: integer
            - type: string
          nullable: true
          description: |
            Opaque cursor — pass back as `cursor` for the next page. An integer id for
            id-paginated lists, an ISO 8601 timestamp for timestamp-paginated ones
            (`/activity`). Absent or null on the last page.
          example: 12345
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            type:
              type: string
              example: unauthorized
            message:
              type: string
              example: Invalid or expired token
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
              description: Unique identifier for this request. Quote it in support tickets.
              example: req_abc123
            remediation:
              type: string
              description: When present, a hint on how to resolve the error.
              example: Obtain a new access token using the OAuth 2.0 flow.
    Syndicate:
      type: object
      description: JSON:API resource representing a syndicate
      properties:
        id:
          type: string
          description: The syndicate's id (`syn_...`).
          example: syn_aB3xQ9k2vF8mNp1zT5wY7Qc4
        type:
          type: string
          example: syndicate
        attributes:
          type: object
          properties:
            name:
              type: string
              example: Acme Syndicate
            slug:
              type: string
              example: acme-syndicate
            tagline:
              type: string
              nullable: true
              description: Short description / tagline for the syndicate
              example: Investing in the future of AI
            description:
              type: string
              nullable: true
              example: Example text
            avatar_url:
              type: string
              nullable: true
              description: Syndicate icon/avatar URL
              example: https://uploads.wefunder.com/uploads/club/icon/42/large_avatar.png
            published:
              type: boolean
              example: true
            launched:
              type: boolean
              example: true
            membership_open:
              type: boolean
              description: Whether the syndicate is accepting new members (nil defaults to true)
              example: true
            syndicate_type:
              type: string
              nullable: true
              description: How the syndicate invests (e.g. `annual_subscription`, `traditional_fund`); null for deal-by-deal syndicates.
            auto_accept_accredited_members:
              type: boolean
              description: Whether accredited applicants are approved automatically.
              example: false
            auto_approve_join_sessions:
              type: boolean
              description: Whether an accredited invitee who accepts a join session is admitted immediately. Read it to pick the consent copy ("Join" vs "Request to join") before minting a join session.
              example: true
            fund_required:
              type: boolean
              description: Whether members must invest through the syndicate's fund.
              example: false
            annual_subscription:
              type: object
              description: Present only when `syndicate_type` is `annual_subscription`.
              properties:
                fund_investment_amount:
                  type: string
                  nullable: true
                deals_per_year:
                  type: integer
                  nullable: true
                amount_per_deal:
                  type: string
                  nullable: true
            traditional_fund:
              type: object
              description: Present only when `syndicate_type` is `traditional_fund`.
              properties:
                require_minimum_investment:
                  type: boolean
                minimum_investment_amount:
                  type: string
                  nullable: true
            member_count:
              type: integer
              example: 47
            deal_count:
              type: integer
              description: Number of live deals (the same set `GET /syndicates/{syndicate_id}/deals` returns)
              example: 3
            primary_fund_company_id:
              type: integer
              nullable: true
              deprecated: true
              description: Internal integer id. Deprecated — use `primary_fund_company` (`co_...`) instead.
              example: 4242
            primary_fund_company:
              type: string
              nullable: true
              description: The primary fund company's id (`co_...`), when the syndicate has one.
              example: co_8Kd0aB3xQ9k2vF8mNp1zT5wY
            created_by_user_id:
              type: integer
              deprecated: true
              description: Internal integer id. Deprecated — use `created_by` (`usr_...`) instead.
              example: 123
            created_by:
              type: string
              nullable: true
              description: The creating user's id (`usr_...`).
              example: usr_8Kd0aB3xQ9k2vF8mNp1zT5wY
            created_at:
              type: string
              format: date-time
              example: '2025-03-01T12:00:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2025-03-01T12:00:00Z'
    SyndicateMember:
      type: object
      description: JSON:API resource representing a syndicate member (ClubRole)
      properties:
        id:
          type: string
          description: The member's id (`mem_...`); pass as member_id to the member endpoints.
          example: mem_3StSZhDjMHzn8NzEkX0kgEuN
        type:
          type: string
          example: syndicate_member
        attributes:
          type: object
          properties:
            user_id:
              type: integer
              nullable: true
              deprecated: true
              description: Internal integer id. Deprecated — use `user` (`usr_...`) instead.
              example: 123
            user:
              type: string
              nullable: true
              description: The member's user id (`usr_...`); null for invitees who haven't signed up.
              example: usr_8Kd0aB3xQ9k2vF8mNp1zT5wY
            user_name:
              type: string
              nullable: true
              example: Jane Smith
            user_email:
              type: string
              nullable: true
              description: |
                **Moderator-only.** User email (or invite_email for pending invitees).
                Requires the requesting user to be a manager/operator of the syndicate.
              example: user@example.com
            role:
              type: string
              example: member
              description: Current role (creator, manager, member, invitee, applicant, exiled, resigned, etc.)
            invite_role:
              type: string
              nullable: true
              description: The role the member was invited as
              example: admin
            syndicate_permission:
              type: string
              enum:
                - full_access
                - operator
              description: Permission level within the syndicate
            title:
              type: string
              nullable: true
              description: Custom title for the member
              example: Example title
            sort_order:
              type: integer
              nullable: true
              description: Display order position
              example: 5
            carry_percentage_override:
              type: integer
              nullable: true
              minimum: 1
              maximum: 100
              example: 20
              description: Override carry percentage for this member
            carry_discount_percentage:
              type: number
              nullable: true
              description: Carry discount granted to this member, in percent.
            management_fee_discount_percentage:
              type: number
              nullable: true
              description: Management fee discount granted to this member, in percent.
            public_on_syndicate_profile:
              type: boolean
              description: Whether the member is listed on the public syndicate page.
              example: true
            interests:
              type: array
              items:
                type: string
              description: Investor interest tags from the user's profile. Empty for invitees.
            stage_preferences:
              type: array
              items:
                type: string
              description: Investment stage preference tags. Empty for invitees.
            looking_for:
              type: array
              items:
                type: string
              description: '''Looking for'' tags from the user''s profile. Empty for invitees.'
            linkedin_url:
              type: string
              nullable: true
            twitter_url:
              type: string
              nullable: true
            website:
              type: string
              nullable: true
            state:
              type: string
              nullable: true
              description: User's state or region. Omitted, with city and country, when the user hides their location.
            avatar_url:
              type: string
              nullable: true
              description: User profile photo URL (null for invitees without a user account)
              example: https://uploads.wefunder.com/uploads/user/avatar/456/large_photo.jpg
            bio:
              type: string
              nullable: true
              description: User bio with fallback chain (bio -> thesis -> about). Null for invitees without a user account.
              example: Example text
            city:
              type: string
              nullable: true
              description: User's city
              example: San Francisco
            country:
              type: string
              nullable: true
              description: User's country
              example: US
            last_activity_at:
              type: string
              format: date-time
              nullable: true
              description: ISO 8601 timestamp of user's last login. Null for invitees without a user account.
              example: '2025-03-01T12:00:00Z'
            profile_url:
              type: string
              nullable: true
              description: Relative path to user's profile (e.g. '/janedoe'). Null for invitees without a user account.
              example: /janedoe
            tags:
              type: array
              items:
                type: string
              description: '''Can help with'' tags from the user''s investor profile. Empty array for invitees.'
              example:
                - Fundraising
                - Product Strategy
            joined_at:
              type: string
              format: date-time
              description: ISO 8601 join date (alias for created_at)
              example: '2025-03-01T12:00:00Z'
            investment_total:
              type: string
              nullable: true
              description: '**Moderator-only.** Total invested in syndicate deals, in whole dollars, as a string.'
              example: '5000'
            deal_count:
              type: integer
              nullable: true
              description: Number of syndicate deals the member has invested in
              example: 2
            accredited:
              type: boolean
              description: |
                **Moderator-only.** Whether the user is an accredited investor.
                Only included when the requesting user is a manager/operator.
              example: true
            legal_name:
              type: string
              nullable: true
              description: |
                **Moderator-only.** Full legal name of the user.
                Only included when the requesting user is a manager/operator.
              example: Example Name
            starred:
              type: boolean
              description: |
                **Moderator-only.** Whether the current moderator has starred this member.
                Only included when the requesting user is a manager/operator.
              example: true
            private_tags:
              type: array
              items:
                type: string
              description: |
                **Moderator-only.** Labels assigned by moderators via ClubMemberLabel.
                Only included when the requesting user is a manager/operator.
              example:
                - VIP
                - Follow up
            created_at:
              type: string
              format: date-time
              example: '2025-03-01T12:00:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2025-03-01T12:00:00Z'
    SyndicateDeal:
      type: object
      description: JSON:API resource representing a syndicate deal (Fundraise)
      properties:
        id:
          type: string
          description: The deal's offering id (`ofr_...`). Same id `get_offering` / `explore_offerings` use.
          example: ofr_yw3OhusvpfJP4Pk3wRYV1F2R
        type:
          type: string
          example: syndicate_deal
        attributes:
          type: object
          properties:
            name:
              type: string
              example: Acme Corp Series A
            status:
              type: string
              enum:
                - upcoming
                - open
                - closed
                - canceled
              description: Where the round is in its life (same values as an offering's `status`).
              example: open
            company_name:
              type: string
              example: Acme Corp
            company_id:
              type: integer
              deprecated: true
              description: Internal integer id. Deprecated — use `company` (`co_...`) instead.
              example: 1234
            company:
              type: string
              nullable: true
              description: The company's id (`co_...`).
              example: co_8Kd0aB3xQ9k2vF8mNp1zT5wY
            company_url:
              type: string
              nullable: true
              description: Company slug/URL path
              example: acme-corp
            company_logo_url:
              type: string
              nullable: true
              description: Company logo URL
              example: https://uploads.wefunder.com/uploads/company/logo/1234/large_logo.png
            amount_raised:
              type: string
              nullable: true
              description: Amount raised in whole dollars, as a string
              example: '230000'
            investor_count:
              type: integer
              description: Count of distinct active investors
              example: 47
            funding_target:
              type: string
              nullable: true
              description: Target funding amount in **cents**, as a string (the one cents field on this object)
              example: '50000000'
            exemption:
              oneOf:
                - $ref: '#/components/schemas/Exemption'
              nullable: true
              description: The SEC exemption the deal is offered under, in market vocabulary.
            security:
              oneOf:
                - $ref: '#/components/schemas/Security'
              nullable: true
              description: What the deal issues, as a discriminated union on `type` (see `Security`).
            min_investment:
              type: string
              nullable: true
              description: Minimum investment in whole dollars, as a string
              example: '100'
            max_investment:
              type: string
              nullable: true
              description: Maximum investment in whole dollars, as a string
              example: '50000'
            description:
              type: string
              nullable: true
              description: Deal funding purpose / description
              example: Example text
            created_at:
              type: string
              format: date-time
              example: '2025-03-01T12:00:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2025-03-01T12:00:00Z'
            closed_at:
              type: string
              format: date-time
              nullable: true
              description: When the deal finished raising. Null while `status` is `upcoming` or `open`.
              example: '2025-03-01T12:00:00Z'
            funding_started_at:
              type: string
              format: date-time
              nullable: true
              description: ISO 8601 timestamp when funding opened
              example: '2025-03-01T12:00:00Z'
    PortfolioCompanyRef:
      type: object
      description: The company behind a portfolio position or holding.
      properties:
        id:
          type: string
          description: The company's id (`co_...`)
          example: co_2bt9eJn6X8C9gnShl63qlzkK
        name:
          type: string
          example: Acme Robotics
        slug:
          type: string
          nullable: true
          example: acme-robotics
        url:
          type: string
          format: uri
          nullable: true
          description: The company's page on wefunder.com, absolute. This is the link target the [attribution rule](/resources/acceptable-use#attribution) asks for wherever you show the position; do not link to the investor's Wefunder portfolio instead. Null when the company no longer has a public page.
          example: https://wefunder.com/acme-robotics
    PortfolioSecurity:
      type: object
      description: |
        One security offering within the position's fundraise, such as an early bird
        tier or the regular terms. Most positions have a single entry. A position has
        several when the round sold multiple tiers, or (investor endpoint) when the
        investor holds the same offering through more than one legal owner. Entries
        do not have ids; each is described by its `terms`, and occasionally a round
        has more than one offering record with identical terms.
      properties:
        security:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SecuritySummary'
          description: |
            What this tier issues, as `{ type, label }` (the terms are in `terms` below).
            May be null on legacy offerings — fall back to the position-level `security`.
        early_bird:
          type: boolean
        terms:
          type: object
          description: 'The offering''s issue terms. A field is null when the term does not apply to the security type, and also when the security has none: an uncapped SAFE or note has a null `note_cap_cents` (with `uncapped: true`), and a security with no discount, including one recorded as zero, has a null `note_discount`.'
          properties:
            share_price:
              type: string
              nullable: true
              description: Issue price per share as a decimal string
              example: '10.0'
            currency:
              type: string
              description: Lower-case ISO 4217 code of `note_cap_cents` and `premoney_valuation_cents`, the currency the founder entered them in. USD when the round's terms are explicitly USD-denominated (checkout prices them in USD then); otherwise a SAFE's cap is in the round's declared financials currency (falling back to the round's), while equity pre-money and a convertible note's valuation are in the round currency. A EUR-funded SAFE can therefore carry a `usd` or `dkk` cap. `share_price` and every other `_cents` field on the position stay in the position's top-level `currency`.
              example: usd
            note_cap_cents:
              type: integer
              nullable: true
              description: The valuation cap of a SAFE or convertible note, in cents of `terms.currency`. Null when the security is uncapped (see `uncapped`) or has no cap.
            uncapped:
              type: boolean
              nullable: true
              description: '`true` when a SAFE or convertible note has no valuation cap, `false` when it has one. Null for securities that never carry a cap (equity, revenue share, debt, fund, other). Same rule as `uncapped` in an offering''s `security.terms`.'
              example: false
            note_discount:
              type: string
              nullable: true
              description: Conversion discount as a decimal string percentage (`"20.0"` is 20%). Null when there is no discount, including a discount recorded as zero, the same as `discount_percent` in an offering's `security.terms`.
              example: '20.0'
            premoney_valuation_cents:
              type: integer
              nullable: true
        cost_basis_cents:
          type: integer
        current_value_cents:
          type: integer
        unrealized_gain_cents:
          type: integer
        realized_gain_cents:
          type: integer
        shares_held:
          type: string
          nullable: true
          description: Decimal string. Null for non-share structures and multiple-of-basis valuations.
        current_share_price:
          type: string
          nullable: true
          description: Decimal string, split-adjusted.
        invested_at:
          type: string
          format: date-time
          nullable: true
        owner:
          type: object
          nullable: true
          description: |
            The legal owner of this stake — `{"kind": "individual"}` for
            personally-held stakes, `{"kind": "entity", "name": "..."}` for stakes
            held through the investor's own entity (IRA, LLC). Present on the
            investor endpoint only.
          properties:
            kind:
              type: string
              enum:
                - individual
                - entity
            name:
              type: string
        investor_count:
          type: integer
          description: The number of distinct investors aggregated into this entry. Present on the syndicate endpoint only.
    PortfolioHolding:
      type: object
      description: |
        A company a fund vehicle invested in — one entry per company, with the
        status of the most recent investment when the fund invested in the same
        company more than once.
      properties:
        company:
          $ref: '#/components/schemas/PortfolioCompanyRef'
        status:
          type: string
          enum:
            - active
            - failed
            - exited
    PortfolioPosition:
      type: object
      description: |
        One position per offering (fundraise). On the investor endpoint the totals
        sum the authenticated investor's stakes; on the syndicate endpoint they sum
        every holder's stakes and `investor_count` is present.
      properties:
        id:
          type: string
          description: The offering's id (`ofr_...`) — a position's identity is its offering.
          example: ofr_9aKxQ2vF8mNp1zT5wY7Qb3Cd
        type:
          type: string
          enum:
            - portfolio_position
            - syndicate_portfolio_position
        attributes:
          type: object
          properties:
            offering_id:
              type: string
              example: ofr_9aKxQ2vF8mNp1zT5wY7Qb3Cd
            company:
              $ref: '#/components/schemas/PortfolioCompanyRef'
            asset_type:
              type: string
              enum:
                - company
                - fund
              description: '`fund` for SPV and fund vehicles; the underlying companies appear in `holdings` where recorded.'
            security:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/SecuritySummary'
              description: What the round issued, as `{ type, label }`. Null when the round has no security recorded.
            status:
              type: string
              enum:
                - active
                - exited
                - sold
                - failed
              description: '`sold` means the stake was transferred away (secondary sale).'
            exit_reason:
              type: string
              nullable: true
              enum:
                - ipo
                - acquisition
                - buyback
                - failed
                - winding_down
                - null
              description: |
                Why the position ended. Set only for `exited` and `failed`
                positions — a `sold` position ended with the transfer itself, and
                some older positions have no recorded ending. `ipo` means the
                company went public; distributions, if any, appear in
                `realized_gain_cents`.
            exited_on:
              type: string
              format: date
              nullable: true
              description: |
                The date the position ended (`YYYY-MM-DD`): the effective date of
                the company's recorded exit. Set only for `exited` and `failed`
                positions, and null for older exits recorded before Wefunder kept
                exit dates, even when `exit_reason` is present.
              example: '2026-08-15'
            invested_at:
              type: string
              format: date-time
              nullable: true
            currency:
              type: string
              description: 'ISO 4217 code, lower-case, of the investment amounts on this position and its `securities` (cost basis, values, gains, share price) — the offering''s currency: `usd`, or `eur` for an ECSP round. A security''s note cap and pre-money valuation carry their own `terms.currency`, which can differ.'
              example: usd
            cost_basis_cents:
              type: integer
            current_value_cents:
              type: integer
              description: Estimated current value. It equals `cost_basis_cents` until a later priced round, a recorded valuation mark, or an exit marks the position, so an active position reading at cost is expected, not missing data.
            unrealized_gain_cents:
              type: integer
              description: Can be negative.
            realized_gain_cents:
              type: integer
            return_multiple:
              type: string
              nullable: true
              description: Decimal string. Null when cost basis is zero.
              example: '1.6492'
            shares_held:
              type: string
              nullable: true
            current_share_price:
              type: string
              nullable: true
              description: Null when the position's securities carry different prices — see the per-entry values.
            securities:
              type: array
              items:
                $ref: '#/components/schemas/PortfolioSecurity'
            holdings:
              type: array
              description: Companies the vehicle invested in, for fund positions. Empty for non-fund positions and for vehicles without recorded holdings.
              items:
                $ref: '#/components/schemas/PortfolioHolding'
            investor_count:
              type: integer
              description: The number of distinct investors in this deal. Present on the syndicate endpoint only.
            as_of:
              type: string
              format: date-time
              description: When the values in this position were last calculated (the oldest timestamp when several underlying records are combined).
    PortfolioPositionListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioPosition'
        meta:
          type: object
          properties:
            has_more:
              type: boolean
            page_count:
              type: integer
            next_cursor:
              type: integer
              nullable: true
              description: Pass as `cursor` to fetch the next page. Absent on the last page.
    PortfolioSummaryEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              example: portfolio_summary
            attributes:
              type: object
              properties:
                currency:
                  type: string
                  description: 'ISO 4217 code, lower-case, of the four `total_*_cents` figures. Money is summed in one currency only: `usd` when any position is in USD, otherwise the portfolio''s only currency (`eur`).'
                  example: usd
                other_currencies:
                  type: array
                  description: Currencies of positions left out of the totals because they are not in `currency` (an investor holding both USD and EUR rounds sees `["eur"]`). Empty for most portfolios. Those positions still count in the status counts and are listed, each with its own `currency`, by the positions endpoint.
                  items:
                    type: string
                  example: []
                total_cost_basis_cents:
                  type: integer
                total_current_value_cents:
                  type: integer
                total_unrealized_gain_cents:
                  type: integer
                total_realized_gain_cents:
                  type: integer
                return_multiple:
                  type: string
                  nullable: true
                  example: '1.3107'
                position_counts:
                  type: object
                  description: Distinct offerings per status.
                  properties:
                    active:
                      type: integer
                    exited:
                      type: integer
                    sold:
                      type: integer
                    failed:
                      type: integer
                as_of:
                  type: string
                  format: date-time
                  nullable: true
    SyndicatePortfolioSummaryEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              example: syndicate_portfolio_summary
            attributes:
              type: object
              properties:
                currency:
                  type: string
                  description: 'ISO 4217 code, lower-case, of the four `total_*_cents` figures. Money is summed in one currency only: `usd` when any position is in USD, otherwise the portfolio''s only currency (`eur`).'
                  example: usd
                other_currencies:
                  type: array
                  description: Currencies of positions left out of the totals because they are not in `currency` (an investor holding both USD and EUR rounds sees `["eur"]`). Empty for most portfolios. Those positions still count in the status counts and are listed, each with its own `currency`, by the positions endpoint.
                  items:
                    type: string
                  example: []
                total_cost_basis_cents:
                  type: integer
                total_current_value_cents:
                  type: integer
                total_unrealized_gain_cents:
                  type: integer
                total_realized_gain_cents:
                  type: integer
                return_multiple:
                  type: string
                  nullable: true
                deal_counts:
                  type: object
                  description: Distinct deals per status.
                  properties:
                    active:
                      type: integer
                    exited:
                      type: integer
                    sold:
                      type: integer
                    failed:
                      type: integer
                investor_count:
                  type: integer
                  description: Distinct investors across the syndicate's funded deals.
                as_of:
                  type: string
                  format: date-time
                  nullable: true
    DealInvestor:
      type: object
      description: |
        JSON:API resource representing a syndicate member's investment in a specific deal.
        Only syndicate members' investments are included (scoped by member user IDs).
      properties:
        id:
          type: string
          description: The investor's id (`usr_...`) — one row per investor, aggregated across their investments in the deal.
          example: usr_aB3xQ9k2vF8mNp1zT5wY7Qc4
        type:
          type: string
          example: deal_investor
        attributes:
          type: object
          properties:
            user_id:
              type: integer
              deprecated: true
              description: Internal integer id. Deprecated — use `user` (`usr_...`) instead.
              example: 456
            user:
              type: string
              description: The investor's id (`usr_...`).
              example: usr_aB3xQ9k2vF8mNp1zT5wY7Qc4
            user_name:
              type: string
              nullable: true
              example: Jane Smith
            user_email:
              type: string
              nullable: true
              description: |
                Investor's email address. Always present: the endpoint itself is
                manager/operator only (ordinary members get 403), so there is no
                non-moderator caller to hide it from.
              example: user@example.com
            avatar_url:
              type: string
              nullable: true
              description: Investor's profile photo URL
              example: https://uploads.wefunder.com/uploads/user/avatar/456/large_photo.jpg
            amount:
              type: string
              description: Total invested in this deal, in whole dollars, as a string
              example: '5000'
            status:
              type: string
              enum:
                - pending
                - confirmed
              description: The investor's most advanced commitment in this deal — `confirmed` is final, `pending` is committed but not yet final.
              example: confirmed
            invested_at:
              type: string
              format: date-time
              description: ISO 8601 timestamp when the investment was created
              example: '2025-03-01T12:00:00Z'
    MemberInvestment:
      type: object
      description: |
        JSON:API resource representing a member's investment in a syndicate deal.
        Scoped to the syndicate's selected deals (one per company, matching directory semantics).
      properties:
        id:
          type: string
          description: Investment id (`inv_...`).
          example: inv_8Kd0aB3xQ9k2vF8mNp1zT5wY
        type:
          type: string
          example: member_investment
        attributes:
          type: object
          properties:
            fundraise_id:
              type: integer
              deprecated: true
              description: Internal integer id. Deprecated — use `offering` (`ofr_...`) instead.
              example: 75496
            offering:
              type: string
              nullable: true
              description: The deal's id (`ofr_...`), accepted by the deal endpoints.
              example: ofr_8Kd0aB3xQ9k2vF8mNp1zT5wY
            company_name:
              type: string
              nullable: true
              description: Name of the company the deal is for
              example: Substack
            amount:
              type: string
              description: Investment amount in whole dollars, as a string
              example: '5000'
            status:
              type: string
              enum:
                - pending
                - confirmed
              description: '`confirmed` is final; `pending` is committed but not yet final.'
              example: confirmed
            created_at:
              type: string
              format: date-time
              description: ISO 8601 timestamp when the investment was created
              example: '2025-03-01T12:00:00Z'
    SyndicateStatistics:
      type: object
      description: Aggregate metrics for a syndicate
      properties:
        type:
          type: string
          example: syndicate_statistics
        attributes:
          type: object
          properties:
            total_members:
              type: integer
              description: Count of active members (excludes resigned and exiled, filters out soft-deleted and hellbanned users)
              example: 45
            members_by_role:
              type: object
              description: Member count grouped by role
              additionalProperties:
                type: integer
              example:
                manager: 3
                member: 35
                invitee: 5
                creator: 1
                applicant: 1
            total_deals:
              type: integer
              description: |
                Rounds in the syndicate's visible deal set, in any state. Excludes invite-only
                companies' rounds and testing-the-waters rounds of directory companies, so this
                is not every round the syndicate has been linked to.
              example: 3
            live_deals:
              type: integer
              description: |
                The open, oversubscribed, or closing subset of `total_deals`; the rows
                `GET /syndicates/{syndicate_id}/deals` lists.
              example: 1
            total_raised:
              type: string
              description: |
                Total amount raised across directory-selected deals (one per company), in whole dollars, as a string.
              example: '107800'
            total_investors:
              type: integer
              description: Count of distinct investors across directory-selected deals (one per company)
              example: 6527
            recent_activity_count:
              type: integer
              description: Count of audit events in the last 30 days for this syndicate
              example: 4
    Intent:
      type: object
      description: JSON:API resource representing an intent (proposed dangerous action)
      properties:
        id:
          type: string
          description: The intent's id (`int_...`). The `review_url` embeds the separate web (UUID) id.
          example: int_aB3xQ9k2vF8mNp1zT5wY7Qc4
        type:
          type: string
          example: intent
        attributes:
          type: object
          properties:
            action:
              type: string
              example: syndicates.remove_member
            status:
              type: string
              enum:
                - pending
                - approved
                - executing
                - executed
                - expired
                - rejected
                - failed
              example: pending
            resource_type:
              type: string
              example: Club
            resource_id:
              oneOf:
                - type: string
                - type: integer
