  /syndicates/{syndicate_id}/members:
    get:
      tags:
        - Syndicate Members
      summary: List members
      description: |
        Returns the member directory for a syndicate with role, status, tags, sidebar notes,
        and investment history summaries. Supports filtering, sorting, search, and pagination.
      operationId: listSyndicateMembers
      security:
        - bearerAuth:
            - read:syndicates
      parameters:
        - $ref: '#/components/parameters/syndicate_id'
        - name: role
          in: query
          schema:
            type: string
          description: Filter by role (e.g. creator, manager, member, invitee, applicant)
        - name: permission
          in: query
          schema:
            type: string
            enum:
              - full_access
              - operator
          description: Filter by syndicate permission level
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or email
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - newest
              - oldest
              - alphabetical
              - last_activity
              - investment_amount
          description: |
            Sort order. `investment_amount` (highest total invested first) is **moderator-only**;
            non-moderators requesting it get the default order. Unknown values fall back to the default.
        - name: has_invested
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: Filter by whether the member has invested in any syndicate deal
        - name: accredited
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          description: '**Moderator-only.** Filter by accreditation status; ignored for non-moderators.'
        - name: tag
          in: query
          schema:
            type: string
          description: Filter by 'can help with' tag (ILIKE match)
        - name: location
          in: query
          schema:
            type: string
          description: Match on city, state, or country (public location data only).
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor from the previous response's `meta.next_cursor`.
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
            maximum: 100
          description: Results per page, 1-100. Defaults to 25.
