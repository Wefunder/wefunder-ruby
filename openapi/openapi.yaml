  /syndicates/{syndicate_id}/deals/{fundraise_id}/investors:
    get:
      tags:
        - Syndicate Deals
      summary: List deal investors
      description: |
        Returns syndicate members who invested in this deal. Results are scoped to
        syndicate member user IDs only and sorted by amount descending.

        **Manager/operator only.** Who invested how much is moderator data, as on the
        web deal pipeline page: an ordinary member, backer, or follower of the syndicate
        gets `403`, even with `read:syndicates`. Callers who pass that gate see
        `user_email`.

        `amount` is whole dollars as a string (e.g. `"5000"` is $5,000).

        Offset-paginated: pass `offset` and `per_page`; `meta` carries `total_count`,
        `offset`, `per_page`, and `has_more`. Without `per_page` the full list is returned.
      operationId: listSyndicateDealInvestors
      security:
        - bearerAuth:
            - read:syndicates
      parameters:
        - $ref: '#/components/parameters/syndicate_id'
        - $ref: '#/components/parameters/fundraise_id'
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of investors to skip.
        - name: per_page
          in: query
          schema:
            type: integer
            maximum: 200
          description: Results per page, 1-200. Omit to return every investor.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealInvestorListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The caller is not a manager or operator of the syndicate (an ordinary member,
            backer, or follower), or the token lacks `read:syndicates`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Deal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
