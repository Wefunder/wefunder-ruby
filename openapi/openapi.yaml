            accreditation:
              type: object
              nullable: true
              properties:
                type:
                  type: string
                  enum:
                    - self_attestation
                    - verified
                  example: verified
                status:
                  type: string
                  enum:
                    - pending
                    - passed
                    - failed
                    - expired
                  example: pending
                basis:
                  type: string
                  nullable: true
                  example: income
                submitted_at:
                  type: string
                  format: date-time
                  nullable: true
            confirmed_at:
              type: string
              format: date-time
              nullable: true
            created_at:
              type: string
              format: date-time
              example: '2025-01-15T10:00:00Z'
    Investor:
      type: object
      description: |
        An investor known to the partner. PII fields (`full_name`, `email`) are only
