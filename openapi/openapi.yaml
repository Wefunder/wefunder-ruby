    post:
      tags:
        - Webhook Endpoints
      summary: Create a webhook endpoint
      description: |
        Registers an endpoint for your application. The response is the only time the
        signing `secret` is returned; store it to verify signatures. Requires an
        owner, admin, or developer role in the application's organization.

        On the sandbox API this returns `403 manage_endpoints_on_live_api`: create test
        endpoints through the live API with `mode: "test"`, and they are mirrored into sandbox.
      operationId: createWebhookEndpoint
      security:
        - bearerAuth:
            - write:webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
                - events
              properties:
                url:
                  type: string
                  format: uri
                  description: Public HTTPS URL to receive deliveries (private/internal IPs rejected).
                  example: https://yourapp.com/webhooks/wefunder
                events:
                  type: array
                  minItems: 1
                  description: Event names to subscribe to (from the event catalog). At least one.
                  items:
                    type: string
                    enum:
                      - investment.created
                      - investment.reinstated
                      - investment.canceled
                      - investment.converted
                      - investment.amount_changed
                      - investment.executed
                      - offering.opened
                      - offering.closing
                      - offering.closed
                      - offering.canceled
                      - investment_session.created
                      - investment_session.started
                      - investment_session.completed
                      - investment_session.expired
                      - investment_session.canceled
                      - investment.changed
                      - syndicate_member.invited
                      - syndicate_member.reinvited
                      - syndicate_member.applied
                      - syndicate_member.approved
                      - syndicate_member.joined
                  example:
                    - offering.opened
                    - investment.executed
                mode:
                  type: string
                  enum:
                    - live
                    - test
                  default: live
      responses:
        '201':
          description: Endpoint created (includes the one-time secret)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error (bad URL, unknown or missing events, invalid mode, or quota reached)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: JavaScript
          label: '@wefunder/sdk'
          source: |-
            const endpoint = await wf.webhookEndpoints.create({
              url: "https://yourapp.com/webhooks/wefunder", // public HTTPS (localhost/private IPs rejected)
              events: ["offering.opened", "investment.executed", "investment.changed"],
              mode: "live",
            });
            // Store this now — it's needed by constructEvent() and is never shown again.
            const signingSecret = endpoint.attributes?.secret;
            console.log(endpoint.id, signingSecret);
        - lang: Python
          label: wefunder
          source: |-
            endpoint = wf.webhook_endpoints.create(
                url="https://yourapp.com/webhooks/wefunder",  # public HTTPS; localhost / private IPs are rejected
                events=["offering.opened", "investment.executed"],
                mode="live",  # "test" endpoints receive sandbox events
            )
            # The signing secret is returned ONLY here and on rotate — store it now.
            save_secret(endpoint.attributes.secret)
