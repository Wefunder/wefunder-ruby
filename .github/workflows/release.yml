name: Release

# Publishes to RubyGems when a version tag is pushed. Release flow:
#   edit lib/wefunder/version.rb (e.g. 0.1.0.beta2) + ruby script/build_examples_manifest.rb
#   git commit -am "0.1.0.beta2" && git tag v0.1.0.beta2 && git push --follow-tags
#
# Auth is RubyGems TRUSTED PUBLISHING (OIDC) — no API key to store/rotate/leak. One-time
# RubyGems setup: gem `wefunder` → Trusted publishers → add GitHub Actions publisher
# (repository Wefunder/wefunder-ruby, workflow release.yml, environment rubygems). For a gem
# that does not exist yet, create it as a "pending" trusted publisher from your profile.
# Pre-release versions (letters in the version) are not what `gem install wefunder` resolves
# to, so the canonical pre-GA install is `gem install wefunder --pre` (README says so).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write # release-gem creates the GitHub release notes
      id-token: write # OIDC: trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # Guard: the pushed tag must match the gem version (v0.1.0.beta2 ⇄ 0.1.0.beta2).
      - name: Verify tag matches gem version
        run: |
          PKG=$(bundle exec ruby -Ilib -e 'require "wefunder/version"; puts Wefunder::VERSION')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME ($TAG) != gem version ($PKG)"
            exit 1
          fi
      # The release gate: same checks as CI.
      - run: bundle exec rubocop && bundle exec rspec --exclude-pattern "spec/e2e/**/*_spec.rb"
      - uses: rubygems/release-gem@v1
